function modal(inner){
  document.getElementById('modal').innerHTML =
    '<div class="scrim" onclick="chiudiModale(event)"><div class="sheet" onclick="event.stopPropagation()">'+
    '<div class="grab"></div>'+inner+'</div></div>';
  document.body.style.overflow = 'hidden';
}
function chiudiModale(e){
  if(e && e.target && !e.target.classList.contains('scrim')) return;
  document.getElementById('modal').innerHTML = '';
  document.body.style.overflow = '';
}
function chiudi(){ document.getElementById('modal').innerHTML=''; document.body.style.overflow=''; }
function testa(titolo){
  return '<div class="sh"><h3>'+esc(titolo)+'</h3><button onclick="chiudi()" aria-label="Chiudi">×</button></div>';
}

/* ── nuova / modifica spesa ── */
function apriNuova(){
  S.draft = {id:null, imp:'', val:'CHF', desc:'', d:oggi(), cat:'altro', need:1, diviso:false, manual:false, auto:false};
  renderSheetSpesa(true);
}
function apriSpesa(id){
  var s = null;
  for(var i=0;i<S.spese.length;i++) if(S.spese[i].id===id) s = S.spese[i];
  if(!s) return;
  S.draft = {id:s.id, imp:s.imp, val:s.val, desc:s.desc, d:s.d, cat:s.cat, need:num(s.need),
    diviso:!!s.diviso, manual:true, auto:false, ric:s.ric};
  renderSheetSpesa(true);
}
/* La riga sotto l'importo: il conto della calcolatrice, il cambio, la metà. */
function notaImporto(){
  var d = S.draft, e = espressione(d.imp), v = importo(d.imp), parti = [];
  if(e!=null) parti.push('fa <b>'+chf2(e)+'</b>');
  if(d.val==='EUR' && v>0) parti.push('al cambio '+S.cfg.fx+' sono <b>CHF '+chf2(inCHF(v,'EUR',S.cfg.fx))+'</b>');
  if(d.diviso && v>0) parti.push('registro la tua metà, <b>CHF '+chf2(inCHF(v,d.val,S.cfg.fx)/2)+'</b>');
  return parti.join(' · ');
}
function aggiornaNota(){
  var n = document.getElementById('impNote');
  if(!n) return;
  var t = notaImporto();
  n.innerHTML = t;
  n.hidden = !t;
}
function onImp(v){ S.draft.imp = v; aggiornaNota(); }

/* Le spese che scrivi più spesso: un tocco e sono già compilate. */
function boxRapide(){
  var fr = speseFrequenti(8);
  if(!fr.length) return '';
  return '<div class="qk">'+fr.map(function(v,i){
    return '<button type="button" onclick="usaRapida('+i+')" title="'+esc(v.desc)+'">'+
      '<i style="background:'+cat(v.cat).c+'"></i><span><b>'+esc(v.desc)+'</b>'+
      '<em>'+chf2(v.tipico)+' '+esc(v.val)+' · '+v.n+'×</em></span></button>';
  }).join('')+'</div>';
}
function usaRapida(i){
  var v = speseFrequenti(8)[i];
  if(!v) return;
  S.draft.desc = v.desc; S.draft.cat = v.cat; S.draft.need = num(v.need);
  S.draft.val = v.val||'CHF'; S.draft.manual = true; S.draft.auto = true;
  if(!importo(S.draft.imp)) S.draft.imp = v.tipico;
  vibra(8);
  renderSheetSpesa(true);
}

function boxData(){
  var d = S.draft;
  var scelte = [[oggi(),'Oggi'], [shiftGiorni(oggi(),-1),'Ieri'], [shiftGiorni(oggi(),-2),'L\'altroieri']];
  return '<div class="seg" style="margin-bottom:8px">'+scelte.map(function(s){
      return '<button type="button" class="'+(d.d===s[0]?'on':'')+'" onclick="setData(\''+s[0]+'\')">'+s[1]+'</button>';
    }).join('')+
    '<button type="button" class="'+(scelte.map(function(s){return s[0];}).indexOf(d.d)<0?'on':'')+
    '" onclick="apriData()">Altro giorno</button></div>'+
    '<input type="date" id="dData" value="'+esc(d.d)+'" max="'+oggi()+'" onchange="setData(this.value)">';
}
function setData(v){
  if(!v) return;
  S.draft.d = v;
  var b = document.getElementById('dataBox');
  if(b) b.innerHTML = boxData();
}
function apriData(){
  var el = document.getElementById('dData');
  if(!el) return;
  try{ if(el.showPicker) el.showPicker(); else el.focus(); }catch(e){ el.focus(); }
}

function renderSheetSpesa(fuoco){
  var d = S.draft;
  var h = testa(d.id?'Modifica spesa':'Nuova spesa');
  h += '<div class="inline" style="margin-bottom:8px">'+
    '<input type="text" inputmode="decimal" id="dImp" value="'+esc(d.imp)+'" placeholder="0.00" '+
      'autocomplete="off" style="font-size:26px;font-weight:600;text-align:right;padding:14px;font-family:var(--mono)" '+
      'oninput="onImp(this.value)">'+
    '<div class="seg xs" id="valBox" style="width:104px;flex:none">'+segValuta()+'</div></div>';
  var nota = notaImporto();
  h += '<div class="note" id="impNote" style="margin-top:0;margin-bottom:12px"'+(nota?'':' hidden')+'>'+nota+'</div>';
  h += '<div class="hint" style="margin:-6px 0 12px">Puoi scrivere anche un conto: <b>12+8.50</b> oppure <b>3x4.20</b>.</div>';

  if(!d.id) h += boxRapide();

  h += '<div class="field"><label>Cos\'era</label>'+
    '<input type="text" id="dDesc" value="'+esc(d.desc)+'" placeholder="Es. Migros, benzina, cena fuori" '+
    'oninput="onDesc(this.value)" autocomplete="off"></div>';
  h += '<div class="field"><label>Quando</label><div id="dataBox">'+boxData()+'</div></div>';
  h += '<div id="catBox">'+boxCategoria()+'</div>';
  if(S.cfg.chiedeNecessita!==false){
    h += '<div class="field"><label>Serviva?</label><div id="needBox">'+segNecessita(d.need,'setNeedDraft')+'</div>'+
      '<div class="hint">È la domanda che fa la differenza a fine mese. Rispondi di pancia, ci metti un secondo.</div></div>';
  }
  h += '<div class="field"><label>Divisa con qualcuno</label><div class="seg" id="divBox">'+segDiviso()+'</div>'+
    '<div class="hint">Con "metà a testa" registro solo la tua parte, ma resta scritto quanto hai anticipato.</div></div>';
  h += '<div class="btn2" style="margin-top:16px">'+
    (d.id?'<button class="btn ghost" style="color:var(--warn)" onclick="eliminaSpesa(\''+d.id+'\')">Elimina</button>':'')+
    '<button class="btn acc" id="btnSalvaSpesa" onclick="salvaSpesa()">'+(d.id?'Salva':'Aggiungi')+'</button></div>';
  if(!d.id) h += '<button class="btn ghost sm" style="margin-top:9px" onclick="salvaSpesa(1)">Aggiungi e passa alla prossima</button>';
  else h += '<button class="btn ghost sm" style="margin-top:9px" onclick="duplicaSpesa(\''+d.id+'\')">Duplicala a oggi</button>';
  modal(h);
  if(fuoco) setTimeout(function(){
    var el = document.getElementById(importo(d.imp)>0 ? 'dDesc' : 'dImp');
    if(el) el.focus();
  }, 60);
}
function segValuta(){
  return ['CHF','EUR'].map(function(v){
    return '<button type="button" class="'+(S.draft.val===v?'on':'')+'" onclick="setValutaDraft(\''+v+'\')">'+v+'</button>';
  }).join('');
}
function segDiviso(){
  return [[false,'Tutta mia'],[true,'Metà a testa']].map(function(o){
    return '<button type="button" class="'+(!!S.draft.diviso===o[0]?'on':'')+'" onclick="setDivisoDraft('+o[0]+')">'+o[1]+'</button>';
  }).join('');
}
function boxCategoria(){
  var d = S.draft;
  return '<div class="field"><label>Categoria'+
    (d.auto&&!d.manual?' <span class="tagline" style="margin-left:6px">riconosciuta</span>':'')+'</label>'+
    '<div class="chips">'+CATS.map(function(k){
      return '<button type="button" class="'+(d.cat===k.id?'on':'')+'" onclick="setCatDraft(\''+k.id+'\')">'+
        '<i style="background:'+k.c+'"></i>'+esc(k.nome)+'</button>';
    }).join('')+'</div>'+
    (d.auto&&!d.manual?'<div class="hint">L\'ho dedotta da quello che hai scritto. Se sbaglio, tocca quella giusta: me la ricordo per la prossima volta.</div>':'')+
  '</div>';
}
function onDesc(v){
  S.draft.desc = v;
  if(S.draft.manual) return;
  var r = detect(v);
  if(r.sicura){
    S.draft.cat = r.cat; S.draft.need = r.need; S.draft.auto = true;
    var box = document.getElementById('catBox');
    if(box) box.innerHTML = boxCategoria();
    var nb = document.getElementById('needBox');
    if(nb) nb.innerHTML = segNecessita(S.draft.need,'setNeedDraft');
  }
}
function setCatDraft(id){
  S.draft.cat = id; S.draft.manual = true;
  var box = document.getElementById('catBox'); if(box) box.innerHTML = boxCategoria();
}
function setNeedDraft(n){
  S.draft.need = n;
  var nb = document.getElementById('needBox');
  if(nb) nb.innerHTML = segNecessita(n,'setNeedDraft');
  else {
    var seg = document.querySelector('.seg.needs');
    if(seg) seg.outerHTML = segNecessita(n,'setNeedDraft');
  }
}
function setValutaDraft(v){
  S.draft.val = v;
  var b = document.getElementById('valBox'); if(b) b.innerHTML = segValuta();
  aggiornaNota();
}
function setDivisoDraft(b){
  S.draft.diviso = b;
  var el = document.getElementById('divBox'); if(el) el.innerHTML = segDiviso();
  aggiornaNota();
}
function salvaSpesa(continua){
  var d = S.draft, imp = importo(d.imp);
  if(imp<=0){
    toast('Manca l\'importo.');
    var el = document.getElementById('dImp'); if(el) el.focus();
    return;
  }
  var fx = S.cfg.fx;
  var chfTot = inCHF(imp, d.val, fx);
  var mio = d.diviso ? chfTot/2 : chfTot;
  if(d.manual && d.desc) imparaRegola(d.desc, d.cat, d.need);
  if(d.id){
    for(var i=0;i<S.spese.length;i++) if(S.spese[i].id===d.id){
      var vecchia = S.spese[i];
      var fxv = vecchia.fx||fx;
      S.spese[i] = {id:d.id, d:d.d, imp:imp, val:d.val, fx:fxv, chf:(d.diviso?0.5:1)*inCHF(imp, d.val, fxv),
        desc:d.desc, cat:d.cat, need:d.need, diviso:d.diviso, ric:vecchia.ric, ricId:vecchia.ricId, t:vecchia.t};
    }
  } else {
    S.spese.push({id:uid(), d:d.d, imp:imp, val:d.val, fx:fx, chf:mio, desc:d.desc,
      cat:d.cat, need:d.need, diviso:d.diviso, ric:false, t:Date.now()});
    if(meseDi(d.d)!==S.mese && meseDi(d.d)<=meseOggi()) S.mese = meseDi(d.d);
  }
  vibra(10);
  if(continua && !d.id){
    var g = d.d, vl = d.val;
    S.draft = {id:null, imp:'', val:vl, desc:'', d:g, cat:'altro', need:1, diviso:false, manual:false, auto:false};
    save(); render(); renderSheetSpesa(true);
    toast('CHF '+chf2(mio)+' registrati. Vai con la prossima.');
    return;
  }
  S.draft = null; save(); chiudi(); render();
  if(!d.id) messaggioDopoSpesa(mio, d);
}
/* Il ritorno più utile dopo aver salvato: dove ti lascia questa spesa. */
function messaggioDopoSpesa(mio, d){
  var bg = budgetGiornaliero(meseOggi());
  var b = pos(S.cfg.budget[d.cat]);
  if(b>0){
    var sp = calc(meseDi(d.d)).perCat[d.cat]||0;
    if(sp>b){ toast(cat(d.cat).nome+': sei oltre il budget di CHF '+chf(sp-b)+'.'); return; }
    if(sp>b*0.85){ toast(cat(d.cat).nome+': CHF '+chf(b-sp)+' e hai finito il budget.'); return; }
  }
  if(bg && meseDi(d.d)===meseOggi()){
    if(bg.giorno<0) toast('Registrata. Sei già oltre il margine del mese.');
    else toast('Registrata. Ti restano CHF '+chf(bg.giorno)+' al giorno.');
    return;
  }
  toast('CHF '+chf2(mio)+' registrati.');
}
function duplicaSpesa(id){
  var s = null, i;
  for(i=0;i<S.spese.length;i++) if(S.spese[i].id===id) s = S.spese[i];
  if(!s) return;
  var n = {id:uid(), d:oggi(), imp:num(s.imp), val:s.val, fx:S.cfg.fx,
    chf:(s.diviso?0.5:1)*inCHF(num(s.imp), s.val, S.cfg.fx), desc:s.desc, cat:s.cat,
    need:num(s.need), diviso:!!s.diviso, ric:false, t:Date.now()};
  S.spese.push(n);
  S.mese = meseOggi();
  S.draft = null; save(); chiudi(); render();
  toast('Copiata a oggi.', 'Annulla', function(){
    S.spese = S.spese.filter(function(x){ return x.id!==n.id; });
    save(); render();
  });
}
function eliminaSpesa(id){
  var s = null, i;
  for(i=0;i<S.spese.length;i++) if(S.spese[i].id===id) s = S.spese[i];
  if(!s) return;
  var copia = JSON.parse(JSON.stringify(s));
  S.spese = S.spese.filter(function(x){ return x.id!==id; });
  S.draft = null; save(); chiudi(); render();
  toast('Spesa eliminata.', 'Annulla', function(){
    S.spese.push(copia);
    if(copia.ricId && S.applicati.indexOf(meseDi(copia.d)+'|'+copia.ricId)<0)
      S.applicati.push(meseDi(copia.d)+'|'+copia.ricId);
    save(); render();
  });
}

/* ── spese fisse ── */
function apriRicorrenti(){ renderSheetRic(); }
function aggiornaSheetRic(){
  var m = document.getElementById('modal');
  if(m && m.innerHTML) renderSheetRic();
}
function renderSheetRic(){
  var m = S.mese;
  var h = testa('Spese fisse');
  h += '<p class="lede">Quelle che paghi ogni mese. Con "aggiungi" le registro nel mese che stai guardando ('+nomeMese(m)+'), '+
    'con la data e la categoria giuste, senza riscriverle.</p>';
  var attive = S.ricorrenti.filter(function(r){ return r.attiva!==false; });
  var daFare = attive.filter(function(r){ return S.applicati.indexOf(m+'|'+r.id)<0; });
  if(daFare.length) h += '<button class="btn acc" style="margin-bottom:14px" onclick="applicaTutte()">Aggiungi tutte a '+nomeMese(m,1)+' ('+chf(daFare.reduce(function(t,r){return t+inCHF(r.imp,r.val,r.fx||S.cfg.fx);},0))+')</button>';
  h += '<div class="card">'+(S.ricorrenti.length? S.ricorrenti.map(function(r,i){
    var fatta = S.applicati.indexOf(m+'|'+r.id)>=0;
    var off = r.attiva===false;
    return '<div class="erow" style="'+(off?'opacity:.45':'')+'">'+
      '<span class="dot" style="background:'+cat(r.cat).c+'"></span>'+
      '<div class="en">'+esc(r.nome)+'<em>'+cat(r.cat).nome+' · '+esc(r.val||'CHF')+'</em></div>'+
      '<input class="ev" type="number" inputmode="decimal" value="'+esc(r.imp||'')+'" oninput="S.ricorrenti['+i+'].imp=num(this.value);save()">'+
      '<button class="del" style="font-size:13px;color:'+(fatta?'var(--ok)':'var(--accent)')+';font-weight:600" '+
        'onclick="'+(fatta?'annullaRic':'applicaRic')+'(\''+r.id+'\')">'+(fatta?'fatta':'aggiungi')+'</button>'+
      '<button class="del" onclick="toggleRic(\''+r.id+'\')" title="Attiva/sospendi">'+(off?'▷':'❚❚')+'</button>'+
      '<button class="del" onclick="delRic(\''+r.id+'\')">×</button></div>';
  }).join('') : '<div class="empty">Nessuna spesa fissa.</div>')+'</div>';
  h += '<div class="h2">Aggiungine una</div>'+
    '<div class="addrow"><input type="text" id="nrNome" placeholder="Nome">'+
    '<input class="sm" type="number" inputmode="decimal" id="nrImp" placeholder="CHF">'+
    '<button onclick="addRicorrente()">+</button></div>'+
    '<div class="note">Totale fisse attive: <b>CHF '+chf(totRicorrenti())+' al mese</b>, cioè '+chf(totRicorrenti()*12)+' all\'anno.</div>';
  h += '<button class="btn ghost" style="margin-top:14px" onclick="chiudi()">Chiudi</button>';
  modal(h);
}
function addRicorrente(){
  var n = document.getElementById('nrNome'), v = document.getElementById('nrImp');
  if(!n||!n.value.trim()) return;
  var d = detect(n.value);
  S.ricorrenti.push({id:uid(), nome:n.value.trim(), imp:num(v.value), val:'CHF', cat:d.cat, need:d.need, attiva:true});
  save(); aggiornaSheetRic(); render();
}
function toggleRic(id){
  for(var i=0;i<S.ricorrenti.length;i++) if(S.ricorrenti[i].id===id)
    S.ricorrenti[i].attiva = (S.ricorrenti[i].attiva===false);
  save(); aggiornaSheetRic(); render();
}
function delRic(id){
  S.ricorrenti = S.ricorrenti.filter(function(r){ return r.id!==id; });
  save(); aggiornaSheetRic(); render();
}
function applicaRic(id, silenzioso){
  var r = null, i;
  for(i=0;i<S.ricorrenti.length;i++) if(S.ricorrenti[i].id===id) r = S.ricorrenti[i];
  if(!r || num(r.imp)<=0){ if(!silenzioso) toast('Prima metti l\'importo.'); return false; }
  var m = S.mese;
  if(S.applicati.indexOf(m+'|'+r.id)>=0) return false;
  var giorno = Math.min(num(r.giorno)||1, giorniMese(m));
  var data = m+'-'+String(giorno).padStart(2,'0');
  if(m===meseOggi() && data>oggi()) data = oggi();
  S.spese.push({id:uid(), d:data, imp:num(r.imp), val:r.val||'CHF', fx:S.cfg.fx,
    chf:inCHF(r.imp, r.val, S.cfg.fx), desc:r.nome, cat:r.cat, need:num(r.need), diviso:false,
    ric:true, ricId:r.id, t:Date.now()});
  S.applicati.push(m+'|'+r.id);
  if(!silenzioso){ save(); aggiornaSheetRic(); render(); }
  return true;
}
function annullaRic(id){
  var m = S.mese;
  S.spese = S.spese.filter(function(s){ return !(s.ricId===id && meseDi(s.d)===m); });
  S.applicati = S.applicati.filter(function(k){ return k!==m+'|'+id; });
  save(); aggiornaSheetRic(); render();
}
function applicaTutteDa(m){
  var prima = S.mese;
  S.mese = m; applicaTutte(); S.mese = prima; save(); render();
}
function applicaTutte(){
  var n = 0, tot = 0;
  S.ricorrenti.forEach(function(r){
    if(r.attiva===false || num(r.imp)<=0) return;
    if(applicaRic(r.id, true)){ n++; tot += inCHF(r.imp, r.val, r.fx||S.cfg.fx); }
  });
  save(); aggiornaSheetRic(); render();
  if(n) toast(n+(n===1?' spesa fissa aggiunta':' spese fisse aggiunte')+' per CHF '+chf(tot)+'.');
  else toast('Erano già tutte registrate.');
}

/* Una spesa che torna ogni mese diventa una spesa fissa: non la riscrivi più. */
function promuoviRicorrente(k){
  var ab = abbonamentiRilevati(), v = null, i;
  for(i=0;i<ab.length;i++) if(ab[i].k===k) v = ab[i];
  if(!v){ toast('Non la trovo più fra le ricorrenti.'); return; }
  var nid = uid();
  S.ricorrenti.push({id:nid, nome:v.desc, imp:Math.round(v.imp*100)/100, val:'CHF',
    cat:v.cat||'altro', need:num(v.need), giorno:1, attiva:true});
  S.letti.push('rilev-'+k);
  save(); render();
  toast('"'+v.desc+'" ora è una spesa fissa da CHF '+chf2(v.imp)+'.', 'Annulla', function(){
    S.ricorrenti = S.ricorrenti.filter(function(r){ return r.id!==nid; });
    S.letti = S.letti.filter(function(x){ return x!=='rilev-'+k; });
    save(); render();
  });
}

/* La rassegna: tutto quello che ti scala i soldi da solo, in una schermata sola. */
function apriRassegna(){
  var att = S.ricorrenti.filter(function(r){ return r.attiva!==false && num(r.imp)>0; });
  var tot = 0, i;
  for(i=0;i<att.length;i++) tot += inCHF(att[i].imp, att[i].val, att[i].fx||S.cfg.fx);
  var ab = abbonamentiRilevati();
  var h = testa('Rassegna degli automatismi');
  h += '<div class="hero" style="margin-bottom:14px"><div class="l">Ti escono da soli</div>'+
    '<div class="v">CHF '+chf(tot*12)+'</div><div class="s">all\'anno, cioè '+chf(tot)+
    ' al mese su '+att.length+(att.length===1?' voce attiva':' voci attive')+
    '. Disdirne una che non usi vale più di cento piccole rinunce.</div></div>';
  h += '<p class="lede">Per ognuna, una domanda sola: l\'ho usata questo mese? Se la risposta è no due volte di fila, '+
    'il pulsante di pausa è lì.</p>';
  h += '<div class="card">'+(att.length? att.slice().sort(function(a,b){
      return inCHF(b.imp,b.val,b.fx||S.cfg.fx)-inCHF(a.imp,a.val,a.fx||S.cfg.fx);
    }).map(function(r){
      var v = inCHF(r.imp, r.val, r.fx||S.cfg.fx);
      return '<div class="row"><span class="dot" style="background:'+cat(r.cat).c+'"></span>'+
        '<div class="n">'+esc(r.nome)+'<em>'+cat(r.cat).nome+' · '+chf(v*12)+' all\'anno</em></div>'+
        '<div class="v">'+chf2(v)+'</div>'+
        '<button class="del" style="font-size:12px;color:var(--warn);font-weight:600" '+
        'onclick="sospendiDaRassegna(\''+r.id+'\')">sospendi</button></div>';
    }).join('') : '<div class="empty">Nessuna spesa fissa attiva.</div>')+'</div>';
  if(ab.length){
    h += '<div class="h2">Rilevate dalle tue spese</div><div class="card">'+
      '<p class="lede">Compaiono ogni mese con lo stesso importo ma non sono fra le fisse.</p>'+
      ab.slice(0,6).map(function(v){
        return '<div class="row"><span class="dot" style="background:'+cat(v.cat).c+'"></span>'+
          '<div class="n">'+esc(v.desc)+'<em>'+v.mesi+' mesi di fila · '+chf(v.imp*12)+' all\'anno</em></div>'+
          '<div class="v">'+chf2(v.imp)+'</div>'+
          '<button class="del" style="font-size:12px;color:var(--accent);font-weight:600" '+
          'onclick="promuoviRicorrente(\''+esc(v.k)+'\')">aggiungi</button></div>';
      }).join('')+'</div>';
  }
  h += '<button class="btn acc" style="margin-top:16px" onclick="chiudiRassegna()">Fatto, li ho guardati tutti</button>'+
    '<button class="btn ghost sm" style="margin-top:9px" onclick="chiudi()">Più tardi</button>';
  modal(h);
}
function sospendiDaRassegna(id){
  toggleRic(id);
  apriRassegna();
  toast('Sospesa. Non conta più nel totale mensile.');
}
function chiudiRassegna(){
  statoTask().rassegna = oggi();
  save(); chiudi(); render();
  toast('Rassegna fatta. Te la ripropongo fra un paio di mesi.');
}

    '<div class="field"><label>Saldo attuale (CHF)</label><input type="number" inputmode="decimal" id="ncS" placeholder="0"></div>'+

/* ── investimenti ── */
function apriNuovoInvest(){
  var h = testa('Nuova posizione')+
    '<div class="field"><label>Nome</label><input type="text" id="iN" placeholder="Es. VWCE, Swisscanto 3a"></div>'+
    '<div class="field"><label>Tipo</label><select id="iT">'+TIPI_INV.map(function(t){
      return '<option value="'+t.id+'">'+t.n+'</option>'; }).join('')+'</select></div>'+
    '<div class="inline" style="margin-bottom:14px">'+
      '<div class="field" style="margin:0"><label>Quantità</label><input type="number" inputmode="decimal" id="iQ" value="1"></div>'+
      '<div class="field" style="margin:0"><label>Prezzo medio</label><input type="number" inputmode="decimal" id="iP" placeholder="0"></div>'+
      '<div class="field" style="margin:0;flex:none;width:88px"><label>Valuta</label><select id="iV"><option>CHF</option><option>EUR</option></select></div>'+
    '</div>'+
    '<div class="field"><label>Prezzo attuale</label><input type="number" inputmode="decimal" id="iA" placeholder="uguale al medio se non lo sai"></div>'+
    '<div class="note">Per un 3° pilastro o un conto titoli senza quote: lascia quantità 1 e metti il valore versato come prezzo medio, il valore di oggi come prezzo attuale.</div>'+
    '<button class="btn acc" style="margin-top:14px" onclick="salvaInvest()">Aggiungi</button>';
  modal(h);
}
function salvaInvest(){
  var n = document.getElementById('iN').value.trim();
  if(!n){ toast('Manca il nome.'); return; }
  var pmc = num(document.getElementById('iP').value);
  var att = num(document.getElementById('iA').value) || pmc;
  S.invest.push({id:uid(), nome:n, tipo:document.getElementById('iT').value,
    qta:num(document.getElementById('iQ').value)||1, pmc:pmc, prezzo:att,
    val:document.getElementById('iV').value, fx:S.cfg.fx, storico:[{d:oggi(), v:att}]});
  snapPatrimonio(); save(); chiudi(); render();
}
function apriInvest(id){
  var p=null,i;
  for(i=0;i<S.invest.length;i++) if(S.invest[i].id===id) p=S.invest[i];
  if(!p) return;
  var v = inCHF(num(p.qta)*num(p.prezzo), p.val, p.fx||S.cfg.fx);
  var c = inCHF(num(p.qta)*num(p.pmc), p.val, p.fx||S.cfg.fx);
  var h = testa(p.nome)+
    '<div class="kpi"><div><div class="l">Valore</div><div class="v">'+chf(v)+'</div></div>'+
    '<div><div class="l">Costo</div><div class="v">'+chf(c)+'</div></div>'+
    '<div><div class="l">Guadagno</div><div class="v '+(v-c>=0?'pos':'neg')+'">'+(v-c>=0?'+':'−')+chf(Math.abs(v-c))+'</div></div></div>'+
    '<div class="field"><label>Prezzo di oggi ('+esc(p.val)+')</label>'+
      '<input type="number" inputmode="decimal" id="pPrezzo" value="'+esc(p.prezzo)+'"></div>'+
    '<button class="btn acc" onclick="aggiornaPrezzo(\''+id+'\')">Aggiorna prezzo</button>'+
    '<div class="h2">Nuovo versamento</div>'+
    '<p class="lede">Hai comprato altre quote? Scrivi quante e a che prezzo: ricalcolo io il prezzo medio di carico.</p>'+
    '<div class="addrow"><input class="sm" type="number" inputmode="decimal" id="vQ" placeholder="quantità">'+
    '<input class="sm" type="number" inputmode="decimal" id="vP" placeholder="prezzo">'+
    '<button onclick="aggiungiQuote(\''+id+'\')">+</button></div>'+
    '<div class="btn2" style="margin-top:18px"><button class="btn ghost" style="color:var(--warn)" onclick="delInvest(\''+id+'\')">Elimina</button>'+
    '<button class="btn ghost" onclick="chiudi()">Chiudi</button></div>';
  modal(h);
}
function aggiornaPrezzo(id){
  var v = importo(document.getElementById('pPrezzo').value);
  for(var i=0;i<S.invest.length;i++) if(S.invest[i].id===id){
    S.invest[i].prezzo = v;
    if(!S.invest[i].storico) S.invest[i].storico=[];
    S.invest[i].storico.push({d:oggi(), v:v});
  }
  snapPatrimonio(); save(); chiudi(); render();
  toast('Prezzo aggiornato. Portafoglio: CHF '+chf(valoreInvest())+'.');
}
function aggiungiQuote(id){
  var q = num(document.getElementById('vQ').value), pr = num(document.getElementById('vP').value);
  if(q<=0||pr<=0){ toast('Servono quantità e prezzo.'); return; }
  for(var i=0;i<S.invest.length;i++) if(S.invest[i].id===id){
    var p = S.invest[i];
    var qTot = num(p.qta)+q;
    p.pmc = (num(p.qta)*num(p.pmc) + q*pr)/qTot;
    p.qta = qTot; p.prezzo = pr;
  }
  snapPatrimonio(); save(); chiudi(); render();
}
function delInvest(id){
  var p = null, i;
  for(i=0;i<S.invest.length;i++) if(S.invest[i].id===id) p = S.invest[i];
  if(!p) return;
  var copia = JSON.parse(JSON.stringify(p));
  S.invest = S.invest.filter(function(x){ return x.id!==id; });
  snapPatrimonio(); save(); chiudi(); render();
  toast('"'+copia.nome+'" tolta dal portafoglio.', 'Annulla', function(){
    S.invest.push(copia); snapPatrimonio(); save(); render();
  });
}

/* ── obiettivi ── */
function apriNuovoObiettivo(){ apriObiettivo(null); }
function apriObiettivo(id){
  var o = null, i;
  if(id) for(i=0;i<S.obiettivi.length;i++) if(S.obiettivi[i].id===id) o = S.obiettivi[i];
  var nuovo = !o;
  o = o || {id:null, nome:'', target:'', acc:0, scad:''};
  var h = testa(nuovo?'Nuovo obiettivo':'Modifica obiettivo');
  if(nuovo) h += '<div class="chips" style="margin-bottom:14px">'+PRESET_OB.map(function(p){
    return '<button onclick="document.getElementById(\'oN\').value=\''+p+'\'">'+esc(p)+'</button>'; }).join('')+'</div>';
  h += '<div class="field"><label>Nome</label><input type="text" id="oN" value="'+esc(o.nome)+'" placeholder="Es. Cauzione casa"></div>'+
    '<div class="field"><label>Quanto ti serve (CHF)</label><input type="number" inputmode="decimal" id="oT" value="'+esc(o.target)+'" placeholder="0"></div>'+
    '<div class="field"><label>Entro quando</label><input type="date" id="oD" value="'+esc(o.scad)+'">'+
    '<div class="hint">Senza una data non posso calcolare quanto serve al mese.</div></div>'+
    '<div class="field"><label>Già messi da parte (CHF)</label><input type="number" inputmode="decimal" id="oA" value="'+esc(o.acc||'')+'" placeholder="0"></div>'+
    '<div class="field"><label>Priorità nel piano</label><div class="seg" id="prioBox">'+
      PRIO.map(function(pr){
        return '<button type="button" class="'+(num(o.prio==null?1:o.prio)===pr.v?'on':'')+
          '" data-p="'+pr.v+'" onclick="setPrioDraft('+pr.v+')">'+pr.n+'</button>';
      }).join('')+'</div>'+
      '<div class="hint">Quando quello che avanza non basta per tutti, il piano serve prima gli obiettivi con priorità alta.</div></div>'+
    '<button class="btn acc" onclick="salvaObiettivo('+(o.id?'\''+o.id+'\'':'null')+')">Salva</button>';
  _prioDraft = num(o.prio==null?1:o.prio);
  modal(h);
}
var _prioDraft = 1;
function setPrioDraft(v){
  _prioDraft = v;
  var b = document.getElementById('prioBox');
  if(!b) return;
  var bs = b.getElementsByTagName('button');
  for(var i=0;i<bs.length;i++) bs[i].className = (num(bs[i].getAttribute('data-p'))===v?'on':'');
}
function salvaObiettivo(id){
  var n = document.getElementById('oN').value.trim();
  if(!n){ toast('Manca il nome.'); return; }
  var dati = {nome:n, target:num(document.getElementById('oT').value),
    scad:document.getElementById('oD').value, acc:num(document.getElementById('oA').value)};
  if(id){
    for(var i=0;i<S.obiettivi.length;i++) if(S.obiettivi[i].id===id){
      S.obiettivi[i].nome=dati.nome; S.obiettivi[i].target=dati.target;
      S.obiettivi[i].scad=dati.scad; S.obiettivi[i].acc=dati.acc; S.obiettivi[i].prio=_prioDraft;
    }
  } else {
    S.obiettivi.push({id:uid(), nome:dati.nome, target:dati.target, scad:dati.scad,
      acc:dati.acc, prio:_prioDraft, creato:oggi()});
  }
  save(); chiudi(); render();
  toast(id?'Obiettivo aggiornato.':'Obiettivo creato. Ora compare nel piano del mese.');
}
function versaObiettivo(id){
  var o=null,i;
  for(i=0;i<S.obiettivi.length;i++) if(S.obiettivi[i].id===id) o=S.obiettivi[i];
  if(!o) return;
  var manca = Math.max(0, num(o.target)-num(o.acc));
  /* la cifra proposta è quella del piano, non un numero a caso */
  var piano = pianoObiettivi(), riga = null;
  for(i=0;i<piano.righe.length;i++) if(piano.righe[i].o.id===id) riga = piano.righe[i];
  var suggerita = riga && riga.assegnato>0 ? Math.round(riga.assegnato/4.345)
    : (pos(S.cfg.targetRisparmio)? Math.min(manca||pos(S.cfg.targetRisparmio), pos(S.cfg.targetRisparmio)) : '');
  if(suggerita>manca && manca>0) suggerita = Math.round(manca);
  var h = testa('Accantona su "'+o.nome+'"')+
    '<p class="lede">Assegni una parte dei tuoi risparmi a questo obiettivo. Non muove soldi tra i conti: serve a sapere quanto di quello che hai è già promesso.</p>'+
    '<div class="field"><label>Quanto (CHF)</label><input type="number" inputmode="decimal" id="vaImp" '+
      'value="'+suggerita+'" placeholder="0"></div>'+
    '<div class="note">Ora ci sono <b>CHF '+chf(o.acc)+'</b>'+(num(o.target)>0?', mancano '+chf(manca):'')+'.'+
      (riga && riga.assegnato>0? ' Il piano gli assegna CHF '+chf(riga.assegnato)+' al mese: la quota di una settimana è '+
        chf(riga.assegnato/4.345)+'.':'')+'</div>'+
    '<div class="btn2" style="margin-top:14px"><button class="btn ghost" onclick="versaImporto(\''+id+'\',-1)">Togli</button>'+
    '<button class="btn acc" onclick="versaImporto(\''+id+'\',1)">Aggiungi</button></div>';
  modal(h);
}
function versaImporto(id, segno){
  var v = importo(document.getElementById('vaImp').value)*segno;
  var o = null, i;
  for(i=0;i<S.obiettivi.length;i++) if(S.obiettivi[i].id===id){
    S.obiettivi[i].acc = Math.max(0, num(S.obiettivi[i].acc)+v);
    o = S.obiettivi[i];
  }
  save(); chiudi(); render();
  if(!o) return;
  var manca = Math.max(0, num(o.target)-num(o.acc));
  if(manca<=0 && num(o.target)>0) toast('"'+o.nome+'" è pieno. Obiettivo raggiunto.');
  else if(v>0) toast('CHF '+chf(v)+' su "'+o.nome+'". Mancano '+chf(manca)+'.');
  else toast('Aggiornato: CHF '+chf(o.acc)+' accantonati.');
}
function delObiettivo(id){
  var o = null, i;
  for(i=0;i<S.obiettivi.length;i++) if(S.obiettivi[i].id===id) o = S.obiettivi[i];
  if(!o) return;
  var copia = JSON.parse(JSON.stringify(o));
  S.obiettivi = S.obiettivi.filter(function(x){ return x.id!==id; });
  save(); render();
  toast('"'+copia.nome+'" eliminato.', 'Annulla', function(){
    S.obiettivi.push(copia); save(); render();
  });
}

/* ══════════════════════════════════════════════════════════════
   17. BACKUP
   ══════════════════════════════════════════════════════════════ */
function scarica(nome, testo, tipo){
  try{
    var b = new Blob([testo], {type:tipo||'application/json'});
    var u = URL.createObjectURL(b);
    var a = document.createElement('a');
    a.href = u; a.download = nome; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 1500);
  }catch(e){ toast('Il browser ha bloccato il download. Apri l\'app dal link, non da un\'anteprima.'); }
}
function esportaJSON(){
  scarica('bilancio-'+oggi()+'.json', JSON.stringify(S,null,1));
  S.ultimoBackup = oggi(); save();
  setTimeout(function(){ render(); toast('Backup nei tuoi download. Tienilo dove non lo perdi.'); }, 400);
}
function esportaCSV(){
  var righe = [['data','descrizione','categoria','necessita','importo','valuta','chf','divisa','fissa'].join(';')];
  S.spese.slice().sort(function(a,b){ return a.d<b.d?-1:1; }).forEach(function(s){
    righe.push([s.d, '"'+String(s.desc||'').replace(/"/g,'""')+'"', cat(s.cat).nome,
      NEEDS[num(s.need)]?NEEDS[num(s.need)].breve:'utile', num(s.imp).toFixed(2), s.val,
      num(s.chf).toFixed(2), s.diviso?'si':'no', s.ric?'si':'no'].join(';'));
  });
  scarica('spese-'+oggi()+'.csv', righe.join('\n'), 'text/csv');
}
function importaJSON(input){
  var f = input.files && input.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!d || !d.cfg || !Array.isArray(d.spese)) throw new Error('formato');
      if(!confirm('Sostituisco i dati di adesso con questo backup da '+d.spese.length+' spese? L\'operazione non si annulla.')) return;
      S = normalizza(d); save(); render();
      toast('Backup ripristinato: '+S.spese.length+' spese.');
    }catch(e){ toast('Questo file non sembra un backup di Bilancio.'); }
  };
  r.readAsText(f);
  input.value = '';
}
function azzera(){
  if(!confirm('Cancello tutto: spese, conti, investimenti, obiettivi. Sicuro?')) return;
  if(!confirm('Ultima conferma. Hai fatto il backup?')) return;
  S = statoIniziale(); save(); render();
}

/* ══════════════════════════════════════════════════════════════
   18. SHELL
   ══════════════════════════════════════════════════════════════ */
var TABS = [
  {k:'home', n:'Riepilogo', p:'M3 10.5 12 3l9 7.5M5.5 9.5V21h13V9.5'},
  {k:'spese', n:'Spese', p:'M3 7h18M3 12h18M3 17h11'},
  {k:'risparmi', n:'Risparmi', p:'M4 19V9m5 10V5m5 14v-7m5 7V8'},
  {k:'invest', n:'Investimenti', p:'M3 17l5.5-5.5 3.5 3.5L21 6M21 6h-5m5 0v5'},
  {k:'obiettivi', n:'Obiettivi', p:'M12 3v18M3 12h18M12 7.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z'}
];
var TITOLI = {home:'Riepilogo', spese:'Spese', risparmi:'Risparmi', invest:'Investimenti', obiettivi:'Obiettivi', set:'Impostazioni'};
function sottotitolo(){
  var t = S.tab;
  if(t==='home') return S.cfg.nome? 'Ciao '+S.cfg.nome.toUpperCase() : 'IL TUO MESE';
  if(t==='spese') return 'CATEGORIE E BUDGET';
  if(t==='risparmi') return 'LIQUIDITÀ E FONDO EMERGENZA';
  if(t==='invest') return 'PORTAFOGLIO';
  if(t==='obiettivi') return 'DOVE STAI ANDANDO';
  return 'DATI E PREFERENZE';
}
var _tabPrec = null;
function render(){
  var app = document.getElementById('app');
  chiudiSettimana();
  if(!S.setup){ app.innerHTML = viewSetup(); return; }
  var cambio = (_tabPrec !== S.tab);
  _tabPrec = S.tab;
  var body =
    S.tab==='spese' ? tabSpese() :
    S.tab==='risparmi' ? tabRisparmi() :
    S.tab==='invest' ? tabInvest() :
    S.tab==='obiettivi' ? tabObiettivi() :
    S.tab==='set' ? tabSet() : tabHome();
  var h = '<div class="top"><div class="ttl"><h1>'+TITOLI[S.tab]+'</h1><div class="sub">'+esc(sottotitolo())+'</div></div>'+
    '<button class="ico" onclick="go(\''+(S.tab==='set'?'home':'set')+'\')" aria-label="Impostazioni">'+
    (S.tab==='set'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>')+
    '</button></div>';
  h += '<div class="wrap'+(cambio?' anim':'')+'">'+body+'</div>';
  h += '<div class="tabs">'+TABS.map(function(t){
    return '<button class="tab '+(S.tab===t.k?'on':'')+'" onclick="go(\''+t.k+'\')" aria-label="'+esc(t.n)+
      '" aria-current="'+(S.tab===t.k?'page':'false')+'"><span class="ind"></span>'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="'+t.p+'"/></svg>'+
      '<span>'+t.n+'</span></button>';
  }).join('')+'</div>';
  if(S.tab!=='set') h += '<button class="fab" onclick="apriNuova()" aria-label="Nuova spesa">+</button>';
  app.innerHTML = h;
}
function go(k){
  chiudi();
  S.tab = k;
  if(k==='spese') S.filtro = {cat:null, need:null, q:''};
  save(); render(); window.scrollTo(0,0);
}

/* ══════════════════════════════════════════════════════════════
   19. AVVIO
   ══════════════════════════════════════════════════════════════ */
function normalizza(d){
  var base = statoIniziale();
  var s = Object.assign({}, base, d||{});
  s.cfg = Object.assign({}, base.cfg, (d&&d.cfg)||{});
  ['spese','ricorrenti','conti','invest','obiettivi','regole','letti','applicati','snap'].forEach(function(k){
    if(!Array.isArray(s[k])) s[k] = [];
  });
  /* v1 → v2: priorità sugli obiettivi, stato dei task, data dell'ultimo backup.
     Tutto con un default sensato, così un backup vecchio si apre senza perdere niente. */
  s.v = 2;
  s.obiettivi = s.obiettivi.map(function(o){
    if(o.prio==null) o.prio = 1;
    o.acc = num(o.acc); o.target = num(o.target);
    return o;
  });
  if(!s.task || typeof s.task!=='object') s.task = {};
  if(typeof s.task.sett !== 'string') s.task.sett = settimanaOggi();
  if(!s.task.voci || typeof s.task.voci!=='object') s.task.voci = {};
  if(!Array.isArray(s.task.storico)) s.task.storico = [];
  s.task.streak = num(s.task.streak);
  s.task.tot = num(s.task.tot);
  if(!s.task.snapAcc || typeof s.task.snapAcc!=='object'){
    s.task.snapAcc = {};
    s.obiettivi.forEach(function(o){ s.task.snapAcc[o.id] = num(o.acc); });
  }
  if(typeof s.ultimoBackup !== 'string') s.ultimoBackup = '';
  if(s.cfg.task !== false) s.cfg.task = true;
  if(s.letti.length>400) s.letti = s.letti.slice(-400);
  if(!s.cfg.budget || typeof s.cfg.budget!=='object') s.cfg.budget = {};
  if(!Array.isArray(s.cfg.extra)) s.cfg.extra = [];
  s.spese = s.spese.filter(function(x){ return x && x.id && x.d; }).map(function(x){
    x.chf = num(x.chf); x.imp = num(x.imp); x.need = num(x.need);
    if(!x.val) x.val = 'CHF';
    if(!x.cat || !CATS.some(function(k){ return k.id===x.cat; })) x.cat = 'altro';
    return x;
  });
  s.mese = meseOggi();
  s.filtro = {cat:null, need:null, q:''};
  s.draft = null;
  return s;
}
function avvia(){
  S = normalizza(load());
  if(!S.snap.length && (saldoConti()>0 || valoreInvest()>0)) snapPatrimonio();
  chiudiSettimana();
  render();
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ chiudi(); chiudiToast(); }
  /* da tastiera: n per una nuova spesa, purché non stia già scrivendo da qualche parte */
  var t = e.target && e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT') return;
  if((e.key==='n'||e.key==='N') && !e.metaKey && !e.ctrlKey && S && S.setup && !document.getElementById('modal').innerHTML){
    e.preventDefault(); apriNuova();
  }
});
/* Tornando sull'app dopo giorni, la settimana e il mese devono essere quelli veri.
   Sposto il mese solo se è scattato davvero mentre l'app era aperta: se stavi
   guardando ottobre di proposito, ci resti. */
var _meseSessione = meseOggi();
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState!=='visible' || !S || !S.setup) return;
  if(meseOggi() !== _meseSessione){
    if(S.mese === _meseSessione) S.mese = meseOggi();
    _meseSessione = meseOggi();
  }
  chiudiSettimana(); render();
});
