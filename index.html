<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bilancio">
<meta name="description" content="Spese, budget, obiettivi e task settimanali. Capisci dove finiscono i tuoi soldi. I dati restano sul tuo dispositivo.">
<meta name="theme-color" content="#F5F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
<title>Bilancio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2316211D'/%3E%3Crect x='40' y='96' width='22' height='44' rx='8' fill='%232a78d6'/%3E%3Crect x='79' y='68' width='22' height='72' rx='8' fill='%231baf7a'/%3E%3Crect x='118' y='40' width='22' height='100' rx='8' fill='%23eb6834'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2316211D'/%3E%3Crect x='40' y='96' width='22' height='44' rx='8' fill='%232a78d6'/%3E%3Crect x='79' y='68' width='22' height='72' rx='8' fill='%231baf7a'/%3E%3Crect x='118' y='40' width='22' height='100' rx='8' fill='%23eb6834'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light dark;
  --bg:#F5F7F5; --card:#FFFFFF; --card2:#FAFBFA; --ink:#16211D; --mute:#6B7A74;
  --line:#E1E7E2; --line2:#EEF2EE; --accent:#1F4E8C; --accent-soft:#E8EFF7;
  --ok:#2D7A4F; --ok-soft:#E6F2EA; --warn:#C4453A; --warn-soft:#FDF0EE;
  --amber:#A96F1F; --amber-soft:#FBF2E4;
  --hero-bg:#16211D; --hero-ink:#FFFFFF;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4;
  --c6:#008300; --c7:#4a3aa7; --c8:#e34948; --c9:#8A968F;
  --sys:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono','Menlo','Roboto Mono',monospace;
  --safeb:env(safe-area-inset-bottom,0px);
  --safet:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121714; --card:#1C221F; --card2:#232A26; --ink:#ECF1EE; --mute:#95A29B;
    --line:#2C3531; --line2:#242B27; --accent:#6FA8E8; --accent-soft:#1E2B38;
    --ok:#5FBF88; --ok-soft:#172A20; --warn:#F08A80; --warn-soft:#2E1D1B;
    --amber:#E0A65A; --amber-soft:#2C2418;
    --hero-bg:#253029; --hero-ink:#ECF1EE;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181;
    --c6:#008300; --c7:#9085e9; --c8:#e66767; --c9:#8A968F;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);}
body{font-family:var(--sys);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit;}
h1,h2,h3,h4{margin:0;}

/* ── shell ── */
#app{padding-bottom:calc(104px + var(--safeb));}
.top{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--safet) + 12px) 16px 11px;
  display:flex;align-items:flex-end;gap:10px;}
.top .ttl{flex:1;min-width:0;}
.top h1{font-size:25px;font-weight:700;letter-spacing:-.5px;}
.top .sub{font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:.6px;margin-top:3px;
  text-transform:uppercase;}
.top .ico{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mute);}
.top .ico svg{width:19px;height:19px;}
.wrap{padding:16px 16px 26px;max-width:660px;margin:0 auto;}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
  background:var(--card);background:color-mix(in srgb,var(--card) 94%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--safeb);}
.tab{flex:1;border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;
  align-items:center;gap:3px;cursor:pointer;color:var(--mute);}
.tab svg{width:22px;height:22px;}
.tab span{font-size:10px;font-weight:500;letter-spacing:.1px;}
.tab.on{color:var(--accent);}

/* ── cards ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}
.card.flat{padding:0;overflow:hidden;}
.card.pad{padding:14px 16px;}
.h2{font-size:11.5px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--mute);
  margin:22px 0 9px;display:flex;align-items:baseline;gap:8px;}
.h2:first-child{margin-top:0;}
.h2 .r{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.2px;text-transform:none;}
.h2 button{margin-left:auto;border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;
  cursor:pointer;letter-spacing:0;text-transform:none;padding:0;}
.lede{font-size:13px;line-height:1.5;color:var(--mute);margin:0 0 12px;}

.kpi{display:flex;gap:9px;margin-bottom:12px;}
.kpi>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 11px;min-width:0;}
.kpi .l{font-family:var(--mono);font-size:9px;letter-spacing:.7px;text-transform:uppercase;color:var(--mute);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi .v{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.6px;margin-top:4px;}
.kpi .s{font-size:10.5px;color:var(--mute);margin-top:2px;line-height:1.3;}
.kpi .v.pos{color:var(--ok);} .kpi .v.neg{color:var(--warn);}

.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:16px;padding:19px 18px;margin-bottom:12px;}
.hero .l{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.62;}
.hero .v{font-family:var(--mono);font-size:38px;font-weight:600;letter-spacing:-1.5px;margin:5px 0 6px;}
.hero .s{font-size:12.5px;line-height:1.5;opacity:.85;}
.hero .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden;margin:12px 0 7px;}
.hero .bar i{display:block;height:100%;border-radius:4px;background:var(--hero-ink);opacity:.9;transition:width .4s;}
.hero .foot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;opacity:.7;}

/* ── righe ── */
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line2);}
.row:last-child{border-bottom:0;}
.row.tap{cursor:pointer;}
.dot{width:10px;height:10px;border-radius:50%;flex:none;}
.row .n{flex:1;font-size:14.5px;font-weight:500;min-width:0;}
.row .n em{font-style:normal;display:block;font-size:11.5px;color:var(--mute);font-weight:400;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .v{font-family:var(--mono);font-size:15px;font-weight:600;text-align:right;white-space:nowrap;}
.row .v span{display:block;font-size:10px;color:var(--mute);font-weight:400;}
.del{border:0;background:none;color:var(--mute);font-size:19px;padding:0 2px;cursor:pointer;line-height:1;flex:none;}
.muted{color:var(--mute);}
.empty{text-align:center;padding:26px 14px;color:var(--mute);font-size:13px;line-height:1.55;}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px;}

/* ── form ── */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin-bottom:6px;}
.field .hint{font-size:11.5px;color:var(--mute);font-weight:400;margin-top:5px;line-height:1.45;}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{
  width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:var(--card2);outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--card);}
input[type=number]{font-family:var(--mono);font-weight:500;}
input::placeholder{color:var(--mute);opacity:.65;}
.inline{display:flex;gap:8px;}
.inline>*{flex:1;min-width:0;}
.inline .sm{flex:none;width:108px;}
.inline .xs{flex:none;width:86px;}

.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);
  font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);}
.btn.acc{background:var(--accent);color:#fff;}
.btn.sm{padding:10px;font-size:13.5px;}
.btn:active{opacity:.75;}
.btn2{display:flex;gap:8px;}
.btn2 .btn{margin-top:0;}

.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:9px 4px;font-size:13px;font-weight:500;
  color:var(--mute);cursor:pointer;min-width:0;}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.07);}
.seg.needs button.on[data-n="0"]{color:var(--ok);}
.seg.needs button.on[data-n="1"]{color:var(--amber);}
.seg.needs button.on[data-n="2"]{color:var(--warn);}

.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 12px;
  font-size:12.5px;cursor:pointer;color:var(--mute);display:flex;align-items:center;gap:6px;}
.chips button.on{border-color:var(--ink);color:var(--ink);font-weight:600;}
.chips button i{width:8px;height:8px;border-radius:50%;display:block;}

.pb{height:8px;background:var(--line2);border-radius:5px;overflow:hidden;margin:9px 0 6px;}
.pb i{display:block;height:100%;border-radius:5px;transition:width .4s;}
.pbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mute);}

.note{font-size:12px;line-height:1.55;color:var(--mute);background:var(--card2);
  border-left:3px solid var(--line);border-radius:0 8px 8px 0;padding:11px 13px;margin-top:12px;}
.note b{color:var(--ink);}
.note.warn{background:var(--warn-soft);border-left-color:var(--warn);}
.note.ok{background:var(--ok-soft);border-left-color:var(--ok);}
.note.amber{background:var(--amber-soft);border-left-color:var(--amber);}

.alert{display:flex;gap:11px;padding:13px 14px;border-radius:13px;margin-bottom:9px;border:1px solid var(--line);
  background:var(--card);align-items:flex-start;}
.alert .ai{width:24px;height:24px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;font-family:var(--mono);}
.alert .ab{flex:1;min-width:0;}
.alert .ab h4{font-size:13.5px;font-weight:600;margin-bottom:3px;}
.alert .ab p{margin:0;font-size:12.5px;line-height:1.5;color:var(--mute);}
.alert .ab p b{color:var(--ink);}
.alert .ax{border:0;background:none;color:var(--mute);font-size:17px;line-height:1;padding:0 0 0 4px;cursor:pointer;flex:none;}
.alert.w{background:var(--warn-soft);border-color:transparent;} .alert.w .ai{background:var(--warn);color:#fff;}
.alert.a{background:var(--amber-soft);border-color:transparent;} .alert.a .ai{background:var(--amber);color:#fff;}
.alert.g{background:var(--ok-soft);border-color:transparent;} .alert.g .ai{background:var(--ok);color:#fff;}
.alert.i .ai{background:var(--line2);color:var(--mute);}

.tagline{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
  letter-spacing:.4px;padding:3px 7px;border-radius:6px;background:var(--line2);color:var(--mute);}
.tagline.n0{background:var(--ok-soft);color:var(--ok);}
.tagline.n1{background:var(--amber-soft);color:var(--amber);}
.tagline.n2{background:var(--warn-soft);color:var(--warn);}

/* ── sheet / modale ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;display:flex;align-items:flex-end;
  justify-content:center;animation:fade .18s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet{background:var(--bg);width:100%;max-width:660px;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + var(--safeb));
  max-height:92vh;overflow-y:auto;animation:up .22s ease;}
.sheet .sh{display:flex;align-items:center;margin-bottom:14px;gap:10px;}
.sheet .sh h3{flex:1;font-size:18px;font-weight:700;letter-spacing:-.3px;}
.sheet .sh button{border:0;background:var(--line2);color:var(--mute);width:30px;height:30px;border-radius:50%;
  font-size:17px;line-height:1;cursor:pointer;}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px;}

/* ── fab ── */
.fab{position:fixed;right:16px;bottom:calc(88px + var(--safeb));z-index:29;width:56px;height:56px;border-radius:18px;
  border:0;background:var(--accent);color:#fff;font-size:28px;line-height:1;cursor:pointer;
  box-shadow:0 6px 18px rgba(31,78,140,.34);}
.fab:active{transform:scale(.94);}

/* ── charts ── */
svg.chart{display:block;width:100%;overflow:visible;}
.cbar{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);cursor:pointer;}
.cbar:last-child{border-bottom:0;}
.cbar .cl{flex:none;width:96px;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cbar .ct{flex:1;height:10px;background:var(--line2);border-radius:5px;overflow:hidden;min-width:24px;}
.cbar .ct i{display:block;height:100%;border-radius:5px;}
.cbar .cv{flex:none;font-family:var(--mono);font-size:12.5px;font-weight:600;width:74px;text-align:right;}
.cbar .cv em{font-style:normal;display:block;font-size:9.5px;color:var(--mute);font-weight:400;}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px;}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--mute);}
.legend i{width:9px;height:9px;border-radius:3px;display:block;}

/* ── onboarding ── */
.ob{max-width:540px;margin:0 auto;padding:calc(var(--safet) + 26px) 20px 44px;}
.ob .prog{display:flex;gap:5px;margin-bottom:24px;}
.ob .prog i{flex:1;height:3px;border-radius:2px;background:var(--line);}
.ob .prog i.on{background:var(--ink);}
.ob .step{font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);margin-bottom:9px;}
.ob h2{font-size:25px;font-weight:700;letter-spacing:-.5px;margin-bottom:7px;line-height:1.16;}
.ob p.q{font-size:14px;line-height:1.55;color:var(--mute);margin:0 0 20px;}
.addrow{display:flex;gap:8px;margin-top:10px;}
.addrow input{flex:1;min-width:0;}
.addrow input.sm{flex:none;width:94px;text-align:right;}
.addrow select{flex:none;width:120px;}
.addrow button{flex:none;width:46px;border:1px solid var(--line);background:var(--card);border-radius:11px;
  font-size:22px;color:var(--ink);cursor:pointer;padding:0;}
.erow{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px solid var(--line2);}
.erow:last-child{border-bottom:0;}
.erow .en{flex:1;min-width:0;font-size:14px;}
.erow .en em{font-style:normal;display:block;font-size:11px;color:var(--mute);margin-top:1px;}
.erow .ev{flex:none;width:96px;padding:9px 8px;text-align:right;font-family:var(--mono);font-size:14px;
  font-weight:500;border:1px solid var(--line);border-radius:9px;background:var(--card2);}
@media (min-width:700px){
  .top{padding-left:calc((100% - 660px)/2 + 16px);padding-right:calc((100% - 660px)/2 + 16px);}
  .tabs{padding-left:calc((100% - 660px)/2);padding-right:calc((100% - 660px)/2);}
  .fab{right:calc((100% - 660px)/2 + 16px);}
}
@media (prefers-color-scheme:dark){
  .btn.acc,.fab{color:#0E1512;}
  .fab{box-shadow:0 6px 18px rgba(0,0,0,.5);}
  .hero .bar{background:rgba(255,255,255,.12);}
}
.hidden{display:none !important;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* ══════════════════════════════════════════════════════════════
   v2 — profondità, movimento, nuovi componenti
   ══════════════════════════════════════════════════════════════ */
:root{
  --r1:10px; --r2:14px; --r3:18px;
  --sh1:0 1px 2px rgba(16,32,26,.05), 0 1px 1px rgba(16,32,26,.035);
  --sh2:0 10px 30px rgba(16,32,26,.12), 0 2px 6px rgba(16,32,26,.06);
  --ease:cubic-bezier(.22,.9,.28,1);
}
@media (prefers-color-scheme:dark){
  :root{ --sh1:0 1px 2px rgba(0,0,0,.35); --sh2:0 12px 32px rgba(0,0,0,.55); }
}
.card,.kpi>div{box-shadow:var(--sh1);}
.hero{position:relative;overflow:hidden;box-shadow:var(--sh2);}
.hero>*{position:relative;z-index:1;}
.hero:before{content:'';position:absolute;top:-70%;right:-25%;width:76%;height:220%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,255,255,.11),transparent 72%);}
.btn,.chips button,.seg button,.tab{transition:transform .12s var(--ease),color .18s var(--ease),
  background .18s var(--ease),border-color .18s var(--ease);}
.btn:active,.chips button:active{transform:scale(.985);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:7px;}

/* ingresso della vista, solo al cambio di sezione */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.anim>*{animation:rise .34s var(--ease) both;}
.anim>*:nth-child(2){animation-delay:.03s}
.anim>*:nth-child(3){animation-delay:.06s}
.anim>*:nth-child(4){animation-delay:.09s}
.anim>*:nth-child(5){animation-delay:.12s}
.anim>*:nth-child(6){animation-delay:.15s}
.anim>*:nth-child(n+7){animation-delay:.18s}

/* barre che crescono */
@keyframes barx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.88) rotate(-14deg)}to{opacity:1;transform:none}}
.cbar .ct i,.pb i,.hero .bar i,.nb i{transform-origin:left center;
  animation:barx .5s var(--ease) both;animation-delay:calc(var(--i,0)*42ms);}

/* ── tab bar ── */
.tab{position:relative;}
.tab .ind{position:absolute;top:0;left:50%;transform:translateX(-50%);height:2.5px;width:0;
  border-radius:0 0 3px 3px;background:var(--accent);transition:width .26s var(--ease);}
.tab.on .ind{width:24px;}

/* ── toast ── */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safeb));z-index:60;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);border-radius:13px;padding:12px 15px;font-size:13.5px;font-weight:500;
  display:flex;align-items:center;gap:15px;box-shadow:var(--sh2);max-width:min(560px,calc(100% - 32px));
  animation:toastin .26s var(--ease);}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;font-size:13px;cursor:pointer;
  text-decoration:underline;padding:0;white-space:nowrap;flex:none;}
.toast.out{animation:toastout .22s var(--ease) forwards;}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastout{to{opacity:0;transform:translate(-50%,12px)}}

/* ── donut ── */
.ring{display:flex;align-items:center;gap:16px;}
.ring .rg{flex:none;width:132px;height:132px;position:relative;}

.ring .rc b{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.6px;display:block;}
.ring .rc em{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--mute);}
.ring .rl{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
.ring .rl span{display:flex;align-items:center;gap:7px;font-size:12px;min-width:0;}
.ring .rl i{width:9px;height:9px;border-radius:3px;flex:none;}

.ring .rl b{font-family:var(--mono);font-size:11.5px;font-weight:600;flex:none;}
@media (max-width:400px){ .ring{gap:12px} .ring .rg{width:112px;height:112px} }

/* ── calendario del mese ── */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal .cw{font-family:var(--mono);font-size:8.5px;color:var(--mute);text-align:center;
  letter-spacing:.4px;text-transform:uppercase;padding-bottom:2px;}
.cal .cd{aspect-ratio:1;border-radius:7px;background:var(--line2);position:relative;cursor:pointer;
  display:flex;align-items:flex-start;justify-content:flex-end;padding:3px 4px;border:0;
  font-family:var(--mono);font-size:8.5px;color:var(--mute);transition:transform .14s var(--ease);}
.cal .cd:active{transform:scale(.92);}
.cal .cd.vuoto{background:transparent;cursor:default;pointer-events:none;}
.cal .cd.oggi{box-shadow:0 0 0 2px var(--accent);}
.cal .cd.hi{color:#fff;font-weight:600;}
.cal .cd.futuro{opacity:.32;}
.calscale{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:10.5px;color:var(--mute);
  font-family:var(--mono);}
.calscale i{width:13px;height:9px;border-radius:2px;display:block;}

/* ── task dinamici ── */
.tk{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line2);}
.tk:last-child{border-bottom:0;}
.tk .cb{width:23px;height:23px;border-radius:50%;border:1.8px solid var(--line);flex:none;background:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px;
  margin-top:1px;transition:all .2s var(--ease);}
.tk .cb:active{transform:scale(.85);}
.tk.done .cb{background:var(--ok);border-color:var(--ok);color:#fff;}
.tk .tb{flex:1;min-width:0;}
.tk .tb h4{font-size:14px;font-weight:600;margin-bottom:2px;line-height:1.3;}
.tk .tb p{margin:0;font-size:12px;line-height:1.45;color:var(--mute);}
.tk .tb p b{color:var(--ink);}
.tk.done .tb h4{text-decoration:line-through;color:var(--mute);font-weight:500;}
.tk.done .tb p{opacity:.6;}
.tk .go{border:0;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 10px;
  font-size:11.5px;font-weight:600;cursor:pointer;flex:none;margin-top:1px;}
.tk .tp{flex:none;font-family:var(--mono);font-size:10px;color:var(--mute);padding-top:3px;}

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════

/* Dizionario per la categorizzazione automatica.

var KW = [
  ['casa',0,['affitto','pigione','cauzione','ail','aet','sel ','swisscom','sunrise','salt','wingo','yallo','internet','wifi','elettricit','corrente','luce','gas','acqua','riscaldamento','serafe','billag','canone','assicurazione casa','economia domestica','rc privata','mobilia','inquilin','sacchi','rifiuti','tassa base','condominio','pulizie','idraulico','elettricista','traslo','ikea cucina','affitto box','posteggio mensile']],

  ['trasp',0,['benzina','diesel','carburante','socar','tamoil','agip','eni ','shell','esso','bp ','avia','migrol','coop pronto','oil!','distributore','autostrada','vignetta','pedaggio','telepass','casello','ffs','sbb','cff','arcobaleno','tpl','abbonamento treno','metà prezzo','meta prezzo','ag ','biglietto treno','bus','autopostale','parcheggio','posteggio','park','autosilo','meccanico','garage','carrozzeria','gomme','pneumatici','revisione','tagliando','bollo auto','assicurazione auto','targa','autolavaggio','uber','taxi','car sharing','mobility','leasing','rata auto','ricambi','olio motore']],
  ['fuori',2,['ristorante','ristorante','trattoria','osteria','pizzeria','pizza','bar ','caffè','caffe','cafe','mcdonald','burger','kebab','sushi','poke','take away','takeaway','asporto','starbucks','chiosco','gelateria','gelato','pasticceria','aperitivo','pranzo','cena','colazione','brunch','uber eats','just eat','smood','deliveroo','glovo','birra','vino fuori','cocktail','mensa','distributore snack','autogrill']],
  ['shop',2,['zara','h&m','zalando','amazon','media markt','mediaworld','interdiscount','fust','melectronics','ikea','decathlon','nike','adidas','dosenbach','ochsner','manor','globus','vestiti','abbigliamento','scarpe','giacca','pantaloni','maglia','apple','galaxus','digitec','temu','shein','aliexpress','profumeria','douglas','marionnaud','regalo','giocattoli','arredamento','mobili','casalinghi','jumbo','obi','brico','action','tedi','libreria','cartoleria']],
  ['salute',0,['farmacia','medico','dottore','dentista','ortodont','ottica','occhiali','lenti','palestra','fitness','gym','piscina','cassa malati','assicurazione malattia','css','helsana','swica','sanitas','assura','concordia','visita','analisi','laborator','fisioterap','psicolog','ospedale','pronto soccorso','vaccino','integratori','franchigia','premio salute','massaggi','parrucchiere','barbiere','estetista']],
  ['svago',2,['netflix','spotify','disney','prime video','amazon prime','youtube premium','dazn','sky','now tv','apple tv','icloud','google one','dropbox','abbonamento','subscription','cinema','concerto','teatro','museo','mostra','evento','biglietti','viaggio','vacanza','hotel','booking','airbnb','volo','easyjet','ryanair','swiss ','wizz','lufthansa','trenitalia','italo','playstation','steam','nintendo','xbox','videogioc','libri','kindle','corso','udemy','coursera','discoteca','festa','regali amici','hobby','sport','sci','skipass','campeggio']],
  ['fin',0,['imposte','tasse','acconto','iva','fisco','cantonale','comunale','federale','commissioni','interessi','banca','postfinance','ubs','raiffeisen','bcs','banca stato','revolut','neon','yuh','wise','n26','multa','contravvenzione','notaio','avvocato','prestito','rata prestito','credito','carta di credito','quota carta','cambio valuta','bollo','permesso','patente','naturalizz','pilastro','3a','previdenza','lpp','avs']]
];

/* ══════════════════════════════════════════════════════════════
   2. STATO
   ══════════════════════════════════════════════════════════════ */
var KEY = 'bilancio_v1';
var S = null;

function statoIniziale(){
  return {
    v:1, setup:false, tab:'home', mese:meseOggi(), obStep:0,
    cfg:{
      nome:'', entrata:0, mensilita:12, extra:[],
      fx:0.95, fxData:'', sogliaEvitabile:80, targetRisparmio:0, targetTasso:0,
      budget:{}, chiedeNecessita:true
    },
    spese:[], ricorrenti:[], conti:[], invest:[], obiettivi:[], regole:[],
    letti:[], applicati:[], draft:null
  };
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ /* spazio esaurito o modalità privata: l'app continua a funzionare in memoria */ }
}
function load(){
  try{ var r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
  return null;
}

/* ══════════════════════════════════════════════════════════════
   3. UTILI
   ══════════════════════════════════════════════════════════════ */
function num(v){ var n = parseFloat(String(v==null?'':v).replace(/'/g,'').replace(',','.')); return isFinite(n)?n:0; }
function pos(v){ var n = num(v); return n>0?n:0; }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(n,d){
  n = num(n); d = d==null?0:d;
  var s = Math.abs(n).toFixed(d);
  var p = s.split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, "'");
  return (n<0?'−':'') + p.join('.');
}
function chf(n){ return fmt(n,0); }
function chf2(n){ return fmt(n, Math.abs(num(n))<1000 ? 2 : 0); }
function pct(n){ return (num(n)>=0?'':'−') + Math.abs(num(n)).toFixed(0) + '%'; }

function oggi(){ var d=new Date(); return iso(d); }
function iso(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function meseOggi(){ return oggi().slice(0,7); }
function meseDi(dstr){ return String(dstr||'').slice(0,7); }
var MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
var MESI3 = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function nomeMese(m,corto){
  var p = String(m).split('-'); var i = parseInt(p[1],10)-1;
  if(!(i>=0&&i<12)) return m;
  return (corto?MESI3[i]:MESI[i]) + ' ' + p[0];
}
function meseShift(m,k){
  var p = String(m).split('-'); var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1+k, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function giorniMese(m){ var p=String(m).split('-'); return new Date(parseInt(p[0],10), parseInt(p[1],10), 0).getDate(); }
function giorniPassati(m){
  if(m !== meseOggi()) return giorniMese(m);
  return new Date().getDate();
}
function dataBreve(dstr){
  var p = String(dstr).split('-');
  if(p.length<3) return dstr;
  return parseInt(p[2],10)+' '+MESI3[parseInt(p[1],10)-1];
}
function giorniTra(a,b){
  var da = new Date(a+'T00:00:00'), db = new Date(b+'T00:00:00');
  return Math.round((db-da)/86400000);
}

/* Giorni della settimana, lunedì = 0. Serve per i pattern e per i task settimanali. */
var GIORNI3 = ['lun','mar','mer','gio','ven','sab','dom'];
var GIORNI = ['lunedì','martedì','mercoledì','giovedì','venerdì','sabato','domenica'];
function dow(dstr){
  var d = new Date(String(dstr)+'T00:00:00');
  if(isNaN(d)) return 0;
  return (d.getDay()+6)%7;
}
function shiftGiorni(dstr,k){
  var d = new Date(String(dstr)+'T00:00:00');
  d.setDate(d.getDate()+k);
  return iso(d);
}
/* Il lunedì della settimana che contiene questa data: è la chiave dei task. */
function lunediDi(dstr){ return shiftGiorni(dstr, -dow(dstr)); }
function settimanaOggi(){ return lunediDi(oggi()); }

/* Piccola calcolatrice nel campo importo: "12+8.50", "3x4.20", "60/2".
   Nessun eval: tokenizzo e risolvo a mano, prima × ÷ poi + −. */
function espressione(txt){
  var t = String(txt==null?'':txt).replace(/'/g,'').replace(/,/g,'.').replace(/\s+/g,'');
  if(!t) return null;
  t = t.replace(/[xX×]/g,'*').replace(/÷/g,'/');
  if(!/[+\-*/]/.test(t.slice(1))) return null;
  if(!/^-?[0-9.]+([+\-*/][0-9.]+)+$/.test(t)) return null;
  var tok = t.match(/(-?\d*\.?\d+)|([+\-*/])/g);
  if(!tok || !tok.length) return null;
  var i, n = [], op = [];
  n.push(parseFloat(tok[0]));
  for(i=1;i<tok.length;i+=2){
    var o = tok[i], v = parseFloat(tok[i+1]);
    if(!isFinite(v)) return null;
    if(o==='*'||o==='/'){
      var last = n.pop();
      n.push(o==='*' ? last*v : (v===0?0:last/v));
    } else { op.push(o); n.push(v); }
  }
  var tot = n[0];
  for(i=1;i<n.length;i++) tot = op[i-1]==='+' ? tot+n[i] : tot-n[i];
  return isFinite(tot) ? Math.round(tot*100)/100 : null;
}
/* Importo scritto a mano: accetta sia "23.40" sia "12+8.5" */
function importo(txt){
  var e = espressione(txt);
  return e!=null ? e : num(txt);
}

/* ── Toast: conferme leggere, con annulla dove serve ── */
var _tzAz = null, _tzT = null;
function toast(msg, azLab, azFn, ms){
  var host = document.getElementById('toastHost');
  if(!host){ host = document.createElement('div'); host.id = 'toastHost'; document.body.appendChild(host); }
  _tzAz = azFn || null;
  clearTimeout(_tzT);
  host.innerHTML = '<div class="toast"><span>'+esc(msg)+'</span>'+
    (azLab? '<button onclick="toastAzione()">'+esc(azLab)+'</button>' : '')+'</div>';
  _tzT = setTimeout(chiudiToast, ms || (azLab?6500:2400));
}
function toastAzione(){ var f = _tzAz; chiudiToast(); if(f) f(); }
function chiudiToast(){
  clearTimeout(_tzT);
  var host = document.getElementById('toastHost');
  if(!host || !host.firstChild) return;
  var el = host.firstChild;
  el.className = 'toast out';
  setTimeout(function(){ if(host.firstChild===el) host.innerHTML=''; }, 220);
  _tzAz = null;
}
function vibra(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms||9); }catch(e){} }

/* Conversione: ogni spesa salva il cambio usato, così lo storico non si muove
   quando aggiorni il tasso. */
function inCHF(imp, valuta, fx){
  imp = num(imp);
  if(valuta === 'EUR') return imp * (fx>0 ? fx : (S.cfg.fx>0?S.cfg.fx:1));
  return imp;
}

/* ══════════════════════════════════════════════════════════════
   4. CATEGORIZZAZIONE AUTOMATICA
   Prima le regole imparate dalle tue correzioni, poi il dizionario.
   ══════════════════════════════════════════════════════════════ */
function piatto(s){
  return (' '+String(s==null?'':s).toLowerCase()+' ')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9&!\s]/g,' ').replace(/\s+/g,' ');
}
function detect(desc){
  var t = piatto(desc);
  if(!t.trim()) return {cat:'altro', need:1, sicura:false, via:'vuoto'};
  var i,j;
  /* 1. regole imparate */
  for(i=0;i<S.regole.length;i++){
    var r = S.regole[i];
    if(r.k && t.indexOf(piatto(r.k).trim())>=0)
      return {cat:r.cat, need:(r.need==null?cat(r.cat).need:r.need), sicura:true, via:'regola'};
  }
  /* 2. dizionario */
  var best = null, bestLen = 0;
  for(i=0;i<KW.length;i++){
    var lista = KW[i][2];
    for(j=0;j<lista.length;j++){
      var k = piatto(lista[j]).trim();
      if(k && t.indexOf(k)>=0 && k.length>bestLen){ best = {cat:KW[i][0], need:KW[i][1]}; bestLen = k.length; }
    }
  }
  if(best) return {cat:best.cat, need:best.need, sicura:true, via:'dizionario'};
  return {cat:'altro', need:1, sicura:false, via:'nessuna'};
}
/* Quando correggi una categoria, l'app impara la parola più lunga della descrizione */
function imparaRegola(desc, catId, need){
  var t = piatto(desc).trim();
  if(!t) return;
  var parole = t.split(' ').filter(function(w){ return w.length>=3; });
  if(!parole.length) return;
  parole.sort(function(a,b){ return b.length-a.length; });
  var k = parole[0];
  for(var i=0;i<S.regole.length;i++){
    if(S.regole[i].k===k){ S.regole[i].cat=catId; S.regole[i].need=need; return; }
  }
  S.regole.push({k:k, cat:catId, need:need});
}

/* ══════════════════════════════════════════════════════════════
   5. CALCOLI
   ══════════════════════════════════════════════════════════════ */
function speseDi(m){
  return S.spese.filter(function(s){ return meseDi(s.d)===m; })
    .sort(function(a,b){ return a.d<b.d?1:(a.d>b.d?-1:(a.t<b.t?1:-1)); });
}
function sommaCHF(arr){ var t=0; for(var i=0;i<arr.length;i++) t += num(arr[i].chf); return t; }
function entrateMese(m){
  var e = pos(S.cfg.entrata);
  var extra = 0;
  for(var i=0;i<S.cfg.extra.length;i++) extra += pos(S.cfg.extra[i].imp);
  var tred = 0;
  if(num(S.cfg.mensilita)>12 && String(m).slice(5,7)==='12') tred = e*(num(S.cfg.mensilita)-12);
  return e + extra + tred;
}
function calc(m){
  var sp = speseDi(m), i;
  var c = {mese:m, spese:sp, uscite:sommaCHF(sp), entrate:entrateMese(m)};
  c.risparmio = c.entrate - c.uscite;
  c.tasso = c.entrate>0 ? (c.risparmio/c.entrate*100) : 0;
  c.perCat = {}; c.perNeed = [0,0,0]; c.perGiorno = {};
  for(i=0;i<CATS.length;i++) c.perCat[CATS[i].id] = 0;
  for(i=0;i<sp.length;i++){
    var s = sp[i];
    c.perCat[s.cat!=null&&c.perCat[s.cat]!=null?s.cat:'altro'] += num(s.chf);
    var n = num(s.need); if(n<0||n>2) n=1;
    c.perNeed[n] += num(s.chf);
    c.perGiorno[s.d] = (c.perGiorno[s.d]||0) + num(s.chf);
  }
  c.evitabile = c.perNeed[2];
  c.quotaEvitabile = c.uscite>0 ? c.evitabile/c.uscite*100 : 0;

  var gg = giorniPassati(m), tot = giorniMese(m);
  c.variabili = 0; c.unaTantum = 0;
  var val = [];
  for(i=0;i<sp.length;i++) if(!sp[i].ric){ c.variabili += num(sp[i].chf); val.push(num(sp[i].chf)); }
  c.fisse = c.uscite - c.variabili;
  var fisseAttese = totRicorrenti();
  c.corrente = (m === meseOggi());
  /* Proiezione. Due accortezze, perché una proiezione gonfiata è una bugia:
     1) una spesa grossa e isolata (un affitto scritto a mano, un'assicurazione, un volo)
        non si ripete ogni settimana: la conto una volta sola e calcolo il ritmo sul resto;
     2) nei primi giorni il ritmo dice poco, quindi lo mescolo con lo storico e gli do
        peso man mano che il mese avanza. */
  if(c.corrente && gg>0){
    var ord = val.slice().sort(function(a,b){ return a-b; });
    var med = ord.length ? ord[Math.floor(ord.length/2)] : 0;
    var soglia = Math.max(med*4, 300);
    var quotidiane = 0;
    for(i=0;i<val.length;i++){
      if(val[i]>soglia) c.unaTantum += val[i]; else quotidiane += val[i];
    }
    var ritmo = quotidiane/gg*tot + c.unaTantum;
    var storVar = Math.max(0, mediaUscite(3, m) - fisseAttese);
    var peso = Math.min(1, gg/10);
    var varProj = storVar>0 ? ritmo*peso + storVar*(1-peso) : ritmo;
    c.proiezione = Math.max(c.variabili, varProj) + Math.max(c.fisse, fisseAttese);
  } else {
    c.proiezione = c.uscite;
  }
  c.giorni = gg; c.giorniTot = tot;
  c.giorniRest = Math.max(0, tot-gg);
  return c;
}
function totRicorrenti(){
  var t=0;
  for(var i=0;i<S.ricorrenti.length;i++){
    var r = S.ricorrenti[i];
    if(r.attiva===false) continue;
    t += inCHF(r.imp, r.val, r.fx||S.cfg.fx);
  }
  return t;
}
/* Spese fisse di questo mese non ancora registrate: pesano sul "quanto mi resta". */
function fisseDaPagare(m){
  var t = 0, n = 0;
  for(var i=0;i<S.ricorrenti.length;i++){
    var r = S.ricorrenti[i];
    if(r.attiva===false || num(r.imp)<=0) continue;
    if(S.applicati.indexOf(m+'|'+r.id)>=0) continue;
    t += inCHF(r.imp, r.val, r.fx||S.cfg.fx); n++;
  }
  return {tot:t, n:n};
}
function mesiConDati(){
  var set = {}, i;
  for(i=0;i<S.spese.length;i++) set[meseDi(S.spese[i].d)] = 1;
  set[meseOggi()] = 1; set[S.mese] = 1;
  return Object.keys(set).sort();
}
function serieMesi(n, ancora){
  var out = [], m = ancora || meseOggi();
  for(var i=n-1;i>=0;i--){
    var k = meseShift(m,-i);
    var sp = S.spese.filter(function(s){ return meseDi(s.d)===k; });
    var riga = {m:k, uscite:sommaCHF(sp), entrate:entrateMese(k), n:sp.length, corrente:(k===meseOggi())};
    if(riga.corrente) riga.proj = calc(k).proiezione;
    out.push(riga);
  }
  return out;
}
/* Media delle uscite nei mesi chiusi precedenti a "ancora" (il mese in corso non conta). */
function mediaUscite(n, ancora){
  var m = ancora || meseOggi(), tot = 0, c = 0;
  for(var i=1;i<=n;i++){
    var k = meseShift(m,-i);
    var sp = S.spese.filter(function(s){ return meseDi(s.d)===k; });
    if(!sp.length) continue;
    tot += sommaCHF(sp); c++;
  }
  return c>0 ? tot/c : 0;
}
function mediaCat(catId, n, ancora){
  var tot=0, c=0, m = ancora || meseOggi();
  for(var i=1;i<=n;i++){
    var k = meseShift(m,-i);
    var sp = S.spese.filter(function(s){ return meseDi(s.d)===k; });
    if(!sp.length) continue;
    var t=0; for(var j=0;j<sp.length;j++) if((sp[j].cat||'altro')===catId) t+=num(sp[j].chf);
    tot+=t; c++;
  }
  return c>0?{media:tot/c, mesi:c}:{media:0, mesi:0};
}
function saldoConti(){ var t=0; for(var i=0;i<S.conti.length;i++) t += num(S.conti[i].saldo); return t; }
function valoreInvest(){
  var t=0;
  for(var i=0;i<S.invest.length;i++){
    var p = S.invest[i];
    t += inCHF(num(p.qta)*num(p.prezzo), p.val, p.fx||S.cfg.fx);
  }
  return t;
}
function costoInvest(){
  var t=0;
  for(var i=0;i<S.invest.length;i++){
    var p = S.invest[i];
    t += inCHF(num(p.qta)*num(p.pmc), p.val, p.fx||S.cfg.fx);
  }
  return t;
}
function patrimonio(){ return saldoConti() + valoreInvest(); }
function accantonatoTot(){ var t=0; for(var i=0;i<S.obiettivi.length;i++) t += num(S.obiettivi[i].acc); return t; }
function speseMedieMensili(){
  var m = mediaUscite(3);
  if(m>0) return m;
  var c = calc(meseOggi());
  return c.uscite>0 ? c.uscite : totRicorrenti();
}

/* ──────────────────────────────────────────────────────────────
   Quanto posso spendere oggi.
   Dalle entrate tolgo quello che ho già speso, le fisse che devo ancora
   pagare e quello che voglio mettere da parte: il resto, diviso i giorni
   che mancano (oggi compreso), è la cifra che conta davvero.
   ────────────────────────────────────────────────────────────── */
function budgetGiornaliero(m){
  if(m !== meseOggi()) return null;
  var c = calc(m);
  if(c.entrate<=0) return null;
  var f = fisseDaPagare(m);
  var target = pos(S.cfg.targetRisparmio);
  var resta = c.entrate - c.uscite - f.tot - target;
  var gg = Math.max(1, c.giorniTot - c.giorni + 1);
  return {resta:resta, giorno:resta/gg, gg:gg, fisse:f.tot, nFisse:f.n, target:target,
    speso:c.uscite, entrate:c.entrate};
}

/* Il costo medio di ogni giorno della settimana, sulle spese non fisse. */
function perGiornoSettimana(giorni){
  giorni = giorni || 90;
  var da = shiftGiorni(oggi(), -giorni);
  var tot = [0,0,0,0,0,0,0], cnt = [0,0,0,0,0,0,0], i;
  for(i=0;i<giorni;i++) cnt[dow(shiftGiorni(oggi(),-i))]++;
  for(i=0;i<S.spese.length;i++){
    var s = S.spese[i];
    if(s.ric) continue;
    if(s.d < da || s.d > oggi()) continue;
    tot[dow(s.d)] += num(s.chf);
  }
  return tot.map(function(v,idx){ return {g:idx, tot:v, media:cnt[idx]>0?v/cnt[idx]:0}; });
}

/* Spese che tornano ogni mese con lo stesso importo: candidate a spesa fissa. */
function abbonamentiRilevati(){
  var g = {}, i, k;
  for(i=0;i<S.spese.length;i++){
    var s = S.spese[i];
    if(s.ric) continue;
    k = piatto(s.desc).trim();
    if(k.length<3) continue;
    if(!g[k]) g[k] = {k:k, desc:s.desc, cat:s.cat, need:num(s.need), mesi:{}, imp:[]};
    g[k].mesi[meseDi(s.d)] = 1;
    g[k].imp.push(num(s.chf));
  }
  var out = [];
  for(k in g){
    var v = g[k], mesi = Object.keys(v.mesi);
    if(mesi.length<3) continue;
    v.imp.sort(function(a,b){ return a-b; });
    var med = v.imp[Math.floor(v.imp.length/2)];
    if(med<4) continue;
    var stabili = v.imp.filter(function(x){ return Math.abs(x-med) <= Math.max(1, med*0.2); });
    if(stabili.length < v.imp.length*0.7) continue;
    var gia = false;
    for(i=0;i<S.ricorrenti.length;i++) if(piatto(S.ricorrenti[i].nome).trim()===v.k) gia = true;
    if(gia) continue;
    out.push({k:v.k, desc:v.desc, cat:v.cat, need:v.need, mesi:mesi.length, imp:med});
  }
  return out.sort(function(a,b){ return b.imp-a.imp; });
}

/* Le descrizioni che scrivi più spesso, con l'importo tipico: servono per l'inserimento rapido. */
function speseFrequenti(limite){
  var da = shiftGiorni(oggi(),-120), g = {}, i, k;
  for(i=0;i<S.spese.length;i++){
    var s = S.spese[i];
    if(s.ric || s.d < da) continue;
    k = piatto(s.desc).trim();
    if(k.length<3) continue;
    if(!g[k]) g[k] = {desc:s.desc, cat:s.cat, need:num(s.need), val:s.val||'CHF', n:0, imp:[], ultimo:s.d};
    g[k].n++; g[k].imp.push(num(s.imp));
    if(s.d >= g[k].ultimo){
      g[k].ultimo = s.d; g[k].desc = s.desc; g[k].cat = s.cat;
      g[k].need = num(s.need); g[k].val = s.val||'CHF';
    }
  }
  var out = [];
  for(k in g) if(g[k].n>=2) out.push(g[k]);
  out.forEach(function(v){
    v.imp.sort(function(a,b){ return a-b; });
    v.tipico = v.imp[Math.floor(v.imp.length/2)];
  });
  out.sort(function(a,b){ return (b.n-a.n) || (a.ultimo<b.ultimo?1:-1); });
  return out.slice(0, limite||8);
}

/* Confronto con l'ultimo mese che ha dati: a parità di giorni trascorsi. */
function confrontoMese(m){
  var prec = null, i;
  for(i=1;i<=6;i++){
    var k = meseShift(m,-i);
    if(S.spese.some(function(s){ return meseDi(s.d)===k; })){ prec = k; break; }
  }
  if(!prec) return null;
  var c = calc(m);
  var gg = c.corrente ? c.giorni : giorniMese(m);
  /* dello stesso periodo del mese precedente, per non confrontare mele con pere */
  var lim = prec+'-'+String(Math.min(gg, giorniMese(prec))).padStart(2,'0');
  var spPrec = S.spese.filter(function(s){ return meseDi(s.d)===prec && s.d<=lim; });
  var vPrec = sommaCHF(spPrec);
  if(vPrec<=0) return null;
  return {mese:prec, ora:c.uscite, prima:vPrec, delta:c.uscite-vPrec,
    dq:(c.uscite-vPrec)/vPrec*100, giorni:gg, parziale:c.corrente};
}

/* Da quanti giorni non tocco saldi e prezzi: il dato vecchio è un dato sbagliato. */
function giorniDaUltimoSaldo(){
  var ultimo = '', i, j;
  for(i=0;i<S.conti.length;i++){
    var st = S.conti[i].storico||[];
    for(j=0;j<st.length;j++) if(st[j].d > ultimo) ultimo = st[j].d;
  }
  if(!ultimo) return null;
  return giorniTra(ultimo, oggi());
}
function giorniDaUltimoPrezzo(){
  var ultimo = '', i, j;
  for(i=0;i<S.invest.length;i++){
    var st = S.invest[i].storico||[];
    for(j=0;j<st.length;j++) if(st[j].d > ultimo) ultimo = st[j].d;
  }
  if(!ultimo) return null;
  return giorniTra(ultimo, oggi());
}

/* ══════════════════════════════════════════════════════════════
   6. AVVISI
   Ogni avviso ha un peso: prima quello che ti costa di più, non quello
   che capita per primo nel codice. Sotto un certo peso non disturbo.
   ══════════════════════════════════════════════════════════════ */
function avvisi(m){
  var c = calc(m), out = [], i, j;
  var corrente = c.corrente;
  function push(o){ out.push(o); }

  /* — spese fisse non ancora registrate — */
  var f = fisseDaPagare(m);
  if(f.n>0){
    push({id:'fisse-'+m, dup:'fisse', peso:78, cls:'i', ic:'+', tit:f.n+' spese fisse da registrare',
      txt:'Affitto, assicurazioni e simili di '+nomeMese(m,1)+' non sono ancora nel conto: <b>CHF '+chf(f.tot)+'</b>. '+
      'Finché mancano, il mese sembra più leggero di quello che è.',
      azione:'applicaTutteDa(\''+m+'\')', azLab:'Aggiungile'});
  }

  /* — hai già speso più di quanto potevi — */
  var bg = budgetGiornaliero(m);
  if(bg && bg.resta < 0 && c.uscite>0){
    push({id:'sicuro-'+m, peso:84, cls:'w', ic:'!', tit:'Sei già oltre il margine del mese',
      txt:'Tolte le fisse ancora da pagare e i CHF '+chf(bg.target)+' che vuoi mettere da parte, '+
      'sei sotto di <b>CHF '+chf(-bg.resta)+'</b> con '+bg.gg+' giorni davanti. '+
      'O tocchi il risparmio, o da qui a fine mese tieni fermo il portafoglio.'});
  }

  /* — budget per categoria — */
  for(i=0;i<CATS.length;i++){
    var id = CATS[i].id, b = pos(S.cfg.budget[id]);
    if(b<=0) continue;
    var sp = c.perCat[id]||0, q = sp/b*100;
    if(q>=100){
      push({id:'bud-'+id+'-'+m, peso:90, cls:'w', ic:'!', tit:CATS[i].nome+': budget superato',
        txt:'Hai speso <b>CHF '+chf(sp)+'</b> sui '+chf(b)+' che ti eri dato. Sforo di <b>CHF '+chf(sp-b)+'</b>.',
        azione:'apriCategoria(\''+id+'\')', azLab:'Guarda le spese'});
    } else if(q>=85 && corrente && c.giorniRest>3){
      push({id:'bud85-'+id+'-'+m, peso:62, cls:'a', ic:'!', tit:CATS[i].nome+': ci sei quasi',
        txt:'CHF '+chf(sp)+' su '+chf(b)+' ('+pct(q)+') e mancano ancora '+c.giorniRest+' giorni.'});
    }
  }

  /* — categoria pesante senza un tetto — */
  if(c.uscite>0 && corrente){
    var senza = CATS.filter(function(k){
      return pos(S.cfg.budget[k.id])<=0 && (c.perCat[k.id]||0) > c.uscite*0.22 && (c.perCat[k.id]||0) > 150;
    });
    if(senza.length){
      var mc0 = mediaCat(senza[0].id, 3, m);
      push({id:'nobud-'+senza[0].id, dup:'budget', peso:44, cls:'i', ic:'◇', tit:senza[0].nome+' pesa senza un tetto',
        txt:'È <b>'+pct((c.perCat[senza[0].id]||0)/c.uscite*100)+'</b> delle uscite del mese e non ha budget. '+
        (mc0.mesi>=2? 'Negli ultimi '+mc0.mesi+' mesi la media è stata CHF '+chf(mc0.media)+': un tetto lì sopra ti darebbe un limite vero.'
          : 'Dagli un tetto e ti avviso prima che sfori.'),
        azione:'go(\'spese\')', azLab:'Metti un budget'});
    }
  }

  /* — quota evitabile — */
  if(c.uscite>0 && c.evitabile>0 && c.quotaEvitabile>=20){
    push({id:'evit-'+m, peso:55, cls:'a', ic:'?', tit:'Le spese evitabili pesano il '+pct(c.quotaEvitabile),
      txt:'<b>CHF '+chf(c.evitabile)+'</b> di questo mese li hai segnati come evitabili: il <b>'+pct(c.quotaEvitabile)+
      '</b> delle uscite. Sono '+chf(c.evitabile*12)+' all\'anno.',
      azione:'apriEvitabili()', azLab:'Guardale una a una'});
  }

  /* — singola spesa evitabile sopra soglia — */
  var soglia = pos(S.cfg.sogliaEvitabile)||80;
  var grosse = c.spese.filter(function(s){ return num(s.need)===2 && num(s.chf)>=soglia; });
  if(grosse.length){
    var g = grosse[0];
    push({id:'big-'+g.id, peso:52, cls:'a', ic:'?', tit:'Serviva davvero?',
      txt:'<b>'+esc(g.desc||cat(g.cat).nome)+'</b> — CHF '+chf2(g.chf)+' il '+dataBreve(g.d)+
      ', segnata come evitabile.'+(grosse.length>1?' (e altre '+(grosse.length-1)+' sopra '+chf(soglia)+')':'')});
  }

  /* — doppioni — */
  for(i=0;i<c.spese.length;i++){
    var trovato = false;
    for(j=i+1;j<c.spese.length;j++){
      var a=c.spese[i], b2=c.spese[j];
      if(a.id===b2.id) continue;
      if(Math.abs(num(a.chf)-num(b2.chf))<0.02 && Math.abs(giorniTra(b2.d,a.d))<=4 &&
         piatto(a.desc).trim() === piatto(b2.desc).trim() && piatto(a.desc).trim()!==''){
        push({id:'dup-'+a.id, peso:85, cls:'w', ic:'=', tit:'Possibile addebito doppio',
          txt:'<b>'+esc(a.desc)+'</b> da CHF '+chf2(a.chf)+' compare due volte ('+dataBreve(b2.d)+' e '+dataBreve(a.d)+').',
          azione:'apriSpesa(\''+a.id+'\')', azLab:'Apri la spesa'});
        trovato = true; break;
      }
    }
    if(trovato) break;
  }

  /* — categoria in crescita rispetto alla sua media — */
  for(i=0;i<CATS.length;i++){
    var cid = CATS[i].id, mc = mediaCat(cid,3,m);
    if(mc.mesi<2 || mc.media<40) continue;
    var att = c.perCat[cid]||0;
    var proj = corrente && c.giorni>3 ? att/c.giorni*c.giorniTot : att;
    if(proj > mc.media*1.35 && (proj-mc.media)>=60){
      push({id:'trend-'+cid+'-'+m, peso:58, cls:'a', ic:'↑', tit:CATS[i].nome+' sopra la media',
        txt:(corrente?'Al ritmo di questo mese chiudi a ':'Hai chiuso a ')+'<b>CHF '+chf(proj)+
        '</b> contro una media di '+chf(mc.media)+' negli ultimi '+mc.mesi+' mesi. '+
        'Differenza: <b>CHF '+chf(proj-mc.media)+'</b>.',
        azione:'apriCategoria(\''+cid+'\')', azLab:'Vedi cosa è cambiato'});
    }
  }

  /* — spese che tornano ogni mese ma non sono fra le fisse — */
  var ab = abbonamentiRilevati();
  if(ab.length){
    var a0 = ab[0];
    push({id:'rilev-'+a0.k, dup:'abbonamenti', peso:46, cls:'i', ic:'∞', tit:'"'+esc(a0.desc)+'" torna ogni mese',
      txt:'Compare in <b>'+a0.mesi+' mesi diversi</b> con lo stesso importo, circa CHF '+chf2(a0.imp)+
      ' ('+chf(a0.imp*12)+' all\'anno). Se è un abbonamento, mettilo tra le fisse e non lo riscrivi più.',
      azione:'promuoviRicorrente(\''+esc(a0.k)+'\')', azLab:'Mettila tra le fisse'});
  }

  /* — abbonamenti attivi — */
  var abb = S.ricorrenti.filter(function(r){ return r.attiva!==false && (r.cat==='svago'||r.cat==='shop'); });
  if(abb.length>=2){
    var ta=0; for(i=0;i<abb.length;i++) ta += inCHF(abb[i].imp, abb[i].val, abb[i].fx||S.cfg.fx);
    if(ta>=25) push({id:'abb-'+m, dup:'abbonamenti', peso:40, cls:'i', ic:'∞', tit:abb.length+' abbonamenti attivi',
      txt:'CHF '+chf2(ta)+' al mese, <b>CHF '+chf(ta*12)+' all\'anno</b>. Quanti ne hai usati questo mese?',
      azione:'apriRicorrenti()', azLab:'Passali in rassegna'});
  }

  /* — sforo del mese — */
  if(c.entrate>0 && c.proiezione > c.entrate){
    push({id:'sforo-'+m, peso:88, cls:'w', ic:'!', tit:corrente?'Il mese sta andando in rosso':'Mese chiuso in rosso',
      txt:(corrente?'Proiezione a fine mese: <b>CHF '+chf(c.proiezione)+'</b> di uscite contro '+chf(c.entrate)+' di entrate.'
        :'Uscite <b>CHF '+chf(c.uscite)+'</b> contro '+chf(c.entrate)+' di entrate.')});
  }

  /* — tasso di risparmio sotto obiettivo — */
  var tt = pos(S.cfg.targetTasso);
  if(tt>0 && c.entrate>0 && c.uscite>0){
    var tassoProj = (c.entrate - c.proiezione)/c.entrate*100;
    if(tassoProj < tt-2){
      push({id:'tasso-'+m, peso:50, cls:'a', ic:'%', tit:'Sotto il tuo obiettivo di risparmio',
        txt:'Stai andando verso il <b>'+pct(tassoProj)+'</b> invece del '+pct(tt)+
        '. Sono <b>CHF '+chf(Math.max(0,(tt-tassoProj)/100*c.entrate))+'</b> di differenza questo mese.'});
    }
  }

  /* — confronto con il mese scorso, stesso numero di giorni — */
  var cf = confrontoMese(m);
  /* Un mese ancora vuoto non è "più leggero": è solo da riempire. */
  if(cf && Math.abs(cf.dq)>=12 && cf.prima>100 && c.spese.length>=3){
    var su = cf.delta>0;
    push({id:'cfr-'+m+'-'+(corrente?c.giorni:'fine'), peso:su?36:20, cls:su?'a':'g', ic:su?'↑':'↓',
      tit:su?'Più caro del mese scorso':'Più leggero del mese scorso',
      txt:'Nei primi '+cf.giorni+' giorni hai speso <b>CHF '+chf(cf.ora)+'</b> contro i '+chf(cf.prima)+
      ' dello stesso periodo di '+nomeMese(cf.mese,1)+': '+(su?'+':'−')+'CHF '+chf(Math.abs(cf.delta))+
      ' ('+(su?'+':'−')+Math.abs(cf.dq).toFixed(0)+'%).'});
  }

  /* — il giorno della settimana che ti costa di più — */
  if(corrente && S.spese.length>=25){
    var gs = perGiornoSettimana(90);
    var med = 0; for(i=0;i<7;i++) med += gs[i].media;
    med = med/7;
    var top = gs.slice().sort(function(a,b){ return b.media-a.media; })[0];
    if(med>0 && top.media > med*1.7 && top.media>20){
      push({id:'dow-'+top.g, peso:30, cls:'i', ic:'·', tit:'Il tuo '+GIORNI[top.g]+' costa il doppio',
        txt:'In media <b>CHF '+chf(top.media)+'</b> contro i '+chf(med)+' di un giorno qualunque. '+
        'Su un anno la differenza vale circa <b>CHF '+chf((top.media-med)*52)+'</b>.'});
    }
  }

  /* — fondo emergenza — */
  var spm = speseMedieMensili();
  if(spm>0 && S.conti.length){
    var mesiCop = saldoConti()/spm;
    if(mesiCop < 3){
      push({id:'emerg', peso:70, cls:'a', ic:'▲', tit:'Fondo emergenza sotto i 3 mesi',
        txt:'Con CHF '+chf(saldoConti())+' liquidi copri <b>'+mesiCop.toFixed(1)+' mesi</b> di spese. '+
        'Il minimo consigliato è 3, cioè '+chf(spm*3)+'.',
        azione:'go(\'risparmi\')', azLab:'Vedi il fondo'});
    } else if(mesiCop>=6 && valoreInvest()<saldoConti()*0.2){
      push({id:'liquido', peso:34, cls:'i', ic:'◎', tit:'Molta liquidità ferma',
        txt:'Copri <b>'+mesiCop.toFixed(1)+' mesi</b> di spese con i soldi sul conto. '+
        'Oltre i 6 mesi il cuscinetto ha fatto il suo lavoro: il resto può iniziare a lavorare.'});
    }
  }

  /* — obiettivi a rischio — */
  var disp = Math.max(0, c.entrate - Math.max(c.proiezione, totRicorrenti()));
  for(i=0;i<S.obiettivi.length;i++){
    var o = S.obiettivi[i];
    if(!o.scad || num(o.acc)>=num(o.target)) continue;
    var gg = giorniTra(oggi(), o.scad);
    if(gg<=0){
      push({id:'obj-late-'+o.id, peso:80, cls:'w', ic:'⏱', tit:'"'+esc(o.nome)+'" è scaduto',
        txt:'Mancavano CHF '+chf(num(o.target)-num(o.acc))+'. Sposta la data o rivedi l\'importo.',
        azione:'apriObiettivo(\''+o.id+'\')', azLab:'Sistemalo'});
    } else {
      var mesiR = Math.max(1, gg/30.4);
      var serve = (num(o.target)-num(o.acc))/mesiR;
      if(serve > disp*1.05 && serve>0){
        push({id:'obj-'+o.id+'-'+m, peso:68, cls:'a', ic:'◎', tit:'"'+esc(o.nome)+'" non arriva in tempo',
          txt:'Servono <b>CHF '+chf(serve)+' al mese</b> per farcela entro '+dataBreve(o.scad)+
          ', ma al ritmo attuale te ne restano circa '+chf(disp)+'.',
          azione:'go(\'obiettivi\')', azLab:'Rivedi il piano'});
      }
    }
  }

  /* — saldi e prezzi fermi da troppo — */
  var gsal = giorniDaUltimoSaldo();
  if(gsal!=null && gsal>=40 && S.conti.length){
    push({id:'saldi-'+meseOggi(), dup:'saldi', peso:42, cls:'i', ic:'↻', tit:'Saldi fermi da '+gsal+' giorni',
      txt:'Il patrimonio che vedi è quello di '+gsal+' giorni fa. Due minuti e torna vero.',
      azione:'go(\'risparmi\')', azLab:'Aggiornali'});
  }
  var gpr = giorniDaUltimoPrezzo();
  if(gpr!=null && gpr>=45 && S.invest.length){
    push({id:'prezzi-'+meseOggi(), dup:'prezzi', peso:28, cls:'i', ic:'↻', tit:'Prezzi degli investimenti fermi da '+gpr+' giorni',
      txt:'Il valore del portafoglio è quello dell\'ultimo aggiornamento, non quello di oggi.',
      azione:'go(\'invest\')', azLab:'Aggiornali'});
  }

  /* — non registri da un po' — */
  if(corrente && S.spese.length){
    var ultima = S.spese.slice().sort(function(a,b){ return a.d<b.d?1:-1; })[0];
    var d = giorniTra(ultima.d, oggi());
    if(d>=4) push({id:'ping-'+oggi(), dup:'registra', peso:26, cls:'i', ic:'·', tit:'Sono '+d+' giorni che non registri niente',
      txt:'L\'ultima spesa è del '+dataBreve(ultima.d)+'. Se ne hai fatte, aggiungile adesso: sono 10 secondi.',
      azione:'apriNuova()', azLab:'Aggiungi ora'});
  }

  /* — note positive: contano quanto le altre — */
  if(corrente && c.uscite>0 && c.evitabile===0 && c.spese.length>=4){
    push({id:'ok-'+m, peso:18, cls:'g', ic:'✓', tit:'Nessuna spesa evitabile questo mese',
      txt:'Tutte le '+c.spese.length+' spese registrate erano necessarie o utili.'});
  }
  if(c.entrate>0 && c.risparmio>0 && !corrente){
    push({id:'okr-'+m, peso:22, cls:'g', ic:'✓', tit:'Mese chiuso con CHF '+chf(c.risparmio)+' di avanzo',
      txt:'Tasso di risparmio del <b>'+pct(c.tasso)+'</b>.'});
  }
  if(spm>0 && S.conti.length && saldoConti()/spm>=3 && saldoConti()/spm<6){
    push({id:'emerg-ok', peso:16, cls:'g', ic:'✓', tit:'Fondo emergenza a posto',
      txt:'Copri <b>'+(saldoConti()/spm).toFixed(1)+' mesi</b> di spese. È il cuscinetto che serve per non dover mai vendere di corsa.'});
  }

  return out
    .filter(function(a){ return S.letti.indexOf(a.id)<0; })
    .sort(function(a,b){ return (b.peso||0)-(a.peso||0); });
}

/* ══════════════════════════════════════════════════════════════
   6b. TASK DINAMICI
   Non una lista scritta a mano: ogni settimana l'app guarda com'è messa
   e propone le poche cose che sposterebbero davvero l'ago. Quelle che
   può verificare da sola si spuntano da sole.
   ══════════════════════════════════════════════════════════════ */
function statoTask(){
  if(!S.task || typeof S.task!=='object') S.task = {sett:settimanaOggi(), voci:{}, streak:0, storico:[], tot:0, snapAcc:{}};
  if(!S.task.voci || typeof S.task.voci!=='object') S.task.voci = {};
  if(!Array.isArray(S.task.storico)) S.task.storico = [];
  if(!S.task.snapAcc || typeof S.task.snapAcc!=='object') S.task.snapAcc = snapObiettivi();
  return S.task;
}
function snapObiettivi(){
  var o = {};
  for(var i=0;i<S.obiettivi.length;i++) o[S.obiettivi[i].id] = num(S.obiettivi[i].acc);
  return o;
}
/* Cambio settimana: archivio, aggiorno la serie e riparto pulito. */
function chiudiSettimana(){
  var t = statoTask(), s = settimanaOggi();
  if(t.sett === s) return;
  var fatti = 0, k;
  for(k in t.voci) if(t.voci[k] && t.voci[k].fatto) fatti++;
  var tot = num(t.tot)||0;
  /* Se in tutta la settimana non hai aperto il riepilogo, il numero di task non è
     mai stato registrato: lo ricavo adesso, così la settimana conta lo stesso invece
     di sparire in silenzio. */
  if(tot<=0){ try{ tot = generaTask().length; }catch(e){ tot = 0; } }
  tot = Math.max(fatti, tot);
  if(tot>0){
    t.storico.push({sett:t.sett, fatti:fatti, tot:tot});
    if(t.storico.length>26) t.storico = t.storico.slice(-26);
    t.streak = (fatti>0 && fatti >= Math.ceil(tot*0.6)) ? num(t.streak)+1 : 0;
  }
  t.sett = s; t.voci = {}; t.tot = 0; t.snapAcc = snapObiettivi();
  save();
}
function speseSettimana(lun, catId){
  var fine = shiftGiorni(lun,6);
  return S.spese.filter(function(s){
    if(s.d<lun || s.d>fine) return false;
    if(s.ric) return false;
    if(catId && (s.cat||'altro')!==catId) return false;
    return true;
  });
}
function taskFatto(k){
  var t = statoTask();
  return !!(t.voci[k] && t.voci[k].fatto);
}
function toggleTask(k){
  var t = statoTask();
  var lista = generaTask(), trovato = null, i;
  for(i=0;i<lista.length;i++) if(lista[i].k===k) trovato = lista[i];
  if(trovato && trovato.auto && trovato.fattoAuto){
    toast('Questa si spunta da sola: la spunto quando il numero ci arriva.');
    return;
  }
  if(t.voci[k] && t.voci[k].fatto){ delete t.voci[k]; save(); render(); return; }
  t.voci[k] = {fatto:true, d:oggi()};
  vibra(12);
  save(); render();
  var nuova = generaTask();
  var fatti = nuova.filter(function(x){ return x.fatto; }).length;
  if(fatti===nuova.length && nuova.length>0)
    toast('Settimana completata. Chiusa così, lunedì la serie sale a '+(num(t.streak)+1)+'.');
  else if(fatti >= Math.ceil(nuova.length*0.6))
    toast('Quota raggiunta: questa settimana conta per la serie.');
}

/* ── il generatore ── */
function generaTask(){
  var m = meseOggi(), c = calc(m), t = [], i;
  var sett = settimanaOggi(), st = statoTask();
  var bg = budgetGiornaliero(m);
  var spSett = speseSettimana(sett);
  var totSett = sommaCHF(spSett);
  var ggSett = dow(oggi())+1;

  function add(o){
    o.fattoAuto = !!o.fattoAuto;
    o.fatto = o.fattoAuto || taskFatto(o.k);
    t.push(o);
  }

  /* 1. le spese fisse del mese */
  var f = fisseDaPagare(m);
  if(f.n>0 || S.ricorrenti.filter(function(r){return r.attiva!==false && num(r.imp)>0;}).length){
    add({k:'fisse-'+m, dup:'fisse', peso:95, auto:true, fattoAuto:(f.n===0),
      tit:'Registra le spese fisse di '+nomeMese(m,1),
      txt:f.n>0 ? f.n+' voci per CHF '+chf(f.tot)+' non sono ancora nel conto del mese.'
                : 'Tutte registrate. Il mese ha dentro anche quello che paghi senza pensarci.',
      azione:f.n>0?'applicaTutteDa(\''+m+'\')':null, azLab:'Aggiungile'});
  }

  /* 2. l'obiettivo che ha più bisogno di soldi, questa settimana */
  var piano = pianoObiettivi();
  var primo = null;
  for(i=0;i<piano.righe.length;i++) if(piano.righe[i].assegnato>0){ primo = piano.righe[i]; break; }
  if(primo){
    var quota = Math.round(primo.assegnato/4.345);
    if(quota>=5){
      var base = num(st.snapAcc[primo.o.id]||0);
      var messo = Math.max(0, num(primo.o.acc)-base);
      add({k:'acc-'+primo.o.id+'-'+sett, peso:88, auto:true, fattoAuto:(messo >= quota*0.9),
        tit:'Metti CHF '+chf(quota)+' su "'+primo.o.nome+'"',
        txt:messo>0 ? 'Questa settimana ci hai già messo CHF '+chf(messo)+' di '+chf(quota)+'.'
          : 'È la quota settimanale del piano: CHF '+chf(primo.assegnato)+' al mese'+
            (primo.o.scad?' per arrivarci entro '+dataBreve(primo.o.scad):'')+'.',
        prog:{v:messo, t:quota},
        azione:'versaObiettivo(\''+primo.o.id+'\')', azLab:'Accantona'});
    }
  }

  /* 3. la sfida sulla categoria che sta scappando */
  var sfida = null, sfidaEcc = 0;
  for(i=0;i<CATS.length;i++){
    var k = CATS[i];
    if(k.need===0) continue;                    /* sulle spese che servono non ha senso sfidarsi */
    var mc = mediaCat(k.id, 3, m);
    if(mc.mesi<2 || mc.media<50) continue;
    var att = c.perCat[k.id]||0;
    var proj = c.giorni>3 ? att/c.giorni*c.giorniTot : att;
    var ecc = proj - mc.media;
    if(ecc > sfidaEcc && ecc > mc.media*0.15){ sfidaEcc = ecc; sfida = {k:k, media:mc.media, proj:proj}; }
  }
  if(sfida){
    var tetto = Math.round(sfida.media/4.345*0.8);
    var spesoCat = sommaCHF(speseSettimana(sett, sfida.k.id));
    if(tetto>=10){
      add({k:'sfida-'+sfida.k.id+'-'+sett, peso:72, auto:true, fattoAuto:(spesoCat<=tetto && ggSett>=6),
        tit:'Tieni "'+sfida.k.nome+'" sotto CHF '+chf(tetto)+' questa settimana',
        txt:'Al ritmo attuale il mese chiude a CHF '+chf(sfida.proj)+' contro una media di '+chf(sfida.media)+
          '. Questa settimana sei a <b>CHF '+chf(spesoCat)+'</b>.',
        prog:{v:Math.min(spesoCat,tetto), t:tetto, inv:true, sup:spesoCat>tetto},
        azione:'apriCategoria(\''+sfida.k.id+'\')', azLab:'Vedi'});
    }
  }

  /* 4. il tetto giornaliero */
  if(bg && bg.giorno>0 && c.entrate>0){
    var tettoSett = bg.giorno*Math.min(7, ggSett);
    add({k:'giorno-'+sett, peso:66, auto:true, fattoAuto:(totSett<=tettoSett),
      tit:'Resta sotto CHF '+chf(bg.giorno)+' al giorno',
      txt:'Dal lunedì hai speso <b>CHF '+chf(totSett)+'</b> in '+ggSett+
        (ggSett===1?' giorno':' giorni')+', il margine per lo stesso periodo è '+chf(tettoSett)+'.',
      prog:{v:Math.min(totSett,tettoSett), t:Math.max(1,tettoSett), inv:true, sup:totSett>tettoSett}});
  }

  /* 5. una settimana senza spese evitabili */
  var evitSett = spSett.filter(function(s){ return num(s.need)===2; });
  if(S.cfg.chiedeNecessita!==false && S.spese.length>=8){
    add({k:'evit-'+sett, peso:60, auto:true, fattoAuto:(evitSett.length===0 && spSett.length>=3),
      tit:'Chiudi la settimana senza spese evitabili',
      txt:evitSett.length ? evitSett.length+(evitSett.length===1?' spesa evitabile':' spese evitabili')+
          ' finora, CHF '+chf(sommaCHF(evitSett))+'.'
        : (spSett.length>=3 ? 'Nessuna finora, su '+spSett.length+' spese registrate.'
                            : 'Ancora poche spese registrate per dirlo.')});
  }

  /* 6. registra quello che manca */
  if(S.spese.length){
    var ultima = S.spese.slice().sort(function(a,b){ return a.d<b.d?1:-1; })[0];
    var buco = giorniTra(ultima.d, oggi());
    if(buco>=3){
      add({k:'reg-'+sett, dup:'registra', peso:76, auto:true, fattoAuto:(buco<=1),
        tit:'Recupera '+buco+' giorni di spese',
        txt:'L\'ultima è del '+dataBreve(ultima.d)+'. I buchi nello storico rendono finte tutte le medie.',
        azione:'apriNuova()', azLab:'Aggiungi'});
    }
  }

  /* 7. un tetto alla categoria più pesante */
  var senzaTetto = CATS.filter(function(k){
    return pos(S.cfg.budget[k.id])<=0 && (c.perCat[k.id]||0) > Math.max(150, c.uscite*0.2);
  });
  if(senzaTetto.length && c.uscite>0){
    add({k:'bud-'+senzaTetto[0].id, dup:'budget', peso:52, auto:true, fattoAuto:(pos(S.cfg.budget[senzaTetto[0].id])>0),
      tit:'Dai un tetto a "'+senzaTetto[0].nome+'"',
      txt:'Vale '+pct((c.perCat[senzaTetto[0].id]||0)/c.uscite*100)+' delle uscite del mese e non ha un limite.',
      azione:'go(\'spese\')', azLab:'Impostalo'});
  }

  /* 8. il primo obiettivo, se non ce n'è nessuno */
  if(!S.obiettivi.length){
    var spm = speseMedieMensili();
    add({k:'primo-ob', peso:80, auto:true, fattoAuto:(S.obiettivi.length>0),
      tit:'Dai un nome a dove stai andando',
      txt:'Senza un obiettivo il risparmio è solo un avanzo. '+
        (spm>0?'Un fondo emergenza da CHF '+chf(spm*3)+' è quello da cui partire.':''),
      azione:'apriNuovoObiettivo()', azLab:'Creane uno'});
  }

  /* 9. saldi e prezzi */
  var gs = giorniDaUltimoSaldo();
  if(S.conti.length && (gs==null || gs>=25)){
    add({k:'saldi-'+sett, dup:'saldi', peso:48, auto:true, fattoAuto:(gs!=null && gs<=7),
      tit:'Aggiorna i saldi dei conti',
      txt:gs==null?'Non li hai mai aggiornati da quando li hai inseriti.'
        :'Ultimo aggiornamento '+gs+' giorni fa: il patrimonio che vedi è vecchio di '+gs+' giorni.',
      azione:'go(\'risparmi\')', azLab:'Aggiorna'});
  }
  var gp = giorniDaUltimoPrezzo();
  if(S.invest.length && gp!=null && gp>=30){
    add({k:'prezzi-'+sett, dup:'prezzi', peso:38, auto:true, fattoAuto:(gp<=7),
      tit:'Aggiorna i prezzi del portafoglio',
      txt:'Fermi da '+gp+' giorni. Dieci secondi e il valore torna quello vero.',
      azione:'go(\'invest\')', azLab:'Aggiorna'});
  }

  /* 10. la rassegna degli abbonamenti, una volta ogni tanto */
  var ab = abbonamentiRilevati();
  var abbFisse = S.ricorrenti.filter(function(r){ return r.attiva!==false && (r.cat==='svago'||r.cat==='shop'); });
  var ultRass = st.rassegna || '';
  var daRass = !ultRass || giorniTra(ultRass, oggi())>=56;
  if(daRass && (ab.length>0 || abbFisse.length>=3)){
    var totAbb = 0;
    for(i=0;i<abbFisse.length;i++) totAbb += inCHF(abbFisse[i].imp, abbFisse[i].val, abbFisse[i].fx||S.cfg.fx);
    add({k:'rassegna-'+sett, dup:'abbonamenti', peso:44,
      tit:'Passa in rassegna gli abbonamenti',
      txt:(abbFisse.length? abbFisse.length+' attivi per CHF '+chf(totAbb)+' al mese ('+chf(totAbb*12)+' all\'anno). ':'')+
        (ab.length? ab.length+(ab.length===1?' spesa ricorrente rilevata':' spese ricorrenti rilevate')+' non ancora tra le fisse.':'')+
        ' Disdirne uno che non usi vale più di mille piccoli tagli.',
      azione:'apriRassegna()', azLab:'Aprila'});
  }

  /* 11. il backup */
  var gb = S.ultimoBackup ? giorniTra(S.ultimoBackup, oggi()) : null;
  if(S.spese.length>=15 && (gb==null || gb>=45)){
    add({k:'backup-'+sett, peso:34, auto:true, fattoAuto:(gb!=null && gb<=7),
      tit:'Scarica il backup',
      txt:gb==null?'Non l\'hai mai fatto. I dati stanno solo dentro questo browser: se lo pulisci, spariscono.'
        :'Ultimo backup '+gb+' giorni fa, con '+S.spese.length+' spese da allora a rischio.',
      azione:'esportaJSON()', azLab:'Scarica'});
  }

  /* Scelgo i sei per peso, non per stato: così spuntarne uno non lo fa sparire
     sostituito da un altro, e la settimana resta la stessa settimana. */
  t.sort(function(a,b){ return (b.peso||0)-(a.peso||0); });
  var vis = t.slice(0,6);
  vis.sort(function(a,b){
    if(a.fatto!==b.fatto) return a.fatto?1:-1;
    return (b.peso||0)-(a.peso||0);
  });
  if(st.tot !== vis.length){ st.tot = vis.length; }
  return vis;
}

/* ── il piano: come si spartisce quello che avanza ── */
function pianoObiettivi(){
  var m = meseOggi();
  var c = calc(m);
  var media = mediaUscite(3, m);
  var uscAttese = media>0 ? media : Math.max(c.proiezione, totRicorrenti());
  var disp = Math.max(0, entrateMese(m) - uscAttese);
  var righe = S.obiettivi.map(function(o){
    var manca = Math.max(0, num(o.target)-num(o.acc));
    var gg = o.scad ? giorniTra(oggi(), o.scad) : null;
    var mesiR = gg!=null ? Math.max(0.5, gg/30.4) : null;
    return {o:o, manca:manca, gg:gg, mesiR:mesiR, serve:(mesiR? manca/mesiR : 0)};
  }).filter(function(r){ return r.manca>0; });

  /* prima la priorità che hai messo tu, poi la scadenza più vicina */
  righe.sort(function(a,b){
    var pa = num(a.o.prio==null?1:a.o.prio), pb = num(b.o.prio==null?1:b.o.prio);
    if(pa!==pb) return pa-pb;
    if(a.mesiR==null && b.mesiR==null) return b.manca-a.manca;
    if(a.mesiR==null) return 1;
    if(b.mesiR==null) return -1;
    return a.mesiR-b.mesiR;
  });

  var resta = disp;
  righe.forEach(function(r){
    var vuole = r.serve>0 ? r.serve : r.manca/12;   /* senza scadenza: dodici mesi come ipotesi */
    var dato = Math.max(0, Math.min(resta, vuole));
    r.assegnato = dato;
    r.copre = r.serve>0 ? (dato >= r.serve*0.98) : null;
    r.mesiPrevisti = dato>0 ? r.manca/dato : null;
    r.mancaAlMese = r.serve>0 ? Math.max(0, r.serve-dato) : 0;
    resta -= dato;
  });
  return {disp:disp, resta:Math.max(0,resta), righe:righe, uscAttese:uscAttese, entrate:entrateMese(m)};
}

/* ══════════════════════════════════════════════════════════════
   7. GRAFICI
   Marche sottili, griglia leggera, etichette dirette solo dove servono.
   Ogni grafico è SVG scritto a mano: nessuna libreria, nessuna richiesta di rete.
