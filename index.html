var _uid = 0;
function gid(){ return 'g'+(++_uid); }

/* Barre orizzontali per categoria, con confronto sulla media e tacca del budget. */
function barreCategorie(perCat, totale, opt){
  opt = opt||{};
  var righe = CATS.map(function(k){ return {k:k, v:num(perCat[k.id])}; })
    .filter(function(r){ return r.v>0.005; })
    .sort(function(a,b){ return b.v-a.v; });
  if(!righe.length) return '<div class="empty">Nessuna spesa in questo mese.</div>';
  var max = righe[0].v;
  return righe.map(function(r,i){
    var q = totale>0 ? r.v/totale*100 : 0;
    var b = pos(S.cfg.budget[r.k.id]);
    var over = b>0 && r.v>b;
    /* tacca del budget sulla stessa scala della barra */
    var tacca = '';
    if(b>0 && b<max*1.02) tacca = '<u style="position:absolute;top:-2px;bottom:-2px;width:2px;border-radius:1px;'+
      'background:var(--ink);opacity:.35;left:'+Math.min(99,b/max*100).toFixed(1)+'%"></u>';
    var badge = '';
    if(opt.mese){
      var mc = mediaCat(r.k.id, 3, opt.mese);
      if(mc.mesi>=2 && mc.media>=40){
        var dq = (r.v-mc.media)/mc.media*100;
        /* serve uno scarto grande sia in percentuale sia in franchi: sotto, è rumore */
        if(Math.abs(dq)>=25 && Math.abs(r.v-mc.media)>=30)
          badge = '<span class="badge '+(dq>0?'up':'down')+'">'+(dq>0?'+':'−')+
            Math.abs(dq).toFixed(0)+'% vs media</span>';
      }
    }
    return '<div class="cbar" onclick="apriCategoria(\''+r.k.id+'\')">'+
      '<div class="cl">'+esc(r.k.nome)+'</div>'+
      '<div class="ct" style="position:relative;overflow:visible"><i style="--i:'+i+';width:'+
        Math.max(3,r.v/max*100).toFixed(1)+'%;background:'+r.k.c+'"></i>'+tacca+'</div>'+
      '<div class="cv">'+chf(r.v)+'<em>'+q.toFixed(0)+'%'+(b>0?(over?' · sforo':' · su '+chf(b)):'')+'</em></div>'+
    '</div>'+(badge?'<div style="margin:-4px 0 6px 106px">'+badge+'</div>':'');
  }).join('');
}

/* Anello: la stessa informazione delle barre, ma letta in un colpo d'occhio. */
function chartDonut(perCat, totale, centroL){
  var righe = CATS.map(function(k){ return {n:k.nome, c:k.c, id:k.id, v:num(perCat[k.id])}; })
    .filter(function(r){ return r.v>0.005; })
    .sort(function(a,b){ return b.v-a.v; });
  if(!righe.length || totale<=0) return '';
  var mostra = righe.slice(0,5);
  var resto = righe.slice(5);
  if(resto.length){
    var tr = 0; for(var z=0;z<resto.length;z++) tr += resto[z].v;
    mostra.push({n:'Altre '+resto.length, c:'var(--c9)', id:null, v:tr});
  }
  var R = 41, C = 2*Math.PI*R, off = 0, segs = '';
  mostra.forEach(function(r){
    var len = r.v/totale*C;
    var gap = len>6 ? 2 : 0;
    segs += '<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+r.c+'" stroke-width="13"'+
      ' stroke-dasharray="'+Math.max(0.5,len-gap).toFixed(2)+' '+(C-len+gap).toFixed(2)+'"'+
      ' stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 50 50)">'+
      '<title>'+esc(r.n)+': CHF '+chf(r.v)+' ('+(r.v/totale*100).toFixed(0)+'%)</title></circle>';
    off += len;
  });
  return '<div class="ring"><div class="rg">'+
    '<svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block;animation:pop .5s var(--ease) both" '+
      'role="img" aria-label="Ripartizione delle uscite per categoria">'+segs+'</svg>'+
    '<div class="rc"><b>'+chf(totale)+'</b><em>'+esc(centroL||'uscite')+'</em></div></div>'+
    '<div class="rl">'+mostra.map(function(r){
      return '<span'+(r.id?' onclick="apriCategoria(\''+r.id+'\')" style="cursor:pointer"':'')+'>'+
        '<i style="background:'+r.c+'"></i><u>'+esc(r.n)+'</u>'+
        '<b>'+(r.v/totale*100).toFixed(0)+'%</b></span>';
    }).join('')+'</div></div>';
}

/* Calendario del mese: quanto è costato ogni singolo giorno. */
function chartCalendario(m){
  var sp = speseDi(m), perGiorno = {}, i, max = 0;
  for(i=0;i<sp.length;i++){
    var d = sp[i].d;
    perGiorno[d] = (perGiorno[d]||0) + num(sp[i].chf);
  }
  for(var k in perGiorno) if(perGiorno[k]>max) max = perGiorno[k];
  if(max<=0) return '';
  var tot = giorniMese(m), primo = m+'-01', off = dow(primo);
  var h = '<div class="cal">'+GIORNI3.map(function(g){ return '<div class="cw">'+g.charAt(0)+'</div>'; }).join('');
  for(i=0;i<off;i++) h += '<div class="cd vuoto"></div>';
  for(i=1;i<=tot;i++){
    var ds = m+'-'+String(i).padStart(2,'0');
    var v = perGiorno[ds]||0;
    var q = max>0 ? v/max : 0;
    var mix = v>0 ? Math.round(16+q*84) : 0;
    var futuro = ds > oggi();
    h += '<button class="cd'+(ds===oggi()?' oggi':'')+(mix>52?' hi':'')+(futuro?' futuro':'')+'"'+
      (v>0?' onclick="apriGiorno(\''+ds+'\')"':'')+
      ' style="'+(v>0?'background:color-mix(in srgb,var(--c1) '+mix+'%,var(--line2));':'')+'"'+
      ' title="'+dataBreve(ds)+(v>0?': CHF '+chf(v):': niente')+'">'+i+'</button>';
  }
  h += '</div>';
  h += '<div class="calscale"><span>meno</span>'+[10,34,58,82,100].map(function(p){
    return '<i style="background:color-mix(in srgb,var(--c1) '+p+'%,var(--line2))"></i>'; }).join('')+
    '<span>più</span><span style="margin-left:auto">picco '+chf(max)+'</span></div>';
  return h;
}

/* Sparkline: andamento grezzo dentro una casella KPI. */
function sparkline(vals, colore){
  if(!vals || vals.length<2) return '';
  var W = 100, H = 20, mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals);
  if(mx===mn){ mx = mn+1; }
  var px = function(i){ return i*(W/(vals.length-1)); };
  var py = function(v){ return H-2 - ((v-mn)/(mx-mn))*(H-5); };
  var d = '', i;
  for(i=0;i<vals.length;i++) d += (i?'L':'M')+px(i).toFixed(1)+' '+py(vals[i]).toFixed(1)+' ';
  return '<svg class="sp" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="'+d+'" fill="none" stroke="'+(colore||'var(--mute)')+'" stroke-width="1.6" '+
    'stroke-linecap="round" stroke-linejoin="round" opacity=".8" vector-effect="non-scaling-stroke"/>'+
    '<circle cx="'+px(vals.length-1).toFixed(1)+'" cy="'+py(vals[vals.length-1]).toFixed(1)+
    '" r="2" fill="'+(colore||'var(--mute)')+'" vector-effect="non-scaling-stroke"/></svg>';
}

/* Uscite mese per mese, con la proiezione del mese in corso e la media dei chiusi. */
function chartMesi(serie, opt){
  opt = opt||{};
  if(!serie.length) return '';
  var W=340, H=138, top=16, base=104, L=4, R=4;
  var maxU = 0, i;
  for(i=0;i<serie.length;i++) maxU = Math.max(maxU, serie[i].uscite, serie[i].entrate, num(serie[i].proj));
  if(maxU<=0) maxU = 100;
  var scala = maxU*1.14;
  var slot = (W-L-R)/serie.length;
  var bw = Math.min(30, slot*0.54);
  var y = function(v){ return base - (v/scala)*(base-top); };
  var g = '';
  [0.5,1].forEach(function(f){
    var v = scala*f*0.86;
    g += '<line x1="0" y1="'+y(v).toFixed(1)+'" x2="'+W+'" y2="'+y(v).toFixed(1)+'" stroke="var(--line2)" stroke-width="1"/>'+
      '<text x="0" y="'+(y(v)-3).toFixed(1)+'" font-size="8" fill="var(--mute)" font-family="var(--mono)">'+chf(v)+'</text>';
  });
  g += '<line x1="0" y1="'+base+'" x2="'+W+'" y2="'+base+'" stroke="var(--line)" stroke-width="1"/>';
  var ent = serie[serie.length-1].entrate;
  if(ent>0){
    g += '<line x1="0" y1="'+y(ent).toFixed(1)+'" x2="'+W+'" y2="'+y(ent).toFixed(1)+'" stroke="var(--ok)" stroke-width="1" opacity=".55"/>'+
      '<text x="'+W+'" y="'+(y(ent)-3).toFixed(1)+'" text-anchor="end" font-size="8" fill="var(--ok)" font-family="var(--mono)">entrate '+chf(ent)+'</text>';
  }
  /* media dei mesi già chiusi: la riga a cui confrontarsi */
  var chiusi = serie.filter(function(s){ return s.n>0 && !s.corrente; });
  if(chiusi.length>=2){
    var med = 0; for(i=0;i<chiusi.length;i++) med += chiusi[i].uscite;
    med = med/chiusi.length;
    g += '<line x1="0" y1="'+y(med).toFixed(1)+'" x2="'+W+'" y2="'+y(med).toFixed(1)+
      '" stroke="var(--mute)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>'+
      '<text x="0" y="'+(y(med)-3).toFixed(1)+'" font-size="8" fill="var(--mute)" font-family="var(--mono)">media '+chf(med)+'</text>';
  }
  for(i=0;i<serie.length;i++){
    var s = serie[i], cx = L + slot*i + slot/2;
    var h = Math.max(s.uscite>0?3:0, base - y(s.uscite));
    var last = (i===serie.length-1);
    var col = (s.entrate>0 && s.uscite>s.entrate) ? 'var(--warn)' : 'var(--c1)';
    /* proiezione: la parte che manca al mese in corso, tratteggiata */
    if(s.corrente && num(s.proj)>s.uscite){
      var hp = base - y(num(s.proj));
      g += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(base-hp).toFixed(1)+'" width="'+bw.toFixed(1)+
        '" height="'+(hp-h).toFixed(1)+'" rx="4" fill="'+col+'" opacity=".22"><title>Proiezione fine mese: CHF '+
        chf(s.proj)+'</title></rect>';
    }
    if(h>0) g += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(base-h).toFixed(1)+'" width="'+bw.toFixed(1)+
      '" height="'+h.toFixed(1)+'" rx="4" fill="'+col+'" opacity="'+(last?1:.78)+'" '+
      'style="cursor:pointer" onclick="vaiA(\''+s.m+'\')"><title>'+
      nomeMese(s.m)+': CHF '+chf(s.uscite)+'</title></rect>';
    g += '<text x="'+cx.toFixed(1)+'" y="'+(base+12)+'" text-anchor="middle" font-size="8.5" fill="var(--mute)" font-family="var(--mono)">'+
      MESI3[parseInt(s.m.split('-')[1],10)-1]+'</text>';
    if(last && s.uscite>0) g += '<text x="'+cx.toFixed(1)+'" y="'+(base-Math.max(h,base-y(num(s.proj)||0))-5).toFixed(1)+
      '" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)" font-family="var(--mono)">'+
      chf(s.corrente&&num(s.proj)>s.uscite?s.proj:s.uscite)+'</text>';
  }
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Uscite degli ultimi mesi">'+g+'</svg>';
}

/* Curva morbida da una serie di punti (Catmull-Rom convertita in Bézier). */
function curva(pts){
  if(pts.length<2) return '';
  var d = 'M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(var i=0;i<pts.length-1;i++){
    var p0 = pts[i-1]||pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2]||p2, t = 0.3;
    d += ' C'+(p1[0]+(p2[0]-p0[0])*t).toFixed(1)+' '+(p1[1]+(p2[1]-p0[1])*t).toFixed(1)+
      ','+(p2[0]-(p3[0]-p1[0])*t).toFixed(1)+' '+(p2[1]-(p3[1]-p1[1])*t).toFixed(1)+
      ','+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d;
}
function chartLinea(punti, etichetta, colore){
  colore = colore||'var(--c1)';
  if(punti.length<2) return '';
  var W=340,H=122,top=14,base=94,L=2,R=46, i;
  var vals = punti.map(function(p){ return p.v; });
  var mx = Math.max.apply(null,vals), mn = Math.min.apply(null,vals);
  if(mx===mn){ mx = mx*1.1+10; mn = mn-10; }
  var pad = (mx-mn)*0.14; mx += pad; mn -= pad;
  var px = function(i){ return L + i*((W-L-R)/(punti.length-1)); };
  var py = function(v){ return base - ((v-mn)/(mx-mn))*(base-top); };
  var pts = punti.map(function(p,i){ return [px(i), py(p.v)]; });
  var d = curva(pts);
  var a = d + ' L'+px(punti.length-1).toFixed(1)+' '+base+' L'+px(0).toFixed(1)+' '+base+' Z';
  var id = gid();
  var g = '';
  /* lo zero, quando la serie ci passa sopra */
  if(mn<0 && mx>0) g += '<line x1="0" y1="'+py(0).toFixed(1)+'" x2="'+W+'" y2="'+py(0).toFixed(1)+
    '" stroke="var(--warn)" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/>';
  g += '<line x1="0" y1="'+base+'" x2="'+W+'" y2="'+base+'" stroke="var(--line)" stroke-width="1"/>';
  g += '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+colore+'" stop-opacity=".20"/>'+
    '<stop offset="100%" stop-color="'+colore+'" stop-opacity="0"/></linearGradient></defs>';
  g += '<path d="'+a+'" fill="url(#'+id+')"/>';
  g += '<path d="'+d+'" fill="none" stroke="'+colore+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  for(i=0;i<punti.length;i++){
    var ultimo = (i===punti.length-1);
    g += '<circle cx="'+px(i).toFixed(1)+'" cy="'+py(punti[i].v).toFixed(1)+'" r="'+(ultimo?4:2.2)+
      '" fill="'+(punti[i].v<0?'var(--warn)':colore)+'" stroke="var(--card)" stroke-width="2"><title>'+
      esc(punti[i].lab||punti[i].x)+': CHF '+chf(punti[i].v)+'</title></circle>';
  }
  var li = punti.length-1;
  g += '<text x="'+(px(li)+7).toFixed(1)+'" y="'+(py(punti[li].v)+3.5).toFixed(1)+
    '" font-size="10" font-weight="600" fill="var(--ink)" font-family="var(--mono)">'+chf(punti[li].v)+'</text>';
  g += '<text x="0" y="'+(base+13)+'" font-size="8.5" fill="var(--mute)" font-family="var(--mono)">'+esc(punti[0].lab||punti[0].x)+'</text>';
  g += '<text x="'+(W-R+2)+'" y="'+(base+13)+'" text-anchor="end" font-size="8.5" fill="var(--mute)" font-family="var(--mono)">'+
    esc(punti[li].lab||punti[li].x)+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(etichetta)+'">'+g+'</svg>';
}

/* Quanto costa ogni giorno della settimana: dove si nasconde la fuga di soldi. */
function barreGiorni(dati){
  var max = 0, i;
  for(i=0;i<dati.length;i++) max = Math.max(max, dati[i].media);
  if(max<=0) return '';
  return dati.map(function(g,i){
    var forte = g.media >= max*0.999;
    return '<div class="nb"><div class="nl">'+GIORNI3[i]+'</div>'+
      '<div class="nt"><i style="--i:'+i+';width:'+Math.max(2,g.media/max*100).toFixed(1)+
        '%;background:'+(forte?'var(--c2)':'var(--c1)')+';opacity:'+(forte?1:.72)+'"></i></div>'+
      '<div class="nv">'+chf(g.media)+'</div></div>';
  }).join('');
}

function barraProgresso(fatto, totale, colore){
  var q = totale>0 ? Math.min(100, fatto/totale*100) : 0;
  return '<div class="pb"><i style="width:'+q.toFixed(1)+'%;background:'+(colore||'var(--ok)')+'"></i></div>';
}

      }).join('') : '<div class="empty">Nessuna. Se hai affitti, rimborsi o un secondo lavoro, aggiungili.</div>')+'</div>';
  }
  if(st===2){
    h += '<h2>Cosa paghi ogni mese senza pensarci?</h2>'+
      '<p class="q">Le spese fisse. Tocca una voce per aggiungerla, poi scrivi l\'importo. '+
      'Ogni mese te le ripropongo io con un tocco, così non le riscrivi.</p>'+
      '<div class="chips" style="margin-bottom:12px">'+PRESET_FISSE.map(function(p,i){
        return '<button onclick="addFissaPreset('+i+')">'+esc(p.nome)+'</button>'; }).join('')+'</div>'+
      '<div class="card">'+listaRicorrentiEdit()+'</div>'+
      '<div class="addrow"><input type="text" id="nfNome" placeholder="Altra spesa fissa">'+
      '<input class="sm" type="number" inputmode="decimal" id="nfImp" placeholder="CHF">'+
      '<button onclick="addFissaLibera()">+</button></div>';
  }
  if(st===3){
    h += '<h2>Dove sono i soldi che hai già da parte?</h2>'+
      '<p class="q">Solo i saldi, per capire da dove parti. Se non lo sai con precisione, metti una cifra approssimativa e la correggi dopo.</p>'+
      '<div class="chips" style="margin-bottom:12px">'+PRESET_CONTI.map(function(p){
        return '<button onclick="addConto(\''+p+'\')">'+esc(p)+'</button>'; }).join('')+'</div>'+
      '<div class="card">'+(S.conti.length? S.conti.map(function(c,i){
        return '<div class="erow"><div class="en">'+esc(c.nome)+'</div>'+
          '<input class="ev" type="number" inputmode="decimal" value="'+esc(c.saldo||'')+'" oninput="setSaldo('+i+',this.value)">'+
          '<button class="del" onclick="S.conti.splice('+i+',1);save();render()">×</button></div>';
      }).join('') : '<div class="empty">Nessun conto. Aggiungine almeno uno: senza saldo non posso dirti quanti mesi di spese copri.</div>')+'</div>'+
      '<div class="addrow"><input type="text" id="ncNome" placeholder="Altro conto">'+
      '<input class="sm" type="number" inputmode="decimal" id="ncSaldo" placeholder="CHF">'+
      '<button onclick="addContoLibero()">+</button></div>';
  }
  if(st===4){
    h += '<h2>Hai già qualcosa investito?</h2>'+
      '<p class="q">ETF, azioni, cripto, 3° pilastro in titoli. Se non hai ancora iniziato salta pure: la sezione resta lì per quando servirà.</p>'+
      '<div class="card">'+(S.invest.length? S.invest.map(function(p,i){
        return '<div class="erow"><div class="en">'+esc(p.nome)+'<em>'+esc(p.qta)+' × '+chf2(p.prezzo)+' '+esc(p.val)+'</em></div>'+
          '<button class="del" onclick="S.invest.splice('+i+',1);save();render()">×</button></div>';
      }).join('') : '<div class="empty">Niente per ora.</div>')+'</div>'+
      '<div class="addrow"><input type="text" id="niNome" placeholder="Es. VWCE, 3° pilastro">'+
      '<input class="sm" type="number" inputmode="decimal" id="niVal" placeholder="Valore CHF">'+
      '<button onclick="addInvestSemplice()">+</button></div>'+
      '<div class="note">Qui basta il valore attuale. Nella sezione Investimenti puoi poi entrare nel dettaglio con quantità, prezzo medio di carico e rendimento.</div>';
  }
  if(st===5){
    var spm = totRicorrenti();
    h += '<h2>Per cosa stai mettendo da parte?</h2>'+
      '<p class="q">Un obiettivo è una cifra con una data. Senza data resta un desiderio e non riesco a dirti quanto serve al mese.</p>'+
      '<div class="chips" style="margin-bottom:12px">'+PRESET_OB.map(function(p){
        return '<button onclick="addObPreset(\''+p+'\')">'+esc(p)+'</button>'; }).join('')+'</div>'+
      '<div class="card">'+(S.obiettivi.length? S.obiettivi.map(function(o,i){
        return '<div class="erow"><div class="en">'+esc(o.nome)+'<em>'+(o.scad?'entro '+dataBreve(o.scad):'senza scadenza')+'</em></div>'+
          '<input class="ev" type="number" inputmode="decimal" value="'+esc(o.target||'')+'" oninput="S.obiettivi['+i+'].target=num(this.value);save()">'+
          '<button class="del" onclick="S.obiettivi.splice('+i+',1);save();render()">×</button></div>';
      }).join('') : '<div class="empty">Nessun obiettivo.</div>')+'</div>'+
      '<div class="addrow"><input type="text" id="noNome" placeholder="Nome obiettivo">'+
      '<input class="sm" type="number" inputmode="decimal" id="noTarget" placeholder="CHF">'+
      '<button onclick="addObLibero()">+</button></div>'+
      (spm>0?'<div class="note">Un fondo emergenza da <b>CHF '+chf(spm*3)+'</b> copre 3 mesi delle spese fisse che hai appena inserito. È il primo obiettivo che ha senso chiudere, prima di investire.</div>':'');
  }
  if(st===6){
    var ent = entrateMese(meseOggi()), fisse = totRicorrenti();
    var libero = Math.max(0, ent-fisse);
    h += '<h2>Ultime due cose.</h2>'+
      '<p class="q">Quanto vuoi mettere da parte ogni mese, e a che cambio converto le spese che fai in euro.</p>'+
      campo('Obiettivo di risparmio mensile (CHF)','number','setTargetRisp(this.value)',S.cfg.targetRisparmio||'',
        (ent>0?'Dopo le spese fisse ti restano circa <b>CHF '+chf(libero)+'</b> al mese per vivere e risparmiare.':'')
        ,'inputmode="decimal" placeholder="0"')+
      campo('1 EUR = quanti CHF?','number','setCfg(\'fx\',this.value,1)',S.cfg.fx,
        'Serve per la spesa in Italia. Ogni spesa si salva con il cambio del giorno in cui la inserisci, quindi lo storico non si muove quando aggiorni il tasso.','inputmode="decimal" step="0.01"')+
      campo('Avvisami sopra questa cifra (CHF)','number','setCfg(\'sogliaEvitabile\',this.value,1)',S.cfg.sogliaEvitabile,
        'Se segni come evitabile una spesa più grossa di così, te la faccio notare.','inputmode="decimal"')+
      '<div class="note ok">Fatto. Da qui in poi ti basta aggiungere le spese: la categoria la metto io, e quando sbaglio la correggi una volta sola.</div>';
  }
  h += '<div class="btn2" style="margin-top:22px">'+
    (st>0?'<button class="btn ghost" onclick="obGo(-1)">Indietro</button>':'')+
    '<button class="btn" onclick="obGo(1)">'+(st===OB_STEPS-1?'Inizia':'Avanti')+'</button></div>';
  if(st>0 && st<OB_STEPS-1)
    h += '<button class="btn ghost sm" style="margin-top:9px;border:0;color:var(--mute)" onclick="obGo(1)">Salta questo passo</button>';
  h += '</div>';
  return h;
}
function obGo(d){
  S.obStep += d;
  if(S.obStep<0) S.obStep = 0;
  if(S.obStep>=OB_STEPS){
    S.setup = true; S.obStep = OB_STEPS-1;
    if(!pos(S.cfg.targetTasso) && entrateMese(meseOggi())>0 && pos(S.cfg.targetRisparmio))
      S.cfg.targetTasso = S.cfg.targetRisparmio/entrateMese(meseOggi())*100;
  }
  save(); render(); window.scrollTo(0,0);
}
function setMens(n){ S.cfg.mensilita = n; save(); render(); }
function setTargetRisp(v){
  S.cfg.targetRisparmio = num(v);
  var e = entrateMese(meseOggi());
  S.cfg.targetTasso = e>0 ? num(v)/e*100 : 0;
  save();
}
function addExtra(){ S.cfg.extra.push({id:uid(), nome:'Entrata extra', imp:0}); save(); render(); }
function listaRicorrentiEdit(){
  if(!S.ricorrenti.length) return '<div class="empty">Nessuna spesa fissa. Affitto, cassa malati, telefono: sono quelle che pesano di più.</div>';
  return S.ricorrenti.map(function(r,i){
    return '<div class="erow"><span class="dot" style="background:'+cat(r.cat).c+'"></span>'+
      '<div class="en">'+esc(r.nome)+'<em>'+cat(r.cat).nome+'</em></div>'+
      '<input class="ev" type="number" inputmode="decimal" value="'+esc(r.imp||'')+'" oninput="S.ricorrenti['+i+'].imp=num(this.value);save()">'+
      '<button class="del" onclick="S.ricorrenti.splice('+i+',1);save();render()">×</button></div>';
  }).join('');
}
function addFissaPreset(i){
  var p = PRESET_FISSE[i];
  for(var j=0;j<S.ricorrenti.length;j++) if(S.ricorrenti[j].nome===p.nome) return;
  S.ricorrenti.push({id:uid(), nome:p.nome, imp:0, val:'CHF', cat:p.cat, need:cat(p.cat).need, giorno:1, attiva:true});
  save(); render();
}
function addFissaLibera(){
  var n = document.getElementById('nfNome'), v = document.getElementById('nfImp');
  if(!n||!n.value.trim()) return;
  var d = detect(n.value);
  S.ricorrenti.push({id:uid(), nome:n.value.trim(), imp:num(v.value), val:'CHF', cat:d.cat, need:d.need, giorno:1, attiva:true});
  save(); render();
}
function addConto(nome){
  for(var j=0;j<S.conti.length;j++) if(S.conti[j].nome===nome) return;
  S.conti.push({id:uid(), nome:nome, saldo:0, storico:[]});
  save(); render();
}
function addContoLibero(){
  var n = document.getElementById('ncNome'), v = document.getElementById('ncSaldo');
  if(!n||!n.value.trim()) return;
  S.conti.push({id:uid(), nome:n.value.trim(), saldo:num(v.value), storico:[{d:oggi(), v:num(v.value)}]});
  save(); render();
}
function setSaldo(i,v){ S.conti[i].saldo = num(v); save(); }
function addInvestSemplice(){
  var n = document.getElementById('niNome'), v = document.getElementById('niVal');
  if(!n||!n.value.trim()) return;
  S.invest.push({id:uid(), nome:n.value.trim(), tipo:'altro', qta:1, pmc:num(v.value), prezzo:num(v.value),
    val:'CHF', fx:S.cfg.fx, storico:[{d:oggi(), v:num(v.value)}]});
  save(); render();
}
function addObPreset(nome){
  for(var j=0;j<S.obiettivi.length;j++) if(S.obiettivi[j].nome===nome) return;
  var t = 0;
  if(nome==='Fondo emergenza') t = Math.round(totRicorrenti()*3/100)*100;
  S.obiettivi.push({id:uid(), nome:nome, target:t, acc:0, scad:'', creato:oggi()});
  save(); render();
}
function addObLibero(){
  var n = document.getElementById('noNome'), v = document.getElementById('noTarget');
  if(!n||!n.value.trim()) return;
  S.obiettivi.push({id:uid(), nome:n.value.trim(), target:num(v.value), acc:0, scad:'', creato:oggi()});
  save(); render();
}

   10. HOME
   ══════════════════════════════════════════════════════════════ */
function navMese(){
  var m = S.mese, futuro = m >= meseOggi(), c;
  return '<div class="card pad" style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'+
    '<button class="del" style="font-size:22px" onclick="vaiMese(-1)" aria-label="Mese precedente">‹</button>'+
    '<div style="flex:1;text-align:center;cursor:pointer" onclick="'+(futuro?'':'vaiA(\''+meseOggi()+'\')')+'">'+
    '<div style="font-size:15px;font-weight:600;text-transform:capitalize">'+nomeMese(m)+'</div>'+
    '<div style="font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.5px">'+
      (m===meseOggi()? 'GIORNO '+giorniPassati(m)+' DI '+giorniMese(m)
                     : speseDi(m).length+' SPESE · TOCCA PER TORNARE A OGGI')+'</div></div>'+
    '<button class="del" style="font-size:22px;'+(futuro?'opacity:.25':'')+'" onclick="vaiMese(1)" aria-label="Mese successivo">›</button>'+
  '</div>';
}
function vaiMese(d){
  var n = meseShift(S.mese,d);
  if(n > meseOggi()) return;
  S.mese = n; save(); render(); window.scrollTo(0,0);
}
function vaiA(m){
  if(!m || m > meseOggi()) return;
  S.mese = m; S.tab = 'home'; save(); render(); window.scrollTo(0,0);
}
function barraNecessita(c){
  if(c.uscite<=0) return '';
  var col = ['var(--ok)','var(--amber)','var(--warn)'];
  var seg = c.perNeed.map(function(v,i){
    if(v<=0) return '';
    return '<i style="flex:'+v+';background:'+col[i]+';border-radius:5px" title="'+NEEDS[i].lab+': CHF '+chf(v)+'"></i>';
  }).join('');
  return '<div class="card"><div style="display:flex;height:10px;gap:2px;margin-bottom:11px">'+seg+'</div>'+
    '<div class="legend">'+NEEDS.map(function(n,i){
      return '<span><i style="background:'+col[i]+'"></i>'+n.lab+' · <b style="font-family:var(--mono);color:var(--ink)">'+
        chf(c.perNeed[i])+'</b></span>'; }).join('')+'</div>'+
    (c.perNeed[2]>0? '<div class="note'+(c.quotaEvitabile>=20?' amber':'')+'">Le spese evitabili di questo mese valgono <b>CHF '+
      chf(c.perNeed[2])+'</b>. Se le tagliassi a metà, in un anno metteresti via <b>CHF '+chf(c.perNeed[2]*6)+'</b> in più.'+
      ' <a href="#" onclick="apriEvitabili();return false" style="color:var(--accent);font-weight:600">Guardale.</a></div>':'')+
  '</div>';
}

/* La scheda dei task della settimana. */
function cardTask(lista){
  if(S.cfg.task === false) return '';
  lista = lista || generaTask();
  if(!lista.length) return '';
  var st = statoTask();
  var fatti = lista.filter(function(x){ return x.fatto; }).length;
  var h = '<div class="h2">Questa settimana<span class="r">'+fatti+' di '+lista.length+'</span></div>';
  h += '<div class="card">';
  h += '<div class="tkbar">'+lista.map(function(x){ return '<i class="'+(x.fatto?'on':'')+'"></i>'; }).join('')+'</div>';
  h += lista.map(function(x){
    var prog = '';
    if(x.prog && x.prog.t>0){
      var q = Math.min(100, x.prog.v/x.prog.t*100);
      var col = x.prog.sup ? 'var(--warn)' : (x.prog.inv ? 'var(--ok)' : 'var(--accent)');
      prog = '<div class="pb" style="height:5px;margin:7px 0 0"><i style="width:'+q.toFixed(1)+'%;background:'+col+'"></i></div>';
    }
    return '<div class="tk'+(x.fatto?' done':'')+'">'+
      '<button class="cb" onclick="toggleTask(\''+x.k+'\')" aria-label="Fatto">✓</button>'+
      '<div class="tb"><h4>'+esc(x.tit)+'</h4><p>'+x.txt+'</p>'+prog+'</div>'+
      (x.azione && !x.fatto? '<button class="go" onclick="'+x.azione+'">'+esc(x.azLab||'Vai')+'</button>':'')+
    '</div>';
  }).join('');
  var msg;
  if(fatti===lista.length) msg = 'Settimana chiusa bene: tutte spuntate.';
  else if(fatti>=Math.ceil(lista.length*0.6)) msg = 'Ancora '+(lista.length-fatti)+' e la settimana conta per la serie.';
  else msg = 'Si rigenerano ogni lunedì in base a com\'è messo il tuo mese. Quelle che posso verificare da solo si spuntano da sole.';
  h += '<div class="note'+(fatti===lista.length?' ok':'')+'">'+msg+
    (num(st.streak)>0? ' <b>Serie in corso: '+st.streak+(num(st.streak)===1?' settimana':' settimane')+'.</b>':'')+'</div>';
  h += '</div>';
  return h;
}

/* Dal saldo del mese alla cifra di oggi, una riga per sottrazione.
   Niente si toglie di nascosto: se il margine è più basso dell'avanzo, qui si vede perché. */
function cardMargine(bg, c){
  var resta = c.entrate - c.uscite;
  var toglie = bg.fisse>0 || bg.target>0;
  var perGiorno = bg.gg>2;   /* negli ultimi giorni "al giorno" si gonfia e non dice più niente */
  var h = '<div class="h2">Quanto posso spendere<span class="r">'+
    (bg.resta<0 ? 'margine finito'
      : (perGiorno? 'CHF '+chf(bg.giorno)+' al giorno' : 'CHF '+chf(bg.resta)+' in tutto'))+
    '</span></div><div class="card">';
  h += '<div class="stat"><em>Ti resta questo mese</em><b>'+chf(resta)+'</b></div>';
  if(bg.fisse>0)
    h += '<div class="stat"><em>Spese fisse ancora da pagare'+(bg.nFisse?' ('+bg.nFisse+')':'')+'</em>'+
      '<b style="color:var(--warn)">− '+chf(bg.fisse)+'</b></div>';
  if(bg.target>0)
    h += '<div class="stat"><em>Che vuoi mettere da parte</em>'+
      '<b style="color:var(--warn)">− '+chf(bg.target)+'</b></div>';
  h += '<div class="stat" style="border-bottom:0;border-top:1px solid var(--line);margin-top:4px;padding-top:12px">'+
    '<em style="color:var(--ink);font-weight:600">Margine libero</em>'+
    '<b style="font-size:17px'+(bg.resta<0?';color:var(--warn)':'')+'">'+
    (bg.resta<0?'− ':'')+chf(Math.abs(bg.resta))+'</b></div>';

  if(!toglie){
    h += '<div class="note">Non hai spese fisse in sospeso né un obiettivo di risparmio impostato, '+
      'quindi il margine coincide con quello che ti resta.</div>';
  } else if(bg.resta<0){
    h += '<div class="note warn">Il margine è sotto di <b>CHF '+chf(-bg.resta)+'</b>. '+
      'Non vuol dire che il conto sia in rosso — ti restano comunque CHF '+chf(resta)+' — '+
      'ma per pagare le fisse e mettere via i '+chf(bg.target)+' che ti sei dato, da qui a fine mese '+
      'dovresti spendere zero. Le strade sono due: rivedere l\'obiettivo di risparmio o tagliare.</div>';
  } else {
    h += '<div class="note">Sono <b>CHF '+chf(bg.giorno)+' al giorno</b> per i '+bg.gg+
      (bg.gg===1?' giorno che manca':' giorni che mancano')+', oggi compreso. '+
      'Quello che non spendi si somma al risparmio.</div>';
  }
  if(bg.nFisse>0)
    h += '<button class="btn ghost sm" onclick="applicaTutteDa(\''+c.mese+'\')">Registra le '+bg.nFisse+
      ' spese fisse ('+chf(bg.fisse)+')</button>';
  h += '</div>';
  return h;
}

function tabHome(){
  var m = S.mese, c = calc(m), h = '', i;
  h += navMese();

  var resta = c.entrate - c.uscite;
  var bg = budgetGiornaliero(m);
  if(c.entrate>0){
    /* Il numero grande è sempre la sottrazione che puoi rifare a mente: entrate meno
       uscite registrate. Le cifre derivate (margine, quanto al giorno) stanno nella
       scheda qui sotto, dove ogni riga che si toglie è scritta e verificabile. */
    h += '<div class="hero"><div class="l">'+(c.corrente?'Ti resta questo mese':'Avanzo del mese')+'</div>'+
      '<div class="v">'+(resta<0?'−':'')+'CHF '+chf(Math.abs(resta))+'</div>'+
      '<div class="s">Entrate '+chf(c.entrate)+' meno '+chf(c.uscite)+' di uscite registrate'+
        (c.corrente?' fino a oggi':'')+'. '+
        (resta<0 ? 'Le uscite hanno superato le entrate di CHF '+chf(-resta)+'.'
                 : 'Tasso di risparmio del '+pct(c.tasso)+'.')+'</div>'+
      '<div class="bar"><i style="width:'+Math.min(100,c.uscite/c.entrate*100).toFixed(1)+'%"></i></div>'+
      '<div class="foot"><span>uscite '+chf(c.uscite)+'</span><span>entrate '+chf(c.entrate)+'</span></div></div>';
    if(bg) h += cardMargine(bg, c);
  } else {
    h += '<div class="hero"><div class="l">Uscite di '+nomeMese(m,1)+'</div>'+
      '<div class="v">CHF '+chf(c.uscite)+'</div>'+
      '<div class="s">Non hai ancora messo lo stipendio: senza quello non posso dirti quanto ti resta. '+
      '<a href="#" onclick="go(\'set\');return false" style="color:inherit">Aggiungilo qui.</a></div></div>';
  }

  /* KPI con sparkline: il numero e la sua direzione, insieme */
  var serieK = serieMesi(6, m);
  var tassi = serieK.filter(function(s){ return s.n>0 && s.entrate>0; })
    .map(function(s){ return (s.entrate-s.uscite)/s.entrate*100; });
  var snapV = (S.snap||[]).slice(-12).map(function(s){ return num(s.liq)+num(s.inv); });
  var pat = patrimonio();
  h += '<div class="kpi">'+
    '<div><div class="l">Risparmio</div><div class="v '+(c.tasso>=0?'pos':'neg')+'">'+(c.entrate>0?pct(c.tasso):'—')+'</div>'+
      '<div class="s">'+(pos(S.cfg.targetTasso)?'obiettivo '+pct(S.cfg.targetTasso):'nessun obiettivo')+'</div>'+
      (tassi.length>=3? sparkline(tassi, c.tasso>=0?'var(--ok)':'var(--warn)') : '')+'</div>'+
    '<div><div class="l">Spese fisse</div><div class="v">'+chf(totRicorrenti())+'</div>'+
      '<div class="s">'+(c.entrate>0?pct(totRicorrenti()/c.entrate*100)+' delle entrate':'al mese')+'</div></div>'+
    '<div><div class="l">Patrimonio</div><div class="v">'+chf(pat)+'</div>'+
      '<div class="s">'+chf(saldoConti())+' liquidi</div>'+
      (snapV.length>=3? sparkline(snapV,'var(--accent)') : '')+'</div>'+
  '</div>';

  /* Se un task sta già chiedendo una cosa, l'avviso che la ripete è rumore. */
  var taskAttivi = (m===meseOggi() && S.cfg.task!==false) ? generaTask() : [];
  if(taskAttivi.length) h += cardTask(taskAttivi);
  var coperti = {};
  taskAttivi.forEach(function(x){ if(x.dup && !x.fatto) coperti[x.dup] = 1; });

  var av = avvisi(m).filter(function(a){ return !(a.dup && coperti[a.dup]); });
  if(av.length){
    h += '<div class="h2">Da guardare<span class="r">'+av.length+'</span></div>';
    h += av.slice(0,5).map(function(a){
      return '<div class="alert '+a.cls+'"><div class="ai">'+a.ic+'</div><div class="ab"><h4>'+a.tit+'</h4><p>'+a.txt+'</p>'+
        (a.azione? '<button class="btn sm" style="width:auto;padding:8px 14px;margin-top:9px" onclick="'+a.azione+'">'+a.azLab+'</button>':'')+
        '</div><button class="ax" onclick="ignora(\''+a.id+'\')" aria-label="Ignora">×</button></div>';
    }).join('');
    if(av.length>5) h += '<div class="note">Altri '+(av.length-5)+' avvisi di peso minore: compaiono qui appena chiudi questi.</div>';
  } else if(c.spese.length) {
    h += '<div class="h2">Da guardare</div><div class="alert g"><div class="ai">✓</div><div class="ab">'+
      '<h4>Tutto in ordine</h4><p>Nessun budget sforato, nessun doppione, nessuna spesa fuori riga.</p></div></div>';
  }

  h += '<div class="h2">Dove sono finiti i soldi<span class="r">CHF '+chf(c.uscite)+'</span></div>';
  var donut = chartDonut(c.perCat, c.uscite, nomeMese(m,1));
  if(donut) h += '<div class="card">'+donut+'</div>';
  h += '<div class="card">'+barreCategorie(c.perCat, c.uscite, {mese:m})+'</div>';

  if(c.uscite>0) h += '<div class="h2">Serviva?</div>' + barraNecessita(c);

  var serie = serieMesi(6, m);
  while(serie.length>2 && serie[0].n===0) serie.shift();
  if(serie.filter(function(s){return s.n>0;}).length>=2){
    var cf = confrontoMese(m);
    var conProj = serie.filter(function(x){ return x.corrente && num(x.proj)>x.uscite; }).length>0;
    h += '<div class="h2">Ultimi mesi</div><div class="card">'+chartMesi(serie)+
      '<div class="note">'+(conProj?'La parte sfumata dell\'ultimo mese è la proiezione a fine mese, spese fisse ancora da registrare comprese. ':'')+
      (conProj && c.unaTantum>0 ? 'Le '+chf(c.unaTantum)+' di spese grosse e isolate di questo mese le conto una volta sola, non le estrapolo. ':'')+
      'Media delle uscite nei mesi già chiusi: <b>CHF '+chf(mediaUscite(3,m))+'</b>.'+
      (cf? ' Rispetto agli stessi '+cf.giorni+' giorni di '+nomeMese(cf.mese,1)+': <b>'+
        (cf.delta>0?'+':'−')+'CHF '+chf(Math.abs(cf.delta))+'</b>.':'')+'</div></div>';
  }

  var ult = c.spese.slice(0,5);
  h += '<div class="h2">Ultime spese<button onclick="go(\'spese\')">vedi tutte</button></div><div class="card">'+
    (ult.length? ult.map(rigaSpesa).join('') : '<div class="empty"><b>Ancora niente per '+nomeMese(m,1)+'</b>Tocca il + in basso a destra per aggiungere la prima spesa.</div>')+
  '</div>';
  return h;
}
function ignora(id){ S.letti.push(id); if(S.letti.length>400) S.letti = S.letti.slice(-400); save(); render(); }

/* ══════════════════════════════════════════════════════════════
   11. SPESE
   ══════════════════════════════════════════════════════════════ */
function rigaSpesa(s, senzaData){
  var k = cat(s.cat), n = num(s.need); if(n<0||n>2) n=1;
  return '<div class="row tap" onclick="apriSpesa(\''+s.id+'\')">'+
    '<span class="dot" style="background:'+k.c+'"></span>'+
    '<div class="n">'+esc(s.desc||k.nome)+
      '<em>'+(senzaData?'':dataBreve(s.d)+' · ')+k.nome+(s.ric?' · fissa':'')+(s.diviso?' · diviso a metà':'')+
      (num(s.need)===2?' · <span style="color:var(--warn)">evitabile</span>':'')+'</em></div>'+
    '<div class="v">'+chf2(s.chf)+(s.val==='EUR'?'<span>€ '+chf2(s.imp)+'</span>':'')+'</div>'+
  '</div>';
}
function etichettaGiorno(d){
  if(d===oggi()) return 'Oggi';
  if(d===shiftGiorni(oggi(),-1)) return 'Ieri';
  return GIORNI[dow(d)]+' '+dataBreve(d);
}
/* Lista raggruppata per giorno: leggere "martedì 120" vale più di dieci righe sparse. */
function listaSpeseHTML(lista, vuoto){
  if(!lista.length) return '<div class="empty">'+(vuoto||'<b>Nessuna spesa</b>Non c\'è niente da mostrare.')+'</div>';
  var tot = {}, i;
  for(i=0;i<lista.length;i++) tot[lista[i].d] = (tot[lista[i].d]||0) + num(lista[i].chf);
  var out = '', giorno = null;
  for(i=0;i<lista.length;i++){
    var s = lista[i];
    if(s.d !== giorno){
      giorno = s.d;
      out += '<div style="display:flex;align-items:baseline;gap:8px;padding:'+(i?'14px':'2px')+' 0 5px">'+
        '<span style="font-size:11.5px;font-weight:700;letter-spacing:.2px">'+esc(etichettaGiorno(giorno))+'</span>'+
        '<span style="margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--mute)">CHF '+chf(tot[giorno])+'</span></div>';
    }
    out += rigaSpesa(s, true);
  }
  return out;
}
function speseFiltrate(){
  var c = calc(S.mese), f = S.filtro||{};
  var q = piatto(f.q||'').trim();
  return c.spese.filter(function(s){
    if(f.cat && (s.cat||'altro')!==f.cat) return false;
    if(f.need!=null && num(s.need)!==f.need) return false;
    if(q && piatto(s.desc+' '+cat(s.cat).nome).indexOf(q)<0) return false;
    return true;
  });
}
/* La ricerca aggiorna solo la lista: se ridisegnassi tutto perderei il fuoco dal campo. */
function cercaSpese(v){
  S.filtro = S.filtro||{};
  S.filtro.q = v;
  var box = document.getElementById('listaBox');
  var tot = document.getElementById('listaTot');
  if(!box) { render(); return; }
  var l = speseFiltrate();
  box.innerHTML = listaSpeseHTML(l, '<b>Nessun risultato</b>Con questo filtro non c\'è niente.');
  if(tot) tot.textContent = 'CHF '+chf(sommaCHF(l));
}
function tabSpese(){
  var m = S.mese, c = calc(m), h = '';
  var f = S.filtro||{};
  h += navMese();
  h += '<div class="kpi">'+
    '<div><div class="l">Uscite</div><div class="v">'+chf(c.uscite)+'</div><div class="s">'+c.spese.length+' movimenti</div></div>'+
    '<div><div class="l">Media/giorno</div><div class="v">'+chf(c.giorni>0?c.uscite/c.giorni:0)+'</div>'+
      '<div class="s">'+(c.corrente?'proiezione '+chf(c.proiezione):'mese chiuso')+'</div></div>'+
    '<div><div class="l">Evitabili</div><div class="v '+(c.evitabile>0?'neg':'')+'">'+chf(c.evitabile)+'</div>'+
      '<div class="s">'+(c.uscite>0?pct(c.quotaEvitabile)+' del totale':'—')+'</div></div>'+
  '</div>';
  h += '<div class="btn2" style="margin-bottom:14px">'+
    '<button class="btn acc" onclick="apriNuova()">+ Nuova spesa</button>'+
    '<button class="btn ghost" onclick="apriRicorrenti()">Spese fisse</button></div>';

  /* il mese giorno per giorno */
  var cal = chartCalendario(m);
  if(cal){
    var picco = 0, gg = null, k;
    for(k in c.perGiorno) if(c.perGiorno[k]>picco){ picco = c.perGiorno[k]; gg = k; }
    var vuoti = 0;
    for(var i=1;i<=giorniPassati(m);i++){
      var ds = m+'-'+String(i).padStart(2,'0');
      if(!c.perGiorno[ds]) vuoti++;
    }
    h += '<div class="h2">Il mese giorno per giorno</div><div class="card">'+cal+
      '<div class="note">'+(gg? 'Il giorno più caro è stato <b>'+etichettaGiorno(gg)+'</b> con CHF '+chf(picco)+'. ':'')+
      (vuoti>0? vuoti+(vuoti===1?' giorno è passato':' giorni sono passati')+' senza spendere niente.':'')+
      ' Tocca un giorno per vedere cosa c\'è dentro.</div></div>';
  }

  /* ricerca + filtri */
  h += '<div class="srch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+
    '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'+
    '<input type="text" placeholder="Cerca fra le spese del mese" value="'+esc(f.q||'')+
    '" oninput="cercaSpese(this.value)" autocomplete="off"></div>';
  h += '<div class="chips" style="margin-bottom:12px">'+
    '<button class="'+(!f.cat&&f.need==null?'on':'')+'" onclick="setFiltro(null,null)">Tutte</button>'+
    CATS.filter(function(k){ return (c.perCat[k.id]||0)>0; }).map(function(k){
      return '<button class="'+(f.cat===k.id?'on':'')+'" onclick="setFiltro(\''+k.id+'\',null)"><i style="background:'+k.c+'"></i>'+esc(k.nome)+'</button>';
    }).join('')+
    (c.evitabile>0?'<button class="'+(f.need===2?'on':'')+'" onclick="setFiltro(null,2)">Solo evitabili</button>':'')+
  '</div>';

  var lista = speseFiltrate();
  h += '<div class="h2">'+(f.cat?esc(cat(f.cat).nome):(f.need===2?'Spese evitabili':'Movimenti'))+
    '<span class="r" id="listaTot">CHF '+chf(sommaCHF(lista))+'</span></div>';
  h += '<div class="card" id="listaBox">'+listaSpeseHTML(lista,
    '<b>Nessuna spesa</b>'+(f.cat||f.need!=null||f.q?'Con questo filtro non c\'è niente.':'Tocca "Nuova spesa" per iniziare.'))+'</div>';

  /* ritmo settimanale */
  if(S.spese.length>=20){
    var gs = perGiornoSettimana(90);
    var bar = barreGiorni(gs);
    if(bar){
      var med = 0; for(var z=0;z<7;z++) med += gs[z].media; med = med/7;
      var top = gs.slice().sort(function(a,b){ return b.media-a.media; })[0];
      var low = gs.slice().sort(function(a,b){ return a.media-b.media; })[0];
      h += '<div class="h2">Il tuo ritmo settimanale</div><div class="card">'+bar+
        '<div class="note">Media di un giorno qualunque negli ultimi 3 mesi: <b>CHF '+chf(med)+'</b>. '+
        'Il '+GIORNI[top.g]+' è il più caro ('+chf(top.media)+'), il '+GIORNI[low.g]+' il più leggero ('+chf(low.media)+'). '+
        'Spese fisse escluse: qui si vedono solo le scelte di tutti i giorni.</div></div>';
    }
  }

  /* budget per categoria */
  h += '<div class="h2">Budget per categoria<button onclick="suggerisciBudget()">suggerisci</button></div><div class="card">'+
    '<p class="lede">Un tetto mensile per categoria. Ti avviso all\'85% e quando lo superi. Lascia a 0 quelle che non vuoi controllare. '+
    '"Suggerisci" li riempie con la media dei tuoi ultimi 3 mesi.</p>'+
    CATS.map(function(k){
      var b = pos(S.cfg.budget[k.id]), sp = c.perCat[k.id]||0;
      return '<div class="erow"><span class="dot" style="background:'+k.c+'"></span>'+
        '<div class="en">'+esc(k.nome)+'<em>'+(b>0? chf(sp)+' di '+chf(b)+' ('+pct(sp/b*100)+')' : 'speso '+chf(sp))+'</em></div>'+
        '<input class="ev" type="number" inputmode="decimal" placeholder="0" value="'+(b>0?b:'')+
        '" oninput="setBudget(\''+k.id+'\',this.value)"></div>'+
        (b>0? '<div class="pb" style="margin:0 0 8px"><i style="width:'+Math.min(100,sp/b*100).toFixed(1)+
          '%;background:'+(sp>b?'var(--warn)':k.c)+'"></i></div>' : '');
    }).join('')+'</div>';
  return h;
}
function setFiltro(cat,need){ S.filtro = {cat:cat, need:need, q:(S.filtro||{}).q||''}; save(); render(); }
function apriCategoria(id){ S.tab='spese'; S.filtro={cat:id, need:null, q:''}; save(); render(); window.scrollTo(0,0); }
function apriEvitabili(){ S.tab='spese'; S.filtro={cat:null, need:2, q:''}; save(); render(); window.scrollTo(0,0); }
function setBudget(id,v){ S.cfg.budget[id] = num(v); save(); }
/* Un budget di partenza onesto: la media di quello che hai davvero speso. */
function suggerisciBudget(){
  var n = 0;
  CATS.forEach(function(k){
    if(pos(S.cfg.budget[k.id])>0) return;
    var mc = mediaCat(k.id, 3, meseOggi());
    if(mc.mesi<2 || mc.media<20) return;
    S.cfg.budget[k.id] = Math.round(mc.media/10)*10;
    n++;
  });
  save(); render();
  toast(n? n+(n===1?' budget impostato sulla tua media':' budget impostati sulle tue medie')
        : 'Servono almeno 2 mesi di storico per suggerire qualcosa.');
}
/* Cosa è successo in un singolo giorno. */
function apriGiorno(d){
  var sp = S.spese.filter(function(s){ return s.d===d; })
    .sort(function(a,b){ return (b.t||0)-(a.t||0); });
  var tot = sommaCHF(sp);
  var h = testa(etichettaGiorno(d));
  h += '<div class="hero" style="margin-bottom:14px"><div class="l">'+dataBreve(d)+'</div>'+
    '<div class="v">CHF '+chf(tot)+'</div><div class="s">'+sp.length+
    (sp.length===1?' spesa registrata':' spese registrate')+'</div></div>';
  h += '<div class="card">'+(sp.length? sp.map(function(x){ return rigaSpesa(x,true); }).join('')
    : '<div class="empty">Niente in questo giorno.</div>')+'</div>';
  h += '<button class="btn ghost" style="margin-top:14px" onclick="chiudi()">Chiudi</button>';
  modal(h);
}

/* ══════════════════════════════════════════════════════════════
   12. RISPARMI
   ══════════════════════════════════════════════════════════════ */
function snapPatrimonio(){
  var d = oggi(), liq = saldoConti(), inv = valoreInvest();
  if(!S.snap) S.snap = [];
  for(var i=0;i<S.snap.length;i++) if(S.snap[i].d===d){ S.snap[i].liq=liq; S.snap[i].inv=inv; save(); return; }
  S.snap.push({d:d, liq:liq, inv:inv});
  if(S.snap.length>400) S.snap = S.snap.slice(-400);
  save();
}
function tabRisparmi(){
  var h='', i;
  var liq = saldoConti(), inv = valoreInvest(), pat = liq+inv;
  var spm = speseMedieMensili();
  var mesiCop = spm>0 ? liq/spm : 0;
  var c = calc(S.mese);
  /* Se non ci sono investimenti "patrimonio" è una parola grossa per il saldo di un conto:
     chiamo le cose con il loro nome e dico da dove viene il numero. */
  h += '<div class="hero"><div class="l">'+(inv>0?'Patrimonio':'Sui conti')+'</div>'+
    '<div class="v">CHF '+chf(pat)+'</div>'+
    '<div class="s">'+(inv>0? chf(liq)+' sui conti · '+chf(inv)+' investiti'
                            : 'Il saldo che hai scritto tu qui sotto')+
    (accantonatoTot()>0?' · '+chf(accantonatoTot())+' già assegnati a obiettivi':'')+'</div></div>';
  h += '<div class="kpi">'+
    '<div><div class="l">Mesi coperti</div><div class="v '+(mesiCop>=3?'pos':'neg')+'">'+(spm>0?mesiCop.toFixed(1):'—')+'</div>'+
      '<div class="s">con '+chf(spm)+'/mese di spese</div></div>'+
    '<div><div class="l">Risparmio mese</div><div class="v '+(c.risparmio>=0?'pos':'neg')+'">'+chf(c.risparmio)+'</div>'+
      '<div class="s">'+(c.entrate>0?pct(c.tasso)+' delle entrate':'—')+'</div></div>'+
    '<div><div class="l">Obiettivo mese</div><div class="v">'+chf(S.cfg.targetRisparmio)+'</div>'+
      '<div class="s">'+(pos(S.cfg.targetRisparmio)? (c.risparmio>=S.cfg.targetRisparmio?'centrato':'mancano '+chf(S.cfg.targetRisparmio-c.risparmio)) :'non impostato')+'</div></div>'+
  '</div>';

  /* Due numeri che si assomigliano ma misurano cose diverse: senza dirlo sembrano
     contraddirsi, e chi guarda pensa che l'app sbagli i conti. */
  if(c.entrate>0 && liq>0){
    h += '<div class="note">Sui conti hai <b>CHF '+chf(liq)+'</b>: è la fotografia di adesso, il saldo che '+
      'aggiorni tu a mano. Questo mese ti è avanzato <b>CHF '+chf(c.risparmio)+'</b>: quello è il flusso, '+
      'entrate meno uscite registrate. Non devono tornare uguali — il primo dice quanto hai, il secondo '+
      'quanto il mese sta producendo — e il secondo entra nel primo solo quando aggiorni il saldo.</div>';
  }

  /* fondo emergenza */
  if(spm>0){
    var target3 = spm*3;
    h += '<div class="h2">Fondo emergenza</div><div class="card">'+
      barraProgresso(liq, target3, mesiCop>=3?'var(--ok)':'var(--amber)')+
      '<div class="pbl"><span>'+chf(liq)+'</span><span>3 mesi = '+chf(target3)+'</span></div>'+
      '<div class="note'+(mesiCop>=3?' ok':' amber')+'">'+(mesiCop>=3
        ? 'Sei coperto per <b>'+mesiCop.toFixed(1)+' mesi</b>. Da qui in avanti ha senso che i soldi in più lavorino invece di stare fermi.'
        : 'Ti mancano <b>CHF '+chf(Math.max(0,target3-liq))+'</b> per arrivare a 3 mesi di autonomia. È il primo mattone: prima di investire, prima di tutto il resto.')+
      '</div></div>';
  }

  /* conti */
  h += '<div class="h2">Conti<button onclick="apriNuovoConto()">+ aggiungi</button></div><div class="card">'+
    (S.conti.length? S.conti.map(function(cn,idx){
      return '<div class="erow"><div class="en">'+esc(cn.nome)+
        '<em>'+(pat>0?pct(num(cn.saldo)/pat*100)+(inv>0?' del patrimonio':' del totale'):'—')+'</em></div>'+
        '<input class="ev" type="number" inputmode="decimal" value="'+esc(cn.saldo||'')+'" onchange="aggiornaSaldo('+idx+',this.value)">'+
        '<button class="del" onclick="delConto('+idx+')">×</button></div>';
    }).join('') : '<div class="empty"><b>Nessun conto</b>Aggiungi almeno il conto dove ti arriva lo stipendio.</div>')+
    '<div class="note">Aggiorna i saldi quando ci pensi, anche solo una volta al mese: ogni modifica lascia un punto sul grafico qui sotto.</div></div>';

  /* andamento */
  var snap = (S.snap||[]).slice(-24);
  if(snap.length>=2){
    h += '<div class="h2">Andamento del patrimonio</div><div class="card">'+
      chartLinea(snap.map(function(s){ return {x:s.d, lab:dataBreve(s.d), v:num(s.liq)+num(s.inv)}; }), 'Patrimonio nel tempo')+
      '</div>';
  }
  /* risparmio mensile */
  var serie = serieMesi(6).filter(function(s){ return s.n>0; });
  if(serie.length>=2){
    h += '<div class="h2">Quanto avanzi ogni mese</div><div class="card">'+
      chartLinea(serie.map(function(s){ return {x:s.m, lab:MESI3[parseInt(s.m.split('-')[1],10)-1], v:s.entrate-s.uscite}; }),'Risparmio mensile','var(--c3)')+
      '</div>';
  }
  /* proiezione */
  var rispM = pos(S.cfg.targetRisparmio) || Math.max(0, mediaUscite(3)>0 ? entrateMese(meseOggi())-mediaUscite(3) : 0);
  if(rispM>0){
    h += '<div class="h2">Se continui così</div><div class="card">'+
      [12,24,60].map(function(mesi){
        return '<div class="row"><div class="n">Tra '+(mesi<24?mesi+' mesi':(mesi/12)+' anni')+
          '<em>solo risparmio, senza rendimenti</em></div><div class="v">'+chf(liq+rispM*mesi)+'</div></div>';
      }).join('')+
      '<div class="note">Calcolato su <b>CHF '+chf(rispM)+'</b> messi via ogni mese. Non tiene conto di aumenti, tredicesima o spese straordinarie.</div></div>';
  }
  return h;
}
function aggiornaSaldo(i,v){
  S.conti[i].saldo = num(v);
  if(!S.conti[i].storico) S.conti[i].storico = [];
  S.conti[i].storico.push({d:oggi(), v:num(v)});
  snapPatrimonio(); save(); render();
}
function delConto(i){
  if(!confirm('Elimino "'+S.conti[i].nome+'"? Lo storico di questo conto va perso.')) return;
  S.conti.splice(i,1); snapPatrimonio(); save(); render();
}

var TIPI_INV = [{id:'etf',n:'ETF / fondo'},{id:'azione',n:'Azione'},{id:'3a',n:'3° pilastro'},

      '<div><div class="l">Guadagno</div><div class="v '+(pl>=0?'pos':'neg')+'">'+(pl>=0?'+':'−')+chf(Math.abs(pl))+'</div>'+
        '<div class="s">'+pct(plq)+'</div></div>'+
      '<div><div class="l">Su patrimonio</div><div class="v">'+(patrimonio()>0?pct(val/patrimonio()*100):'—')+'</div>'+
        '<div class="s">il resto è liquido</div></div>'+
    '</div>';
  }
  h += '<div class="h2">Posizioni<button onclick="apriNuovoInvest()">+ aggiungi</button></div>';
  if(!S.invest.length){
    h += '<div class="card"><div class="empty"><b>Portafoglio vuoto</b>'+
      'Quando inizierai, qui vedrai valore, guadagno e peso di ogni posizione. I prezzi li aggiorni tu: nessun dato esce da questo dispositivo.</div></div>';
  } else {
    h += '<div class="card">'+S.invest.map(function(p,idx){
      var v = inCHF(num(p.qta)*num(p.prezzo), p.val, p.fx||S.cfg.fx);
      var cst = inCHF(num(p.qta)*num(p.pmc), p.val, p.fx||S.cfg.fx);
      var d = v-cst, dq = cst>0?d/cst*100:0;
      return '<div class="row tap" onclick="apriInvest(\''+p.id+'\')">'+
        '<span class="dot" style="background:'+coloreSlot(idx)+'"></span>'+
        '<div class="n">'+esc(p.nome)+'<em>'+fmt(p.qta,num(p.qta)%1?3:0)+' × '+chf2(p.prezzo)+' '+esc(p.val)+
          ' · '+(TIPI_INV.filter(function(t){return t.id===p.tipo;})[0]||{n:'Altro'}).n+'</em></div>'+
        '<div class="v">'+chf(v)+'<span style="color:'+(d>=0?'var(--ok)':'var(--warn)')+'">'+(d>=0?'+':'−')+pct(Math.abs(dq))+'</span></div>'+
      '</div>';
    }).join('')+'</div>';
    /* allocazione */
    h += '<div class="h2">Come è distribuito</div><div class="card">'+
      S.invest.map(function(p,idx){
        var v = inCHF(num(p.qta)*num(p.prezzo), p.val, p.fx||S.cfg.fx);
        var q = val>0?v/val*100:0;
        return '<div class="cbar"><div class="cl">'+esc(p.nome)+'</div>'+
          '<div class="ct"><i style="width:'+Math.max(3,q).toFixed(1)+'%;background:'+coloreSlot(idx)+'"></i></div>'+
          '<div class="cv">'+q.toFixed(0)+'%<em>'+chf(v)+'</em></div></div>';
      }).join('')+'</div>';
    var snapI = (S.snap||[]).filter(function(s){ return num(s.inv)>0; }).slice(-24);
    if(snapI.length>=2){
      h += '<div class="h2">Valore nel tempo</div><div class="card">'+
        chartLinea(snapI.map(function(s){ return {x:s.d, lab:dataBreve(s.d), v:num(s.inv)}; }),'Valore investimenti','var(--c7)')+
        '<div class="note">Il grafico si muove solo quando aggiorni i prezzi: è una fotografia di quando ci hai messo mano, non un tempo reale.</div></div>';
    }
  }
  h += '<div class="note">I prezzi non si aggiornano da soli. Aprire una posizione e scrivere il prezzo di oggi richiede dieci secondi e tiene il dato onesto, senza dipendere da servizi esterni.</div>';
  return h;
}

var PRIO = [{v:0,n:'Alta'},{v:1,n:'Media'},{v:2,n:'Bassa'}];
function fraMesi(n){
  var d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth()+Math.round(n));
  return MESI3[d.getMonth()]+' '+d.getFullYear();
}
function tabObiettivi(){
  var h='', liq = saldoConti(), acc = accantonatoTot(), i;
  var piano = pianoObiettivi();
  var totTarget = S.obiettivi.reduce(function(t,o){ return t+num(o.target); },0);

  h += '<div class="hero"><div class="l">Accantonato</div><div class="v">CHF '+chf(acc)+'</div>'+
    '<div class="s">'+(S.obiettivi.length? 'su '+chf(totTarget)+' di obiettivi' : 'Nessun obiettivo ancora')+
    (acc>liq&&liq>0?' · <b>attenzione: è più della liquidità che hai ('+chf(liq)+')</b>':'')+'</div>'+
    (totTarget>0? '<div class="bar"><i style="width:'+Math.min(100,acc/totTarget*100).toFixed(1)+'%"></i></div>'+
      '<div class="foot"><span>'+pct(acc/totTarget*100)+' del totale</span><span>mancano '+chf(Math.max(0,totTarget-acc))+'</span></div>':'')+
  '</div>';
  h += '<div class="btn2" style="margin-bottom:14px"><button class="btn acc" onclick="apriNuovoObiettivo()">+ Nuovo obiettivo</button></div>';

  if(!S.obiettivi.length){
    h += '<div class="card"><div class="empty"><b>Nessun obiettivo</b>'+
      'Un obiettivo è una cifra con una data: fondo emergenza, cauzione, viaggio. Senza data non posso dirti quanto serve al mese.</div></div>';
    return h;
  }

  /* ── il piano: come si divide quello che avanza ── */
  h += '<div class="h2">Il piano del mese<span class="r">CHF '+chf(piano.disp)+' disponibili</span></div><div class="card">'+
    '<p class="lede">Dalle entrate ('+chf(piano.entrate)+') tolgo le uscite che ti aspetti ('+chf(piano.uscAttese)+
    ', la media dei tuoi ultimi mesi). Quello che resta lo divido fra gli obiettivi: prima la priorità che hai messo tu, '+
    'poi la scadenza più vicina.</p>';
  if(piano.righe.length){
    h += piano.righe.map(function(r){
      var stato;
      if(r.assegnato<=0) stato = 'niente da assegnare';
      else if(r.copre===true) stato = 'in tempo';
      else if(r.copre===false) stato = 'mancano '+chf(r.mancaAlMese)+'/mese';
      else stato = 'circa '+fraMesi(r.mesiPrevisti);
      return '<div class="plan"><span class="dot" style="background:'+
        (r.copre===false?'var(--warn)':(r.assegnato>0?'var(--ok)':'var(--line)'))+'"></span>'+
        '<div class="pn">'+esc(r.o.nome)+'<em>'+esc(stato)+
        (r.o.scad?' · entro '+dataBreve(r.o.scad):'')+'</em></div>'+
        '<div class="pv">'+chf(r.assegnato)+'<span>al mese</span></div></div>';
    }).join('');
    var scoperti = piano.righe.filter(function(r){ return r.copre===false || r.assegnato<=0; });
    if(piano.resta>1){
      h += '<div class="note ok">Dopo aver coperto tutto ti avanzano <b>CHF '+chf(piano.resta)+' al mese</b>. '+
        'Quando il fondo emergenza è pieno, è la parte che può iniziare a lavorare per te.</div>';
    } else if(scoperti.length){
      var serveTot = 0;
      for(i=0;i<scoperti.length;i++) serveTot += (scoperti[i].mancaAlMese || (scoperti[i].serve||0));
      h += '<div class="note amber">'+scoperti.length+(scoperti.length===1?' obiettivo non ci sta':' obiettivi non ci stanno')+
        ' con quello che avanza. Servirebbero <b>CHF '+chf(serveTot)+' al mese in più</b>: '+
        'o sposti una data, o abbassi un importo, o tagli CHF '+chf(serveTot)+' di spese. '+
        'Non c\'è una quarta strada.</div>';
    } else {
      h += '<div class="note">Il piano copre tutto quello che ti sei dato, senza avanzi.</div>';
    }
  } else {
    h += '<div class="empty">Tutti gli obiettivi sono già coperti. Alzane uno o creane un altro.</div>';
  }
  h += '</div>';

  /* ── gli obiettivi, in ordine di piano ── */
  var ordinati = piano.righe.map(function(r){ return r.o; });
  S.obiettivi.forEach(function(o){ if(ordinati.indexOf(o)<0) ordinati.push(o); });

  h += '<div class="h2">Obiettivi<span class="r">'+S.obiettivi.length+'</span></div>';
  h += ordinati.map(function(o){
    var t = num(o.target), a = num(o.acc), q = t>0?Math.min(100,a/t*100):0;
    var manca = Math.max(0, t-a);
    var gg = o.scad? giorniTra(oggi(), o.scad) : null;
    var mesiR = gg!=null? Math.max(0.5, gg/30.4) : null;
    var serve = mesiR? manca/mesiR : null;
    var ok = manca<=0;
    var riga = null;
    for(var z=0;z<piano.righe.length;z++) if(piano.righe[z].o===o) riga = piano.righe[z];
    var ass = riga? riga.assegnato : 0;
    var rischio = !ok && serve!=null && riga && riga.copre===false;

    var testo;
    if(ok) testo = '<div class="note ok">Obiettivo raggiunto. Puoi chiuderlo o alzare l\'asticella.</div>';
    else if(serve!=null){
      testo = '<div class="note'+(rischio?' amber':'')+'">Servono <b>CHF '+chf(serve)+' al mese</b> per arrivarci entro '+
        dataBreve(o.scad)+'. Il piano te ne assegna '+chf(ass)+
        (rischio? ': mancano CHF '+chf(riga.mancaAlMese)+' al mese. Con quello che il piano riesce a darti ci arrivi verso '+
          (riga.mesiPrevisti? fraMesi(riga.mesiPrevisti) : 'mai')+'.' : ': ci arrivi in tempo.')+'</div>';
    }
    else if(ass>0) testo = '<div class="note">Mancano <b>CHF '+chf(manca)+'</b>. Senza scadenza il piano ti assegna '+
      chf(ass)+' al mese: a questo ritmo chiudi verso <b>'+fraMesi(riga.mesiPrevisti)+'</b>. '+
      'Mettici una data e divento più preciso.</div>';
    else testo = '<div class="note">Mancano <b>CHF '+chf(manca)+'</b>. Metti una scadenza e ti dico quanto serve al mese.</div>';

    return '<div class="card"><div style="display:flex;align-items:baseline;gap:8px;margin-bottom:2px">'+
      '<h3 style="font-size:16px;font-weight:600;flex:1">'+esc(o.nome)+'</h3>'+
      '<button class="del" onclick="delObiettivo(\''+o.id+'\')" aria-label="Elimina">×</button></div>'+
      '<div style="font-size:12px;color:var(--mute);margin-bottom:8px">'+
        (o.scad? (gg>0? 'entro '+dataBreve(o.scad)+' · '+gg+' giorni' : 'scaduto il '+dataBreve(o.scad)) : 'senza scadenza')+
        ' · priorità '+esc((PRIO[num(o.prio==null?1:o.prio)]||PRIO[1]).n.toLowerCase())+'</div>'+
      barraProgresso(a,t, ok?'var(--ok)':(rischio?'var(--amber)':'var(--accent)'))+
      '<div class="pbl"><span>'+chf(a)+' di '+chf(t)+'</span><span>'+q.toFixed(0)+'%</span></div>'+
      testo+
      '<div class="field" style="margin:11px 0 0"><label>Priorità nel piano</label><div class="seg">'+
        PRIO.map(function(p){
          return '<button type="button" class="'+(num(o.prio==null?1:o.prio)===p.v?'on':'')+
            '" onclick="setPrio(\''+o.id+'\','+p.v+')">'+p.n+'</button>';
        }).join('')+'</div></div>'+
      '<div class="btn2" style="margin-top:11px">'+
        '<button class="btn ghost sm" onclick="versaObiettivo(\''+o.id+'\')">Accantona</button>'+
        '<button class="btn ghost sm" onclick="apriObiettivo(\''+o.id+'\')">Modifica</button></div>'+
    '</div>';
  }).join('');

  /* ── cosa cambia se metti da parte qualcosa in più ── */
  var primoRischio = null;
  for(i=0;i<piano.righe.length;i++) if(piano.righe[i].copre===false || (piano.righe[i].copre===null && piano.righe[i].manca>0)){
    primoRischio = piano.righe[i]; break;
  }
  if(primoRischio && primoRischio.manca>0){
    h += '<div class="h2">Cosa cambia se tagli qualcosa</div><div class="card">'+
      '<p class="lede">Su "'+esc(primoRischio.o.nome)+'": ogni franco che non spendi è un franco che accorcia l\'attesa.</p>'+
      [50,100,200].map(function(x){
        var nuovo = primoRischio.assegnato + x;
        var mesi = primoRischio.manca/nuovo;
        return '<div class="stat"><em>+ CHF '+x+' al mese</em><b>'+fraMesi(mesi)+'</b></div>';
      }).join('')+
      '<div class="note">Oggi il piano gli assegna CHF '+chf(primoRischio.assegnato)+' al mese'+
      (primoRischio.mesiPrevisti? ', cioè '+fraMesi(primoRischio.mesiPrevisti):'')+'.</div></div>';
  }

  if(acc>liq && liq>0)
    h += '<div class="note warn">Hai assegnato agli obiettivi <b>CHF '+chf(acc)+'</b> ma sui conti ce ne sono '+chf(liq)+
      '. Uno dei due numeri non torna: o aggiorni i saldi, o hai accantonato soldi che non ci sono.</div>';
  return h;
}
function setPrio(id, v){
  for(var i=0;i<S.obiettivi.length;i++) if(S.obiettivi[i].id===id) S.obiettivi[i].prio = v;
  save(); render();
}

      ' Fallo a fine mese: il file finisce nei tuoi download ed è leggibile anche fra dieci anni.</div></div>';

  h += '<div class="card"><div class="row"><div class="n">Bilancio<em>versione 2.0 · '+S.spese.length+' spese registrate</em></div>'+
