function modal(inner){
  document.getElementById('modal').innerHTML =
    '<div class="scrim" onclick="chiudiModale(event)"><div class="sheet" onclick="event.stopPropagation()">'+
    '<div class="grab"></div>'+inner+'</div></div>';
  document.body.style.overflow = 'hidden';
}
function chiudiModale(e){
  if(e && e.target && !e.target.classList.contains('scrim')) return;
  document.getElementById('modal').innerHTML = '';
  document.body.style.overflow = '';
}
function chiudi(){ document.getElementById('modal').innerHTML=''; document.body.style.overflow=''; }
function testa(titolo){
  return '<div class="sh"><h3>'+esc(titolo)+'</h3><button onclick="chiudi()" aria-label="Chiudi">×</button></div>';
}

/* ── nuova / modifica spesa ── */
function apriNuova(){
  S.draft = {id:null, imp:'', val:'CHF', desc:'', d:oggi(), cat:'altro', need:1, diviso:false, manual:false, auto:false};
  renderSheetSpesa();
}
function apriSpesa(id){
  var s = null;
  for(var i=0;i<S.spese.length;i++) if(S.spese[i].id===id) s = S.spese[i];
  if(!s) return;
  S.draft = {id:s.id, imp:s.imp, val:s.val, desc:s.desc, d:s.d, cat:s.cat, need:num(s.need),
    diviso:!!s.diviso, manual:true, auto:false, ric:s.ric};
  renderSheetSpesa();
}
function renderSheetSpesa(){
  var d = S.draft;
  var h = testa(d.id?'Modifica spesa':'Nuova spesa');
  h += '<div class="inline" style="margin-bottom:12px">'+
    '<input type="number" inputmode="decimal" id="dImp" value="'+esc(d.imp)+'" placeholder="0.00" '+
      'style="font-size:26px;font-weight:600;text-align:right;padding:14px" oninput="S.draft.imp=this.value">'+
    '<div class="seg xs" style="width:104px;flex:none">'+['CHF','EUR'].map(function(v){
      return '<button type="button" class="'+(d.val===v?'on':'')+'" onclick="setValutaDraft(\''+v+'\')">'+v+'</button>';
    }).join('')+'</div></div>';
  if(d.val==='EUR') h += '<div class="note" id="fxNote" style="margin-top:0;margin-bottom:12px">Al cambio '+
    S.cfg.fx+' fanno circa <b>CHF '+chf2(inCHF(num(d.imp)||0,'EUR',S.cfg.fx))+'</b>.</div>';
  h += '<div class="field"><label>Cos\'era</label>'+
    '<input type="text" id="dDesc" value="'+esc(d.desc)+'" placeholder="Es. Esselunga, benzina, cena fuori" '+
    'oninput="onDesc(this.value)" autocomplete="off"></div>';
  h += '<div class="field"><label>Quando</label><input type="date" value="'+esc(d.d)+'" max="'+oggi()+
    '" onchange="S.draft.d=this.value"></div>';
  h += '<div id="catBox">'+boxCategoria()+'</div>';
  if(S.cfg.chiedeNecessita!==false){
    h += '<div class="field"><label>Serviva?</label>'+segNecessita(d.need,'setNeedDraft')+
      '<div class="hint">È la domanda che fa la differenza a fine mese. Rispondi di pancia, ci metti un secondo.</div></div>';
  }
  h += '<div class="field"><label>Divisa con qualcuno</label><div class="seg">'+
    [[false,'Tutta mia'],[true,'Metà a testa']].map(function(o){
      return '<button type="button" class="'+(!!d.diviso===o[0]?'on':'')+'" onclick="setDivisoDraft('+o[0]+')">'+o[1]+'</button>';
    }).join('')+'</div><div class="hint">Con "metà a testa" registro solo la tua parte, ma resta scritto quanto hai anticipato.</div></div>';
  h += '<div class="btn2" style="margin-top:16px">'+
    (d.id?'<button class="btn ghost" style="color:var(--warn)" onclick="eliminaSpesa(\''+d.id+'\')">Elimina</button>':'')+
    '<button class="btn acc" id="btnSalvaSpesa" onclick="salvaSpesa()">'+(d.id?'Salva':'Aggiungi')+'</button></div>';
  modal(h);
  setTimeout(function(){ var el=document.getElementById(d.id?'dDesc':'dImp'); if(el) el.focus(); }, 60);
}
function boxCategoria(){
  var d = S.draft;
  return '<div class="field"><label>Categoria'+
    (d.auto&&!d.manual?' <span class="tagline" style="margin-left:6px">riconosciuta</span>':'')+'</label>'+
    '<div class="chips">'+CATS.map(function(k){
      return '<button type="button" class="'+(d.cat===k.id?'on':'')+'" onclick="setCatDraft(\''+k.id+'\')">'+
        '<i style="background:'+k.c+'"></i>'+esc(k.nome)+'</button>';
    }).join('')+'</div>'+
    (d.auto&&!d.manual?'<div class="hint">L\'ho dedotta da quello che hai scritto. Se sbaglio, tocca quella giusta: me la ricordo per la prossima volta.</div>':'')+
  '</div>';
}
function onDesc(v){
  S.draft.desc = v;
  if(S.draft.manual) return;
  var r = detect(v);
  if(r.sicura){
    S.draft.cat = r.cat; S.draft.need = r.need; S.draft.auto = true;
    var box = document.getElementById('catBox');
    if(box) box.innerHTML = boxCategoria();
    var seg = document.querySelector('.seg.needs');
    if(seg) seg.outerHTML = segNecessita(S.draft.need,'setNeedDraft');
  }
}
function setCatDraft(id){
  S.draft.cat = id; S.draft.manual = true;
  var box = document.getElementById('catBox'); if(box) box.innerHTML = boxCategoria();
}
function setNeedDraft(n){
  S.draft.need = n;
  var seg = document.querySelector('.seg.needs');
  if(seg) seg.outerHTML = segNecessita(n,'setNeedDraft');
}
function setValutaDraft(v){ S.draft.val = v; renderSheetSpesa(); }
function setDivisoDraft(b){ S.draft.diviso = b; renderSheetSpesa(); }
function salvaSpesa(){
  var d = S.draft, imp = num(d.imp);
  if(imp<=0){ alert('Manca l\'importo.'); return; }
  var fx = S.cfg.fx;
  var chfTot = inCHF(imp, d.val, fx);
  var mio = d.diviso ? chfTot/2 : chfTot;
  if(d.manual && d.desc) imparaRegola(d.desc, d.cat, d.need);
  if(d.id){
    for(var i=0;i<S.spese.length;i++) if(S.spese[i].id===d.id){
      var vecchia = S.spese[i];
      S.spese[i] = {id:d.id, d:d.d, imp:imp, val:d.val, fx:vecchia.fx||fx, chf:mio, desc:d.desc,
        cat:d.cat, need:d.need, diviso:d.diviso, ric:vecchia.ric, t:vecchia.t};
      if(d.val==='EUR') S.spese[i].chf = (d.diviso?0.5:1)*inCHF(imp,'EUR',vecchia.fx||fx);
    }
  } else {
    S.spese.push({id:uid(), d:d.d, imp:imp, val:d.val, fx:fx, chf:mio, desc:d.desc,
      cat:d.cat, need:d.need, diviso:d.diviso, ric:false, t:Date.now()});
    if(meseDi(d.d)!==S.mese && meseDi(d.d)<=meseOggi()) S.mese = meseDi(d.d);
  }
  S.draft = null; save(); chiudi(); render();
}
function eliminaSpesa(id){
  if(!confirm('Elimino questa spesa?')) return;
  S.spese = S.spese.filter(function(s){ return s.id!==id; });
  save(); chiudi(); render();
}

/* ── spese fisse ── */
function apriRicorrenti(){ renderSheetRic(); }
function aggiornaSheetRic(){
  var m = document.getElementById('modal');
  if(m && m.innerHTML) renderSheetRic();
}
function renderSheetRic(){
  var m = S.mese;
  var h = testa('Spese fisse');
  h += '<p class="lede">Quelle che paghi ogni mese. Con "aggiungi" le registro nel mese che stai guardando ('+nomeMese(m)+'), '+
    'con la data e la categoria giuste, senza riscriverle.</p>';
  var attive = S.ricorrenti.filter(function(r){ return r.attiva!==false; });
  var daFare = attive.filter(function(r){ return S.applicati.indexOf(m+'|'+r.id)<0; });
  if(daFare.length) h += '<button class="btn acc" style="margin-bottom:14px" onclick="applicaTutte()">Aggiungi tutte a '+nomeMese(m,1)+' ('+chf(daFare.reduce(function(t,r){return t+inCHF(r.imp,r.val,r.fx||S.cfg.fx);},0))+')</button>';
  h += '<div class="card">'+(S.ricorrenti.length? S.ricorrenti.map(function(r,i){
    var fatta = S.applicati.indexOf(m+'|'+r.id)>=0;
    var off = r.attiva===false;
    return '<div class="erow" style="'+(off?'opacity:.45':'')+'">'+
      '<span class="dot" style="background:'+cat(r.cat).c+'"></span>'+
      '<div class="en">'+esc(r.nome)+'<em>'+cat(r.cat).nome+' · '+esc(r.val||'CHF')+'</em></div>'+
      '<input class="ev" type="number" inputmode="decimal" value="'+esc(r.imp||'')+'" oninput="S.ricorrenti['+i+'].imp=num(this.value);save()">'+
      '<button class="del" style="font-size:13px;color:'+(fatta?'var(--ok)':'var(--accent)')+';font-weight:600" '+
        'onclick="'+(fatta?'annullaRic':'applicaRic')+'(\''+r.id+'\')">'+(fatta?'fatta':'aggiungi')+'</button>'+
      '<button class="del" onclick="toggleRic(\''+r.id+'\')" title="Attiva/sospendi">'+(off?'▷':'❚❚')+'</button>'+
      '<button class="del" onclick="delRic(\''+r.id+'\')">×</button></div>';
  }).join('') : '<div class="empty">Nessuna spesa fissa.</div>')+'</div>';
  h += '<div class="h2">Aggiungine una</div>'+
    '<div class="addrow"><input type="text" id="nrNome" placeholder="Nome">'+
    '<input class="sm" type="number" inputmode="decimal" id="nrImp" placeholder="CHF">'+
    '<button onclick="addRicorrente()">+</button></div>'+
    '<div class="note">Totale fisse attive: <b>CHF '+chf(totRicorrenti())+' al mese</b>, cioè '+chf(totRicorrenti()*12)+' all\'anno.</div>';
  h += '<button class="btn ghost" style="margin-top:14px" onclick="chiudi()">Chiudi</button>';
  modal(h);
}
function addRicorrente(){
  var n = document.getElementById('nrNome'), v = document.getElementById('nrImp');
  if(!n||!n.value.trim()) return;
  var d = detect(n.value);
  S.ricorrenti.push({id:uid(), nome:n.value.trim(), imp:num(v.value), val:'CHF', cat:d.cat, need:d.need, attiva:true});
  save(); aggiornaSheetRic(); render();
}
function toggleRic(id){
  for(var i=0;i<S.ricorrenti.length;i++) if(S.ricorrenti[i].id===id)
    S.ricorrenti[i].attiva = (S.ricorrenti[i].attiva===false);
  save(); aggiornaSheetRic(); render();
}
function delRic(id){
  S.ricorrenti = S.ricorrenti.filter(function(r){ return r.id!==id; });
  save(); aggiornaSheetRic(); render();
}
function applicaRic(id){
  var r = null, i;
  for(i=0;i<S.ricorrenti.length;i++) if(S.ricorrenti[i].id===id) r = S.ricorrenti[i];
  if(!r || num(r.imp)<=0){ alert('Prima metti l\'importo.'); return; }
  var m = S.mese;
  var giorno = Math.min(num(r.giorno)||1, giorniMese(m));
  var data = m+'-'+String(giorno).padStart(2,'0');
  if(m===meseOggi() && data>oggi()) data = oggi();
  S.spese.push({id:uid(), d:data, imp:num(r.imp), val:r.val||'CHF', fx:S.cfg.fx,
    chf:inCHF(r.imp, r.val, S.cfg.fx), desc:r.nome, cat:r.cat, need:num(r.need), diviso:false,
    ric:true, ricId:r.id, t:Date.now()});
  S.applicati.push(m+'|'+r.id);
  save(); aggiornaSheetRic(); render();
}
function annullaRic(id){
  var m = S.mese;
  S.spese = S.spese.filter(function(s){ return !(s.ricId===id && meseDi(s.d)===m); });
  S.applicati = S.applicati.filter(function(k){ return k!==m+'|'+id; });
  save(); aggiornaSheetRic(); render();
}
function applicaTutteDa(m){
  var prima = S.mese;
  S.mese = m; applicaTutte(); S.mese = prima; save(); render();
}
function applicaTutte(){
  var m = S.mese;
  S.ricorrenti.forEach(function(r){
    if(r.attiva===false || num(r.imp)<=0) return;
    if(S.applicati.indexOf(m+'|'+r.id)>=0) return;
    applicaRic(r.id);
  });
  aggiornaSheetRic(); render();
}

/* ── conti ── */
function apriNuovoConto(){
  var h = testa('Nuovo conto')+
    '<div class="chips" style="margin-bottom:14px">'+PRESET_CONTI.map(function(p){
      return '<button onclick="document.getElementById(\'ncN\').value=\''+p+'\'">'+esc(p)+'</button>'; }).join('')+'</div>'+
    '<div class="field"><label>Nome</label><input type="text" id="ncN" placeholder="Es. Conto risparmio"></div>'+
    '<div class="field"><label>Saldo attuale (CHF)</label><input type="number" inputmode="decimal" id="ncS" placeholder="0"></div>'+
    '<button class="btn acc" onclick="salvaConto()">Aggiungi</button>';
  modal(h);
}
function salvaConto(){
  var n = document.getElementById('ncN'), v = document.getElementById('ncS');
  if(!n.value.trim()){ alert('Manca il nome.'); return; }
  S.conti.push({id:uid(), nome:n.value.trim(), saldo:num(v.value), storico:[{d:oggi(), v:num(v.value)}]});
  snapPatrimonio(); save(); chiudi(); render();
}

/* ── investimenti ── */
function apriNuovoInvest(){
  var h = testa('Nuova posizione')+
    '<div class="field"><label>Nome</label><input type="text" id="iN" placeholder="Es. VWCE, Swisscanto 3a"></div>'+
    '<div class="field"><label>Tipo</label><select id="iT">'+TIPI_INV.map(function(t){
      return '<option value="'+t.id+'">'+t.n+'</option>'; }).join('')+'</select></div>'+
    '<div class="inline" style="margin-bottom:14px">'+
      '<div class="field" style="margin:0"><label>Quantità</label><input type="number" inputmode="decimal" id="iQ" value="1"></div>'+
      '<div class="field" style="margin:0"><label>Prezzo medio</label><input type="number" inputmode="decimal" id="iP" placeholder="0"></div>'+
      '<div class="field" style="margin:0;flex:none;width:88px"><label>Valuta</label><select id="iV"><option>CHF</option><option>EUR</option></select></div>'+
    '</div>'+
    '<div class="field"><label>Prezzo attuale</label><input type="number" inputmode="decimal" id="iA" placeholder="uguale al medio se non lo sai"></div>'+
    '<div class="note">Per un 3° pilastro o un conto titoli senza quote: lascia quantità 1 e metti il valore versato come prezzo medio, il valore di oggi come prezzo attuale.</div>'+
    '<button class="btn acc" style="margin-top:14px" onclick="salvaInvest()">Aggiungi</button>';
  modal(h);
}
function salvaInvest(){
  var n = document.getElementById('iN').value.trim();
  if(!n){ alert('Manca il nome.'); return; }
  var pmc = num(document.getElementById('iP').value);
  var att = num(document.getElementById('iA').value) || pmc;
  S.invest.push({id:uid(), nome:n, tipo:document.getElementById('iT').value,
    qta:num(document.getElementById('iQ').value)||1, pmc:pmc, prezzo:att,
    val:document.getElementById('iV').value, fx:S.cfg.fx, storico:[{d:oggi(), v:att}]});
  snapPatrimonio(); save(); chiudi(); render();
}
function apriInvest(id){
  var p=null,i;
  for(i=0;i<S.invest.length;i++) if(S.invest[i].id===id) p=S.invest[i];
  if(!p) return;
  var v = inCHF(num(p.qta)*num(p.prezzo), p.val, p.fx||S.cfg.fx);
  var c = inCHF(num(p.qta)*num(p.pmc), p.val, p.fx||S.cfg.fx);
  var h = testa(p.nome)+
    '<div class="kpi"><div><div class="l">Valore</div><div class="v">'+chf(v)+'</div></div>'+
    '<div><div class="l">Costo</div><div class="v">'+chf(c)+'</div></div>'+
    '<div><div class="l">Guadagno</div><div class="v '+(v-c>=0?'pos':'neg')+'">'+(v-c>=0?'+':'−')+chf(Math.abs(v-c))+'</div></div></div>'+
    '<div class="field"><label>Prezzo di oggi ('+esc(p.val)+')</label>'+
      '<input type="number" inputmode="decimal" id="pPrezzo" value="'+esc(p.prezzo)+'"></div>'+
    '<button class="btn acc" onclick="aggiornaPrezzo(\''+id+'\')">Aggiorna prezzo</button>'+
    '<div class="h2">Nuovo versamento</div>'+
    '<p class="lede">Hai comprato altre quote? Scrivi quante e a che prezzo: ricalcolo io il prezzo medio di carico.</p>'+
    '<div class="addrow"><input class="sm" type="number" inputmode="decimal" id="vQ" placeholder="quantità">'+
    '<input class="sm" type="number" inputmode="decimal" id="vP" placeholder="prezzo">'+
    '<button onclick="aggiungiQuote(\''+id+'\')">+</button></div>'+
    '<div class="btn2" style="margin-top:18px"><button class="btn ghost" style="color:var(--warn)" onclick="delInvest(\''+id+'\')">Elimina</button>'+
    '<button class="btn ghost" onclick="chiudi()">Chiudi</button></div>';
  modal(h);
}
function aggiornaPrezzo(id){
  var v = num(document.getElementById('pPrezzo').value);
  for(var i=0;i<S.invest.length;i++) if(S.invest[i].id===id){
    S.invest[i].prezzo = v;
    if(!S.invest[i].storico) S.invest[i].storico=[];
    S.invest[i].storico.push({d:oggi(), v:v});
  }
  snapPatrimonio(); save(); chiudi(); render();
}
function aggiungiQuote(id){
  var q = num(document.getElementById('vQ').value), pr = num(document.getElementById('vP').value);
  if(q<=0||pr<=0){ alert('Servono quantità e prezzo.'); return; }
  for(var i=0;i<S.invest.length;i++) if(S.invest[i].id===id){
    var p = S.invest[i];
    var qTot = num(p.qta)+q;
    p.pmc = (num(p.qta)*num(p.pmc) + q*pr)/qTot;
    p.qta = qTot; p.prezzo = pr;
  }
  snapPatrimonio(); save(); chiudi(); render();
}
function delInvest(id){
  if(!confirm('Elimino questa posizione?')) return;
  S.invest = S.invest.filter(function(p){ return p.id!==id; });
  snapPatrimonio(); save(); chiudi(); render();
}

/* ── obiettivi ── */
function apriNuovoObiettivo(){ apriObiettivo(null); }
function apriObiettivo(id){
  var o = null, i;
  if(id) for(i=0;i<S.obiettivi.length;i++) if(S.obiettivi[i].id===id) o = S.obiettivi[i];
  var nuovo = !o;
  o = o || {id:null, nome:'', target:'', acc:0, scad:''};
  var h = testa(nuovo?'Nuovo obiettivo':'Modifica obiettivo');
  if(nuovo) h += '<div class="chips" style="margin-bottom:14px">'+PRESET_OB.map(function(p){
    return '<button onclick="document.getElementById(\'oN\').value=\''+p+'\'">'+esc(p)+'</button>'; }).join('')+'</div>';
  h += '<div class="field"><label>Nome</label><input type="text" id="oN" value="'+esc(o.nome)+'" placeholder="Es. Cauzione casa"></div>'+
    '<div class="field"><label>Quanto ti serve (CHF)</label><input type="number" inputmode="decimal" id="oT" value="'+esc(o.target)+'" placeholder="0"></div>'+
    '<div class="field"><label>Entro quando</label><input type="date" id="oD" value="'+esc(o.scad)+'">'+
    '<div class="hint">Senza una data non posso calcolare quanto serve al mese.</div></div>'+
    '<div class="field"><label>Già messi da parte (CHF)</label><input type="number" inputmode="decimal" id="oA" value="'+esc(o.acc||'')+'" placeholder="0"></div>'+
    '<button class="btn acc" onclick="salvaObiettivo('+(o.id?'\''+o.id+'\'':'null')+')">Salva</button>';
  modal(h);
}
function salvaObiettivo(id){
  var n = document.getElementById('oN').value.trim();
  if(!n){ alert('Manca il nome.'); return; }
  var dati = {nome:n, target:num(document.getElementById('oT').value),
    scad:document.getElementById('oD').value, acc:num(document.getElementById('oA').value)};
  if(id){
    for(var i=0;i<S.obiettivi.length;i++) if(S.obiettivi[i].id===id){
      S.obiettivi[i].nome=dati.nome; S.obiettivi[i].target=dati.target;
      S.obiettivi[i].scad=dati.scad; S.obiettivi[i].acc=dati.acc;
    }
  } else {
    S.obiettivi.push({id:uid(), nome:dati.nome, target:dati.target, scad:dati.scad, acc:dati.acc, creato:oggi()});
  }
  save(); chiudi(); render();
}
function versaObiettivo(id){
  var o=null,i;
  for(i=0;i<S.obiettivi.length;i++) if(S.obiettivi[i].id===id) o=S.obiettivi[i];
  if(!o) return;
  var manca = Math.max(0, num(o.target)-num(o.acc));
  var h = testa('Accantona su "'+o.nome+'"')+
    '<p class="lede">Assegni una parte dei tuoi risparmi a questo obiettivo. Non muove soldi tra i conti: serve a sapere quanto di quello che hai è già promesso.</p>'+
    '<div class="field"><label>Quanto (CHF)</label><input type="number" inputmode="decimal" id="vaImp" '+
      'value="'+(pos(S.cfg.targetRisparmio)?Math.min(manca||pos(S.cfg.targetRisparmio),pos(S.cfg.targetRisparmio)):'')+'" placeholder="0"></div>'+
    '<div class="note">Ora ci sono <b>CHF '+chf(o.acc)+'</b>'+(num(o.target)>0?', mancano '+chf(manca):'')+'.</div>'+
    '<div class="btn2" style="margin-top:14px"><button class="btn ghost" onclick="versaImporto(\''+id+'\',-1)">Togli</button>'+
    '<button class="btn acc" onclick="versaImporto(\''+id+'\',1)">Aggiungi</button></div>';
  modal(h);
}
function versaImporto(id, segno){
  var v = num(document.getElementById('vaImp').value)*segno;
  for(var i=0;i<S.obiettivi.length;i++) if(S.obiettivi[i].id===id)
    S.obiettivi[i].acc = Math.max(0, num(S.obiettivi[i].acc)+v);
  save(); chiudi(); render();
}
function delObiettivo(id){
  if(!confirm('Elimino questo obiettivo?')) return;
  S.obiettivi = S.obiettivi.filter(function(o){ return o.id!==id; });
  save(); render();
}

/* ══════════════════════════════════════════════════════════════
   17. BACKUP
   ══════════════════════════════════════════════════════════════ */
function scarica(nome, testo, tipo){
  try{
    var b = new Blob([testo], {type:tipo||'application/json'});
    var u = URL.createObjectURL(b);
    var a = document.createElement('a');
    a.href = u; a.download = nome; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 1500);
  }catch(e){ alert('Il browser ha bloccato il download. Prova ad aprire l\'app dal link, non da un\'anteprima.'); }
}
function esportaJSON(){
  scarica('bilancio-'+oggi()+'.json', JSON.stringify(S,null,1));
}
function esportaCSV(){
  var righe = [['data','descrizione','categoria','necessita','importo','valuta','chf','divisa','fissa'].join(';')];
  S.spese.slice().sort(function(a,b){ return a.d<b.d?-1:1; }).forEach(function(s){
    righe.push([s.d, '"'+String(s.desc||'').replace(/"/g,'""')+'"', cat(s.cat).nome,
      NEEDS[num(s.need)]?NEEDS[num(s.need)].breve:'utile', num(s.imp).toFixed(2), s.val,
      num(s.chf).toFixed(2), s.diviso?'si':'no', s.ric?'si':'no'].join(';'));
  });
  scarica('spese-'+oggi()+'.csv', righe.join('\n'), 'text/csv');
}
function importaJSON(input){
  var f = input.files && input.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!d || !d.cfg || !Array.isArray(d.spese)) throw new Error('formato');
      if(!confirm('Sostituisco i dati attuali con il backup del '+(d.spese.length)+' spese? L\'operazione non si annulla.')) return;
      S = normalizza(d); save(); render();
      alert('Backup ripristinato.');
    }catch(e){ alert('Questo file non sembra un backup di Bilancio.'); }
  };
  r.readAsText(f);
  input.value = '';
}
function azzera(){
  if(!confirm('Cancello tutto: spese, conti, investimenti, obiettivi. Sicuro?')) return;
  if(!confirm('Ultima conferma. Hai fatto il backup?')) return;
  S = statoIniziale(); save(); render();
}

/* ══════════════════════════════════════════════════════════════
   18. SHELL
   ══════════════════════════════════════════════════════════════ */
var TABS = [
  {k:'home', n:'Riepilogo', p:'M3 10.5 12 3l9 7.5M5.5 9.5V21h13V9.5'},
  {k:'spese', n:'Spese', p:'M3 7h18M3 12h18M3 17h11'},
  {k:'risparmi', n:'Risparmi', p:'M4 19V9m5 10V5m5 14v-7m5 7V8'},
  {k:'invest', n:'Investimenti', p:'M3 17l5.5-5.5 3.5 3.5L21 6M21 6h-5m5 0v5'},
  {k:'obiettivi', n:'Obiettivi', p:'M12 3v18M3 12h18M12 7.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z'}
];
var TITOLI = {home:'Riepilogo', spese:'Spese', risparmi:'Risparmi', invest:'Investimenti', obiettivi:'Obiettivi', set:'Impostazioni'};
function sottotitolo(){
  var t = S.tab;
  if(t==='home') return S.cfg.nome? 'Ciao '+S.cfg.nome.toUpperCase() : 'IL TUO MESE';
  if(t==='spese') return 'CATEGORIE E BUDGET';
  if(t==='risparmi') return 'LIQUIDITÀ E FONDO EMERGENZA';
  if(t==='invest') return 'PORTAFOGLIO';
  if(t==='obiettivi') return 'DOVE STAI ANDANDO';
  return 'DATI E PREFERENZE';
}
function render(){
  var app = document.getElementById('app');
  if(!S.setup){ app.innerHTML = viewSetup(); return; }
  var body =
    S.tab==='spese' ? tabSpese() :
    S.tab==='risparmi' ? tabRisparmi() :
    S.tab==='invest' ? tabInvest() :
    S.tab==='obiettivi' ? tabObiettivi() :
    S.tab==='set' ? tabSet() : tabHome();
  var h = '<div class="top"><div class="ttl"><h1>'+TITOLI[S.tab]+'</h1><div class="sub">'+esc(sottotitolo())+'</div></div>'+
    '<button class="ico" onclick="go(\''+(S.tab==='set'?'home':'set')+'\')" aria-label="Impostazioni">'+
    (S.tab==='set'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>')+
    '</button></div>';
  h += '<div class="wrap">'+body+'</div>';
  h += '<div class="tabs">'+TABS.map(function(t){
    return '<button class="tab '+(S.tab===t.k?'on':'')+'" onclick="go(\''+t.k+'\')">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="'+t.p+'"/></svg>'+
      '<span>'+t.n+'</span></button>';
  }).join('')+'</div>';
  if(S.tab!=='set') h += '<button class="fab" onclick="apriNuova()" aria-label="Nuova spesa">+</button>';
  app.innerHTML = h;
}
function go(k){
  S.tab = k;
  if(k==='spese') S.filtro = {cat:null, need:null};
  save(); render(); window.scrollTo(0,0);
}

/* ══════════════════════════════════════════════════════════════
   19. AVVIO
   ══════════════════════════════════════════════════════════════ */
function normalizza(d){
  var base = statoIniziale();
  var s = Object.assign({}, base, d||{});
  s.cfg = Object.assign({}, base.cfg, (d&&d.cfg)||{});
  ['spese','ricorrenti','conti','invest','obiettivi','regole','letti','applicati','snap'].forEach(function(k){
    if(!Array.isArray(s[k])) s[k] = [];
  });
  if(!s.cfg.budget || typeof s.cfg.budget!=='object') s.cfg.budget = {};
  if(!Array.isArray(s.cfg.extra)) s.cfg.extra = [];
  s.spese = s.spese.filter(function(x){ return x && x.id && x.d; }).map(function(x){
    x.chf = num(x.chf); x.imp = num(x.imp); x.need = num(x.need);
    if(!x.val) x.val = 'CHF';
    if(!x.cat || !CATS.some(function(k){ return k.id===x.cat; })) x.cat = 'altro';
    return x;
  });
  s.mese = meseOggi();
  s.filtro = {cat:null, need:null};
  s.draft = null;
  return s;
}
function avvia(){
  S = normalizza(load());
  if(!S.snap.length && (saldoConti()>0 || valoreInvest()>0)) snapPatrimonio();
  render();
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') chiudi();
});
avvia();
</script>
